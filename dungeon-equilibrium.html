<div id="encounter-subnav"><a href="#encounter-barant-imperium-forces">Barant Imperium Forces</a> <a href="#encounter-search-for-imperial-intelligence">Search for Imperial Intelligence</a> <a href="#encounter-harrow-dredgen-apprentice">Harrow, Dredgen-Apprentice</a> <a href="#encounter-board-the-malphas-contemptus-and-infiltrate-the-command-ship">Board the Malphas Contemptus and Infiltrate the Command Ship</a> <a href="#encounter-dredgen-sere">Dredgen Sere</a></div></div> <section id="content">Overview
<p>Equilibrium is Renegades' launch dungeon, and it's built almost entirely around one mechanic, Gathering Shadow, that keeps getting more demanding as you go. You'll spend the whole run picking up Darkness pools to build a stacking buff, then spending that buff on doors, shields, and eventually the final boss's own throne world. Learn the buff economy in the first encounter and the rest of the dungeon is the same idea with more steps bolted on.</p>
<h2>Encounters</h2><div id="encounter-barant-imperium-forces">1
<h3>Barant Imperium Forces</h3>
<strong>Objective</strong> Break the shields on six Nameless Apprentices using a Darkness-fueled grenade, while managing a fireteam-killing debuff in the tunnels where you earn it.
<strong>Roles</strong> A couple of players ride Sparrows through the side tunnels collecting Gathering Shadow while everyone else holds the main arena and manages Apprentices.
<ol><li>Lure an Apprentice to one of the three Cabal devices near the arena's red barriers, then activate the pylon at either end of that device.</li><li>Get close enough that the Apprentice starts charging Darkness energy: if they unleash their attack while the pylon is up, it charges the device and drops that barrier.</li><li>Send a player (or two) into the tunnels beyond on a Sparrow to collect Gathering Shadow pools. The Creeping Shadow debuff will kill you if you linger too long between pickups, so keep moving and grabbing pools to reset it.</li><li>Once you've collected enough to reach Shadow Novice, your grenade swaps into a special Shadow attack, and Shadow Novice also cancels the Creeping Shadow debuff outright.</li><li>When an Apprentice throws out its Darkness attack, use the Shadow grenade on it to strip the shield, then finish it off.</li><li>Every Apprentice kill drops a Cabal pod carrying more adds and a yellow-bar Behemoth walker. Get out from under the pod itself, since it kills on landing.</li><li>Repeat until all six Apprentices and every Behemoth are dead to spawn the loot chest.</li></ol>
<strong>What wipes you</strong> No hard wipe: the danger is a drop pod landing on someone, or losing whoever's in the tunnels to the Creeping Shadow debuff if they run dry on Gathering Shadow pickups.</div><div id="encounter-search-for-imperial-intelligence">2
<h3>Search for Imperial Intelligence</h3>
<strong>Objective</strong> A platforming section through the Harvester jump ship's hangar and maintenance tunnels to reach the first boss arena.
<strong>Roles</strong> No fixed roles. Move as a group, since at least one door needs the full fireteam standing at it to open.
<ol><li>Climb from the red-lit hangar onto the hanging platform above it, then across to a smaller platform with a breakable grate, then shoot it out to drop down.</li><li>Wait at the door ahead until all three lights above it turn green, which only happens once the whole fireteam has arrived.</li><li>Work through the hallways beyond, shooting fuses to open barriers and drop into the marked maintenance shaft when you reach it.</li><li>Continue through to the breakable grates near a small barricade, which leads into the first boss arena.</li><li>Don't shoot out the window you'll pass: it vents you into space.</li></ol>
<strong>What wipes you</strong> No wipe mechanic. This is pure traversal, though a badly timed jump or an explosive trapped hatch can still kill you outright.</div><div id="encounter-harrow-dredgen-apprentice">3
<h3>Harrow, Dredgen-Apprentice</h3>
<strong>Objective</strong> Break a dual-blade-wielding Gladiator's shield using the Shadow buff twice over, then chase him down after he tries to flee partway through his health bar.
<strong>Roles</strong> Everyone clears adds and hunts Lackeys together; whoever reaches Shadow Apprentice handles closing the Darkness panels and triggering the shield-break mechanisms.
<ol><li>Shoot the fuse in the Rally Flag room to drop into the arena and start the fight.</li><li>Clear the first wave of enemies, then wait for more to open side doors leading into the surrounding hallways.</li><li>Hunt down Lackey enemies in those side rooms, which drop the Darkness energy needed to reach Shadow Novice, then Shadow Apprentice (roughly double the Shadow of Novice).</li><li>With Shadow Apprentice, use your special grenade on the correct Darkness-covered panel in each of the three side rooms: three panels closed per room, confirmed by the door lights turning green.</li><li>Back in the main arena, drop Harrow's shield one of two ways: lure him onto the red bay doors and shoot the nearby fuse to open a floor hole he falls into, or light up the four corner pylons via the Darkness devices and bait one of his own attacks into hitting a pylon.</li><li>Once his shield drops, you have about 30 seconds to deal damage before he goes immune again, and the pylons/fuses don't reset, so you likely only get three total damage phases.</li><li>At the health split, his shield resets and he cuts through the back wall to flee. Chase him down the hallway immediately, since his shield falters again there and gives you a short window to finish him.</li></ol>
<strong>What wipes you</strong> No instant wipe, but running out of intact pylons/fuses before he's dead means starting the encounter over, and hesitating when he breaches the back wall can let him escape the damage window entirely.</div><div id="encounter-board-the-malphas-contemptus-and-infiltrate-the-command-ship">4
<h3>Board the Malphas Contemptus and Infiltrate the Command Ship</h3>
<strong>Objective</strong> A second platforming stretch across the Harvester's hull and into the Malphas Contemptus, ending at the final boss's door.
<strong>Roles</strong> No fixed roles. Move together, and have someone hold at least the Shadow Apprentice buff to open the panel that reveals the path forward.
<ol><li>Use Shadow Apprentice on one of the Darkness panels near where you fought Harrow to reveal a switch, then flip it to open the bay door.</li><li>Jump down onto the Malphas Contemptus as it pulls in below, then work through the red-lit switches, blast doors, and platforms along its underside.</li><li>Find the correct grate among several identical-looking ones at the bottom of a shaft (most are dead ends), then continue up through the ship's interior.</li><li>Rebuild Shadow Apprentice to reach a high pipe across a large chamber. There are multiple ways up if you've got strand grapple, an Eager Edge sword, or similar mobility tools.</li><li>Clear the two Praetorians guarding the hallway just past the pipe to reach the final boss door.</li></ol>
<strong>What wipes you</strong> No wipe mechanic. Again, pure traversal, but the timing window on the Darkness panel near the high pipe is tight enough to cost you a lot of backtracking if you miss it.</div><div id="encounter-dredgen-sere">5
<h3>Dredgen Sere</h3>
<strong>Objective</strong> Cycle between building Gathering Shadow to Shadow Master, clearing a Taken mirror of the arena, and destroying five Taken orbs in both planes to earn a damage phase on the final boss.
<strong>Roles</strong> Split attention between building Shadow, hunting Nameless Apprentices to open orbs, and Compelling the five Blistered Shadows once teleported into the Taken realm.
<ol><li>Approach or shoot Dredgen Sere or his kneeling Apprentices to start the encounter, but don't stand too close, since his opening slam can kill you outright.</li><li>A 45-second Lure of the Dark timer begins immediately. Use it to build Gathering Shadow toward Shadow Master and kill Apprentices to start destroying the five Taken orbs in the arena's center.</li><li>When the timer hits zero, your fireteam is pulled into a Taken mirror of the arena containing five Blistered Shadows (shades of Sere) and more Gathering Shadow pools.</li><li>With Shadow Master, Compel each Blistered Shadow in turn. Every successful Compel grants a Lure of the Dark stack and lets you shoot one of the Taken orbs. Killing two of the Blistered Shadows instead lowers how many stacks you need and boosts the damage window.</li><li>Hit one of the Darkness-corrupted devices to spawn phantasmal platforms leading up to the fifth Blistered Shadow, which hides above the main arena.</li><li>With full Lure of the Dark stacks, you're returned to the real arena. Kill Apprentices to destroy the remaining Taken orbs there. All five orbs need to go down in both planes, and the very last one should be destroyed somewhere you can actually reach Sere, or you'll waste time getting into position.</li><li>During the damage phase, shoot Sere's glowing hands while he's channeling lightning to interrupt and stun him.</li><li>If he survives the damage phase, retreat to the arena's edges immediately: the center floods with lethal Arc energy. Stop the pylons feeding it by hitting a nearby Darkness panel with your special grenade while holding at least Shadow Novice.</li><li>Repeat the whole Lure of the Dark and orb-destruction cycle until Sere finally collapses.</li></ol>
<strong>What wipes you</strong> Standing in the center once the Arc energy floods in after a damage phase kills you outright, and destroying the final orb somewhere you can't immediately follow up on costs you a full damage window rather than the run itself.</div>

<script>
(function(){
  // Generated per-dungeon pages (dungeon-<slug>.html, tools/build-guide-pages.js)
  // set GUIDE_SLUG. On this template page, an old ?slug= link forwards to
  // the dungeon's own page, whose static tags give proper link previews.
  const slug = window.GUIDE_SLUG || new URLSearchParams(window.location.search).get("slug");
  const dungeon = window.DungeonsData.DUNGEONS.find(d => d.slug === slug);
  if (dungeon && !window.GUIDE_SLUG){
    location.replace(window.rallyFlagGuideHref("dungeon", dungeon.slug) + location.hash);
    return;
  }
  const content = document.getElementById("content");

  if (!dungeon){
    document.getElementById("dungeon-title").textContent = "Dungeon not found";
    content.innerHTML = '<div class="not-found panel-card block">Head back to <a href="dungeons.html">the dungeon list</a> and pick one from there.</div>';
    return;
  }

  document.title = dungeon.name + " Dungeon Guide - Rally Flag";
  document.getElementById("dungeon-title").textContent = dungeon.name;
  // Header sits over the dungeon's official art.
  if (dungeon.art){
    const hero = document.getElementById("hero");
    hero.classList.add("has-art");
    const tint = window.rallyFlagArtTint(dungeon.art); // its colour shows until the art loads
    hero.insertAdjacentHTML("afterbegin", '<div class="hero-art"' + (tint ? ' style="background-color:' + tint + '"' : "") + '><img src="' + window.rallyFlagArtUrl(dungeon.art) + '" alt="" fetchpriority="high"></div>');
  }


  function slugify(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function encounterAnchorId(e, i){
    return "encounter-" + (e.name ? slugify(e.name) : (i + 1));
  }

  const encounterSubnavEl = document.getElementById("encounter-subnav");
  if (dungeon.encounters.length){
    encounterSubnavEl.innerHTML = dungeon.encounters.map((e, i) =>
      '<a href="#' + encounterAnchorId(e, i) + '">' + e.name + '</a>'
    ).join("");
    encounterSubnavEl.addEventListener("click", (ev) => {
      const link = ev.target.closest("a");
      if (!link) return;
      const target = document.querySelector(link.getAttribute("href"));
      if (!target) return;
      ev.preventDefault();
      target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      history.replaceState(null, "", link.getAttribute("href"));
    });
  } else {
    encounterSubnavEl.style.display = "none";
  }

  const setsBySlug = {};
  window.ArmorSetsData.SETS.forEach(s => setsBySlug[s.slug] = s);

  const setLinksHtml = dungeon.armorSlugs.map(slug => {
    const set = setsBySlug[slug];
    const label = set ? set.name : slug;
    return '<a class="set-link" href="armor-set-bonuses.html?highlight=' + slug + '">' + label + ' \u2192</a>';
  }).join("");

  const encountersHtml = dungeon.encounters.length
    ? dungeon.encounters.map((e, i) => {
        if (e.objective || e.steps){
          const hl = window.GameTerms.highlight;
          const stepsHtml = (e.steps || []).map(s => '<li>' + hl(s) + '</li>').join("");
          return '<div class="block panel-card encounter-card" id="' + encounterAnchorId(e, i) + '">' +
            '<div class="encounter-head"><div class="encounter-num">' + (i + 1) + '</div><h3 class="encounter-title">' + e.name + '</h3></div>' +
            (e.objective ? '<div class="encounter-field"><span class="encounter-field-label">Objective</span>' + hl(e.objective) + '</div>' : '') +
            (e.roles ? '<div class="encounter-field"><span class="encounter-field-label">Roles</span>' + hl(e.roles) + '</div>' : '') +
            (stepsHtml ? '<ol class="encounter-steps">' + stepsHtml + '</ol>' : '') +
            (e.wipe ? '<div class="encounter-wipe"><span class="encounter-wipe-label">What wipes you</span>' + hl(e.wipe) + '</div>' : '') +
          '</div>';
        }
        // Fallback for older, simpler encounter entries
        return '<div class="block panel-card encounter-card encounter-row" id="' + encounterAnchorId(e, i) + '"><div class="encounter-num">' + (i + 1) + '</div>' +
          '<div><div class="encounter-name">' + e.name + '</div><div class="encounter-notes">' + (e.notes || "") + '</div></div></div>';
      }).join("")
    : '<div class="block panel-card"><div class="block-empty">Encounter notes coming soon.</div></div>';

  content.innerHTML =
    '<div class="block panel-card">' +
      '<div class="block-label">Overview</div>' +
      (dungeon.summary ? '<p>' + dungeon.summary + '</p>' : '<div class="block-empty">Overview coming soon.</div>') +
    '</div>' +
    '<h2 class="block-label encounters-head">Encounters</h2>' +
    encountersHtml +
    '<div class="block panel-card">' +
      '<div class="block-label">Armor Sets From This Dungeon</div>' +
      '<div class="set-links">' + setLinksHtml + '</div>' +
    '</div>';
})();
</script>
