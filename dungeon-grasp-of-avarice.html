<div id="encounter-subnav"><a href="#encounter-skywatch">Skywatch</a> <a href="#encounter-rusted-gangplank">Rusted Gangplank</a> <a href="#encounter-phry-zhia-the-insatiable">Phry'zhia the Insatiable</a> <a href="#encounter-shroud">Shroud</a> <a href="#encounter-sunken-lair">Sunken Lair</a> <a href="#encounter-captain-avarokk-the-covetous">Captain Avarokk the Covetous</a></div></div> <section id="content">Overview
<p>Grasp of Avarice takes place in the Cosmodrome's old loot cave, and it's built around one repeating idea: kill enemies for a stacking buff called Burdened by Riches, then carry it to a crystal to drain it before the timer kills you. That same loop shows up again and again, layered with traps, a vehicle chase, and a couple of proper boss fights.</p>
<h2>Encounters</h2><div id="encounter-skywatch">1
<h3>Skywatch</h3>
<strong>Objective</strong> Farm a stacking buff from enemies and deposit it at a crystal repeatedly until it's satisfied.
<strong>Roles</strong> No fixed roles. Just clear enemies together and take turns depositing.
<ol><li>Defeat the enemies pouring out of the cave, which drop engrams that grant a stacking buff called Burdened by Riches.</li><li>Collect as many stacks as you can before the buff's timer runs out.</li><li>Head to the nearby crystal and stand next to it to drain your stacks.</li><li>Repeat until an on-screen message confirms the area is cleared.</li></ol>
<strong>What wipes you</strong> Letting the Burdened by Riches timer hit zero kills you outright, so don't wander far from the crystal while you're holding a big stack.</div><div id="encounter-rusted-gangplank">2
<h3>Rusted Gangplank</h3>
<strong>Objective</strong> Navigate a series of switches, pressure plates, and hidden paths to reach and open the main door, without triggering any of the instant-kill traps.
<strong>Roles</strong> No fixed roles. Move carefully and communicate what you see.
<ol><li>Work through each room by finding the safe path and throwing the lever or switch inside.</li><li>Watch for obvious pressure plates and platforms that look like they might drop you: most are traps.</li><li>Use each newly opened door or path to progress toward the far side of the area.</li><li>Continue flipping switches until the main gate opens.</li></ol>
<strong>What wipes you</strong> Most of the traps here kill instantly rather than wiping the team. Go slow, and if you're not sure a platform is safe, assume it isn't.</div><div id="encounter-phry-zhia-the-insatiable">3
<h3>Phry'zhia the Insatiable</h3>
<strong>Objective</strong> Use a special cannon to power generators that open side rooms, then farm the Burdened by Riches buff from the enemies inside and deposit it to break the boss's shield.
<strong>Roles</strong> No fixed roles. Rotate who's carrying the cannon and who's clearing rooms.
<ol><li>Defeat the enemy carrying the special cannon and pick it up.</li><li>Fire a shot into a generator to power open one of the side rooms.</li><li>Clear the enemies inside and collect the Burdened by Riches buff they drop.</li><li>Deposit the buff at the central crystal to chip away at the boss's shield.</li><li>Repeat opening rooms and depositing the buff until the shield fully drops, then unload damage on the exposed boss.</li></ol>
<strong>What wipes you</strong> There's no instant wipe here, but letting your Burdened by Riches timer run out while ferrying it to the crystal still kills you, so don't overload past what you can safely deliver.</div><div id="encounter-shroud">4
<h3>Shroud</h3>
<strong>Objective</strong> Race along a vehicle track while disarming a series of mines before their timers expire.
<strong>Roles</strong> No fixed roles. Everyone rides together and watches for the timer-extending buttons along the route.
<ol><li>Summon a vehicle and follow the marked path through the area.</li><li>Look for buttons along the route: driving near them extends the timer on the next mine.</li><li>Reach each mine before its timer expires to defuse it automatically.</li><li>Continue through all the mines to reach the end of the track.</li></ol>
<strong>What wipes you</strong> Letting a mine's timer hit zero fails that section. Memorize where the extender buttons are so you're not caught short on time.</div><div id="encounter-sunken-lair">5
<h3>Sunken Lair</h3>
<strong>Objective</strong> Use gravity cannons to launch between platforms, farm the Burdened by Riches buff to expose a shielded enemy, then use its remains to knock out a shielding node.
<strong>Roles</strong> No fixed roles. Split up to man different platforms and gravity cannons.
<ol><li>Grab a special cannon from a nearby enemy and use it to power a gravity cannon in the direction you want to travel.</li><li>Launch yourself to a platform, clear the enemies there, and collect the Burdened by Riches buff.</li><li>Deposit that buff at the crystal until the shielded enemy there is exposed, then defeat it.</li><li>Push its remains onto the gravity cannon's platform, aim the cannon at the central structure, and fire to destroy one of its shielding nodes.</li><li>Repeat this across all four platforms until the central shield fully drops.</li></ol>
<strong>What wipes you</strong> There's no hard wipe mechanic here, just enemy pressure at each platform. The process resets if the remains aren't launched correctly, so double check the cannon's aim before firing.</div><div id="encounter-captain-avarokk-the-covetous">6
<h3>Captain Avarokk the Covetous</h3>
<strong>Objective</strong> Power generators to release the Burdened by Riches buff around the arena, then deposit enough of it at the central crystal to break the boss's shield and open a damage window.
<strong>Roles</strong> No fixed roles. Clear enemies together and funnel buffs back to the crystal.
<ol><li>Defeat the enemy carrying the special cannon and take it.</li><li>Fire it into one of the three generators around the stage to release the buff-granting engrams.</li><li>Collect as much of the buff as you safely can and deposit it at the central crystal.</li><li>Repeat activating generators and depositing the buff until enough has been banked to break the boss's shield.</li><li>Unload damage during the short window before the boss resists again and the shield returns.</li><li>Repeat the whole cycle until he's defeated.</li></ol>
<strong>What wipes you</strong> There's no instant wipe here either, but letting your own Burdened by Riches timer expire mid-run still kills you, so don't hoard more than you can deliver in time.</div>
