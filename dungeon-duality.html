<p>Duality takes place inside Calus's memories, and it runs on one shared idea: shoot a Bell of Conquest to flip between reality and a nightmare version of the same room, collect motes and essences on one side, then bring them back to progress on the other. Once that flip mechanic clicks, most of this dungeon explains itself.</p>
<h2>Encounters</h2><div id="encounter-navigate-the-mindscape">1
<h3>Navigate the Mindscape</h3>
<strong>Objective</strong> Find and shoot a series of Bells of Conquest to flip between reality and the nightmare mindscape, working your way toward the first boss.
<strong>Roles</strong> No fixed roles. Stay together and take turns shooting.
<ol><li>Shoot the bell in view to flip everyone between reality and the nightmare version of the room.</li><li>While in reality, stay close to the bell when it's shot: anyone too far away when the flip happens dies.</li><li>Explore each new area for the next bell, using access tunnels and rafters as needed.</li><li>Repeat flipping and exploring until you reach the hatch that drops down to the first boss.</li></ol>
<strong>What wipes you</strong> There's no team-wide wipe mechanic here, but standing too far from the bell when it's shot while in reality kills that player instantly, so always regroup before someone pulls the trigger.</div><div id="encounter-nightmare-of-gahlran-sorrow-bearer">2
<h3>Nightmare of Gahlran, Sorrow-Bearer</h3>
<strong>Objective</strong> Collect essences from the nightmare realm, deposit them on matching plates in reality, then damage the boss during a timed nightmare window.
<strong>Roles</strong> Split into pairs to clear side rooms and collect essences; regroup for the boss damage phase.
<ol><li>Shoot the Bell of Conquest to enter the nightmare and split up to find and defeat the enemies guarding essences in the side rooms.</li><li>Bring collected essences back to reality and deposit each one on its matching plate.</li><li>When enough essences are deposited, side rooms open. Clear the enemies inside, then use the bell there to teleport into a sealed nightmare room.</li><li>Fight through the enemies in that room to unlock access to the boss.</li><li>Clear the remaining enemies and damage the boss quickly, since you're on a countdown the entire time you're in the nightmare.</li><li>Use the bell to escape back to reality before time runs out, and repeat the whole cycle until he's dead.</li></ol>
<strong>What wipes you</strong> The nightmare countdown wipes the whole team if it reaches zero while you're still inside, so always know where your escape bell is before you commit to a damage push.</div><div id="encounter-open-the-vault">3
<h3>Open the Vault</h3>
<strong>Objective</strong> Defeat three Nightmare bosses in sequence by collecting and depositing six total essences, two per boss, to make each one vulnerable.
<strong>Roles</strong> No fixed roles. Split up to collect essences and clear enemies together.
<ol><li>Note the symbols marked on the ground to know which essences you need.</li><li>Shoot the bell to enter the nightmare and head to the area matching your symbol.</li><li>Defeat the enemies guarding that area to spawn a Standard Bearer, then collect the essence it drops.</li><li>Return to reality and deposit the essence. After two are deposited, the current Nightmare boss becomes vulnerable and can be defeated.</li><li>Repeat this whole process for the next two Nightmare bosses in turn.</li></ol>
<strong>What wipes you</strong> There's no hard timer here, so there's no need to rush. Take the time to clear enemies safely before committing to each essence run.</div><div id="encounter-nightmare-of-caiatl-princess-imperial">4
<h3>Nightmare of Caiatl, Princess-Imperial</h3>
<strong>Objective</strong> Collect four essences from matching balconies, deposit them to trigger a damage phase, then chase Caiatl between three bells to stun her and deal damage.
<strong>Roles</strong> Split up to collect essences from balconies; regroup for the bell-chasing damage phase.
<ol><li>Note the symbols shown near the deposit chains to know which balconies to check in the nightmare.</li><li>Shoot the bell to flip to the nightmare and defeat the correctly-symbol-matched enemies on your balcony to spawn an essence.</li><li>Return to reality with the essence and deposit it on the matching chain.</li><li>Repeat until all four essences are deposited, which lets you shoot a chain to start the damage phase.</li><li>In the nightmare damage phase, watch which bell Caiatl runs toward and get there before her: shooting the bell as she arrives stuns her and grants your team a damage buff.</li><li>Repeat this across all three bells before the phase ends, then repeat the whole essence-and-chase cycle until she's dead.</li></ol>
<strong>What wipes you</strong> There's no instant team wipe in this fight, but the damage phase ends early if Caiatl reaches a bell before you do. Missing a bell just means a longer fight, not a reset, so stay calm and keep chasing.</div>

(function(){
  // Generated per-dungeon pages (dungeon-<slug>.html, tools/build-guide-pages.js)

  const slug = window.GUIDE_SLUG || new URLSearchParams(window.location.search).get("slug");
  const dungeon = window.DungeonsData.DUNGEONS.find(d => d.slug === slug);
  if (dungeon && !window.GUIDE_SLUG){
    location.replace(window.rallyFlagGuideHref("dungeon", dungeon.slug) + location.hash);
    return;
  }
  const content = document.getElementById("content");

  if (!dungeon){
    document.getElementById("dungeon-title").textContent = "Dungeon not found";
    content.innerHTML = '<div class="not-found panel-card block">Head back to <a href="dungeons.html">the dungeon list</a> and pick one from there.</div>';
    return;
  }

  document.title = dungeon.name + " Dungeon Guide - Rally Flag";
  document.getElementById("dungeon-title").textContent = dungeon.name;
  // Header sits over the dungeon's official art.
  if (dungeon.art){
    const hero = document.getElementById("hero");
    hero.classList.add("has-art");

    hero.insertAdjacentHTML("afterbegin", '<div class="hero-art"' + (tint ? ' style="background-color:' + tint + '"' : "") + '><img src="' + window.rallyFlagArtUrl(dungeon.art) + '" alt="" fetchpriority="high"></div>');
  }


  function slugify(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function encounterAnchorId(e, i){
    return "encounter-" + (e.name ? slugify(e.name) : (i + 1));
  }

  const encounterSubnavEl = document.getElementById("encounter-subnav");
  if (dungeon.encounters.length){
    encounterSubnavEl.innerHTML = dungeon.encounters.map((e, i) =>
      '<a href="#' + encounterAnchorId(e, i) + '">' + e.name + '</a>'
    ).join("");
    encounterSubnavEl.addEventListener("click", (ev) => {
      const link = ev.target.closest("a");
      if (!link) return;
      const target = document.querySelector(link.getAttribute("href"));
      if (!target) return;
      ev.preventDefault();
      target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      history.replaceState(null, "", link.getAttribute("href"));
    });

  }

  const setsBySlug = {};
  window.ArmorSetsData.SETS.forEach(s => setsBySlug[s.slug] = s);

  const setLinksHtml = dungeon.armorSlugs.map(slug => {

    return '<a class="set-link" href="armor-set-bonuses.html?highlight=' + slug + '">' + label + ' \u2192</a>';
  }).join("");

    ? dungeon.encounters.map((e, i) => {

          return '<div class="block panel-card encounter-card" id="' + encounterAnchorId(e, i) + '">' +

          '</div>';
        }

      }).join("")

    '</div>';
})();
