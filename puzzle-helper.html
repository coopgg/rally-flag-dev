              '<div class="verity-shape-row">' +
                VERITY_SHAPES.map(s => verityImgBtn(icons, s)).join("") +
              '</div>' +
              '<div class="verity-target" data-lane-target="' + i + '"></div>' +
            '</div>'
          ).join("") +
        '</div>' +

        '<div class="verity-section-label">Outside statues: what you see right now</div>' +
        '<div class="verity-hint">For each statue, click the 3D shape you currently see.</div>' +
        '<div class="verity-lanes" id="verity-outside">' +
          LANES.map((lane, i) =>
            '<div class="verity-lane" data-lane="' + i + '">' +
              '<div class="verity-lane-label">' + lane + ' (Outside)</div>' +
              '<div class="verity-outside-rows">' +
                '<div class="verity-shape-row">' + VERITY_3D_ROW1.map(s => verityImgBtn(icons, s)).join("") + '</div>' +
                '<div class="verity-shape-row">' + VERITY_3D_ROW2.map(s => verityImgBtn(icons, s)).join("") + '</div>' +
              '</div>' +
            '</div>'
          ).join("") +
        '</div>' +

        '<div class="verity-solution" id="verity-solution"></div>' +

        '<div class="verity-ogre-tip">Outside: 3 Knights per cycle, then Ogre for 3 more. Inside: 2 per cycle. Already factored into the solution above.</div>' +

        '<button class="rune-reset-btn" id="verity-reset-btn" type="button">Reset</button>' +
      '</div>' +
      '</div>' +
      buildFireteamPanelHtml();

    document.querySelectorAll(".verity-subtab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".verity-subtab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById("verity-solver-panel").style.display = tab.dataset.panel === "solver" ? "block" : "none";
        document.getElementById("verity-fireteam-panel").style.display = tab.dataset.panel === "fireteam" ? "block" : "none";
      });
    });
    initFireteamPanel();

    const insideEl = document.getElementById("verity-inside");
    const outsideEl = document.getElementById("verity-outside");
    const solutionEl = document.getElementById("verity-solution");

    function updateInsideAvailability(){
      const taken = insideHeld.filter(Boolean);
      insideEl.querySelectorAll(".verity-lane").forEach((laneEl, i) => {
        laneEl.querySelectorAll(".verity-shape-btn").forEach(btn => {
          const shape = btn.dataset.shape;
          const selected = insideHeld[i] === shape;
          btn.classList.toggle("selected", selected);
          btn.classList.toggle("disabled", !selected && taken.includes(shape));
        });
        const targetEl = laneEl.querySelector("[data-lane-target]");
        if (insideHeld[i]){
          const missing = VERITY_MISSING[insideHeld[i]];
          const targetName = VERITY_COMPOSITE_NAME[pairKey(missing)];
          targetEl.innerHTML = "Target: <b>" + targetName + "</b> (" + VERITY_NAMES[missing[0]] + " + " + VERITY_NAMES[missing[1]] + ")";
        } else {
          targetEl.textContent = "";
        }
      });
    }

    // If exactly two lanes are set, the third is forced (only one shape left).
    function autoForceThirdLane(){
      // Clear out any lane we auto-filled before, so a stale forced value
      // from a previous selection doesn't stick around after the user
      // changes their mind on a different lane.
      for (let i = 0; i < 3; i++){
        if (insideForced[i]){ insideHeld[i] = null; insideForced[i] = false; }
      }
      const unsetIdx = insideHeld.map((v, i) => v === null ? i : -1).filter(i => i > -1);
      if (unsetIdx.length === 1){
        const taken = insideHeld.filter(Boolean);
        const remaining = VERITY_SHAPES.filter(s => !taken.includes(s));
        if (remaining.length === 1){
          insideHeld[unsetIdx[0]] = remaining[0];
          insideForced[unsetIdx[0]] = true;
        }
      }
    }

    insideEl.querySelectorAll(".verity-lane").forEach((laneEl, i) => {
      laneEl.querySelectorAll(".verity-shape-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          if (btn.classList.contains("disabled")) return;
          insideHeld[i] = insideHeld[i] === btn.dataset.shape ? null : btn.dataset.shape;
          insideForced[i] = false;
          autoForceThirdLane();
          updateInsideAvailability();
          // An Inside change can invalidate an already-picked Outside shape
          // (it might no longer contain the newly-held 2D shape).
          for (let lane = 0; lane < 3; lane++){
            if (outsideSelected[lane] && !outsideOptionValid(lane, outsideSelected[lane])){
              outsideSelected[lane] = null;
              outsideForced[lane] = false;
            }
          }
          updateOutsideDisplay();
          maybeSolve();
        });
      });
    });

    // Outside only has 2 of each 2D shape total to work with across all three
    // statues combined (Inside already used the third of each). Selecting an
    // option that would push any shape's total past 2 gets disabled, so an
    // invalid combination can't be created in the first place.
    function outsideUsedCounts(excludeLane){
      const counts = { C: 0, S: 0, T: 0 };
      outsideSelected.forEach((name, i) => {
        if (i === excludeLane || !name) return;
        const pair = VERITY_NAME_TO_PAIR[name];
        counts[pair[0]]++;
        counts[pair[1]]++;
      });
      return counts;
    }

    function outsideOptionValid(lane, shapeName){
      const pair = VERITY_NAME_TO_PAIR[shapeName];
      // Confirmed rule: a statue's starting composite always contains the
      // 2D shape its own Inside lane is holding (the puzzle deliberately
      // starts you off "wrong" with the shape you're not meant to end on).
      const held = insideHeld[lane];
      if (held && !pair.includes(held)) return false;
      const used = outsideUsedCounts(lane);
      const projected = { ...used };
      projected[pair[0]]++;
      projected[pair[1]]++;
      return projected.C <= 2 && projected.S <= 2 && projected.T <= 2;
    }

    function updateOutsideDisplay(){
      outsideEl.querySelectorAll(".verity-lane").forEach((laneEl, i) => {
        laneEl.querySelectorAll(".verity-shape-btn").forEach(btn => {
          const shape = btn.dataset.shape;
          const isSelected = outsideSelected[i] === shape;
          btn.classList.toggle("selected", isSelected);
          btn.classList.toggle("disabled", !isSelected && !outsideOptionValid(i, shape));
        });
      });
    }

    // The named 3D shape whose pair exactly matches a given remaining
    // shape allowance, e.g. {C:2} -> Sphere, {C:1,S:1} -> Cylinder.
    const VERITY_PAIR_TO_NAME = {};
    Object.keys(VERITY_NAME_TO_PAIR).forEach(name => {
      VERITY_PAIR_TO_NAME[pairKey(VERITY_NAME_TO_PAIR[name])] = name;
    });

    // If exactly two Outside lanes are set, the third is often forced —
    // only 2 of each shape exist total, so whatever's left over may only
    // fit one specific named shape.
    function autoForceThirdOutsideLane(){
      for (let i = 0; i < 3; i++){
        if (outsideForced[i]){ outsideSelected[i] = null; outsideForced[i] = false; }
      }
      const unsetIdx = outsideSelected.map((v, i) => v === null ? i : -1).filter(i => i > -1);
      if (unsetIdx.length !== 1) return;
      const lane = unsetIdx[0];
      const used = outsideUsedCounts(lane);
      const remaining = { C: 2 - used.C, S: 2 - used.S, T: 2 - used.T };
      if (remaining.C < 0 || remaining.S < 0 || remaining.T < 0) return; // already invalid, don't guess
      const remainingShapes = [];
      VERITY_SHAPES.forEach(s => { for (let n = 0; n < remaining[s]; n++) remainingShapes.push(s); });
      if (remainingShapes.length !== 2) return;
      const forcedName = VERITY_PAIR_TO_NAME[pairKey(remainingShapes)];
      if (forcedName){
        outsideSelected[lane] = forcedName;
        outsideForced[lane] = true;
      }
    }

    outsideEl.querySelectorAll(".verity-lane").forEach((laneEl, i) => {
      laneEl.querySelectorAll(".verity-shape-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const shape = btn.dataset.shape;
          if (btn.classList.contains("disabled")) return;
          outsideSelected[i] = outsideSelected[i] === shape ? null : shape;
          outsideForced[i] = false;
          autoForceThirdOutsideLane();
          updateOutsideDisplay();
          maybeSolve();
        });
      });
    });

    // Master "Varied Geometry" challenge: round 2 needs three final shapes
    // that all differ from the normal solution. A statue just has to avoid
    // the 2D shape its Inside player holds — it doesn't have to be the
    // exact missing-pair shape. Finds any valid alternate target set, or
    // null if this setup has none.
    function findAlternateTarget(heldShapes){
      const normal = heldShapes.map(shape => VERITY_MISSING[shape]);
      const normalNames = normal.map(pair => VERITY_PAIR_TO_NAME[pairKey(pair)]);
      const optionsPerLane = heldShapes.map((held, i) => {
        return VERITY_SHAPES_ALL_NAMES.filter(name => {
          const pair = VERITY_NAME_TO_PAIR[name];
          return !pair.includes(held) && name !== normalNames[i];
        });
      });
      for (const nameL of optionsPerLane[0]){
        for (const nameM of optionsPerLane[1]){
          for (const nameR of optionsPerLane[2]){
            const pairs = [nameL, nameM, nameR].map(n => VERITY_NAME_TO_PAIR[n]);
            const counts = { C: 0, S: 0, T: 0 };
            pairs.forEach(p => { counts[p[0]]++; counts[p[1]]++; });
            if (counts.C === 2 && counts.S === 2 && counts.T === 2){
              return pairs;
            }
          }
        }
      }
      return null;
    }
    const VERITY_SHAPES_ALL_NAMES = Object.keys(VERITY_NAME_TO_PAIR);

    function maybeSolve(){
      solutionEl.classList.remove("active");
      solutionEl.innerHTML = "";
      if (insideHeld.some(s => !s)) return;
      if (outsideSelected.some(s => !s)) return;

      let targetState = insideHeld.map(shape => VERITY_MISSING[shape]);
      const masterMode = document.getElementById("verity-master-toggle")?.checked;
      if (masterMode){
        const alt = findAlternateTarget(insideHeld);
        if (!alt){
          solutionEl.classList.add("active");
          solutionEl.innerHTML = '<div class="verity-already-solved">No alternate shape set exists for this setup. Play this round with the normal solution instead.</div>';
          return;
        }
        targetState = alt;
      }
      const startState = outsideSelected.map(name => VERITY_NAME_TO_PAIR[name]);

      const solveResult = solveVerity(startState, targetState);
      solutionEl.classList.add("active");
      if (!solveResult){
        solutionEl.innerHTML = '<div class="verity-already-solved">Couldn\u2019t find a solution. Double check the shapes you entered.</div>';
        return;
      }
      const solution = solveResult.path;
      if (solution.length === 0){
        solutionEl.innerHTML = '<div class="verity-already-solved">Already correct, no swaps needed.</div>';
        return;
      }
      const equalDistWarning = solveResult.equalDistribution ? "" :
        '<div class="verity-ogre-tip verity-warning">Heads up: this sequence deposits into the same statue twice in a row somewhere below. Equal Distribution also counts Inside\u2019s deposits, so time this step so an Inside deposit lands in between. No shorter Outside-only sequence avoids it here.</div>';
      // Flatten into individual pickup actions first, so an Ogre-kill step
      // can be inserted at the right point — Outside only gets 3 Knights
      // per cycle before needing to kill the Ogre for 3 more.
      //
      // IMPORTANT: nothing is ever carried cross-lane. Each lane's Knight
      // always drops whatever shape that lane's Inside player originally
      // called out (fixed for the whole attempt — invert insideHeld to find
      // it). A deposit is only valid at a statue that ALREADY holds that
      // exact shape as one of its two components, and it's deposited at
      // THAT statue, not carried elsewhere. Once both halves of a swap are
      // deposited (into two different statues), the game auto-swaps their
      // other, non-participating components — that's what workingState
      // below simulates.
      // IMPORTANT: nothing is ever carried cross-lane in terms of WHERE
      // the shape token comes from \u2014 Knight lane is fixed per shape,
      // always (see VERITY_KNIGHT_LANE_FOR_SHAPE), regardless of Inside
      // callouts. What IS cross-lane is the deposit: "putting" a shape at
      // a statue dissects a matching component OUT of that statue (using
      // the Knight-dropped shape as the key, not as added material). Once
      // both halves of a swap have been dissected out (two different
      // shapes, from two different statues), the game auto-trades those
      // two extracted components between the two statues \u2014 that's what
      // workingState below simulates. The deposit lane for each pickup
      // is therefore the STATUE currently holding that shape (m.fromLane /
      // m.toLane from the BFS move), never the Knight's own lane.
      const pickups = [];
      solution.forEach(m => {
        pickups.push({ shape: m.fromShape, knightLane: VERITY_KNIGHT_LANE_FOR_SHAPE[m.fromShape], depositLane: m.fromLane });
        pickups.push({ shape: m.toShape, knightLane: VERITY_KNIGHT_LANE_FOR_SHAPE[m.toShape], depositLane: m.toLane });
      });

      // Composite-icon snapshot of all 3 lanes at a given point, so a player
      // can visually confirm the statues match before moving on.
      function progressSnapshotHtml(state){
        return '<div class="verity-progress-row">' +
          LANES.map((lane, i) => {
            const name = VERITY_COMPOSITE_NAME[pairKey(state[i])];
            return '<div class="verity-progress-lane"><img src="' + icons[name] + '" alt="' + name + '"><span>' + lane + '</span></div>';
          }).join("") +
        '</div>';
      }

      let workingState = startState.map(pair => [...pair]);
      let stepNum = 0;
      const rows = [];
      // Each Ogre cycle spawns exactly one Knight per lane. Once a lane's
      // Knight has been used this cycle, that lane can't offer another
      // pickup until the Ogres are killed and the Knights respawn \u2014 so
      // insert the Ogre step whenever the NEXT pickup would reuse a lane
      // already used since the last reset, rather than assuming a fixed
      // count of 3.
      let usedLanesThisCycle = new Set();
      pickups.forEach((p, idx) => {
        if (usedLanesThisCycle.has(p.knightLane)){
          stepNum++;
          rows.push(
            '<div class="verity-solution-step verity-ogre-step"><span class="step-num">' + stepNum + '</span>' +
            'Kill Ogres</div>'
          );
          usedLanesThisCycle = new Set();
        }
        usedLanesThisCycle.add(p.knightLane);
        stepNum++;
        rows.push(
          '<div class="verity-solution-step"><span class="step-num">' + stepNum + '</span>' +
          '<span class="verity-solution-step-icon"><img src="' + icons[p.shape] + '" alt=""></span>' +
          '<span class="verity-solution-step-text">Kill Knight at ' + LANES[p.knightLane] + '; Pickup <b>' + VERITY_NAMES[p.shape] + '</b>; Put ' + VERITY_NAMES[p.shape] + ' in ' + LANES[p.depositLane] + '</span></div>'
        );
        // Second pickup of a pair completes one full swap — update the
        // working state and drop in a visual checkpoint.
        if (idx % 2 === 1){
          const m = solution[(idx - 1) / 2];
          const fromPair = workingState[m.fromLane];
          const toPair = workingState[m.toLane];
          fromPair.splice(fromPair.indexOf(m.fromShape), 1, m.toShape);
          toPair.splice(toPair.indexOf(m.toShape), 1, m.fromShape);
          rows.push('<div class="verity-progress-label">Statues now look like this</div>');
          rows.push(progressSnapshotHtml(workingState));
        }
      });

      solutionEl.innerHTML =
        '<div class="verity-section-label">Solution: ' + solution.length + (solution.length === 1 ? " swap" : " swaps") + ' (' + pickups.length + ' pickups)</div>' +
        '<div class="verity-hint">Each deposit only works at a statue that already holds that exact shape. Once both halves of a swap are down, the other component at each statue trades places automatically.</div>' +
        '<div class="verity-solution-steps">' + rows.join("") + '</div>' +
        equalDistWarning;
    }

    document.getElementById("verity-reset-btn").addEventListener("click", () => {
      for (let i = 0; i < 3; i++){
        insideHeld[i] = null;
        insideForced[i] = false;
        outsideSelected[i] = null;
        outsideForced[i] = false;
      }
      updateInsideAvailability();
      updateOutsideDisplay();
      solutionEl.classList.remove("active");
      solutionEl.innerHTML = "";
    });

    document.getElementById("verity-master-toggle").addEventListener("change", maybeSolve);

    updateInsideAvailability();
    updateOutsideDisplay();
  }

  function renderActive(slug){
    if (!TOOLS.length){
      renderPicker(null);
      section.innerHTML = '<div class="no-tools">No puzzle helpers added yet.</div>';
      return;
    }
    const tool = TOOLS.find(t => t.slug === slug);
    renderPicker(tool ? tool.slug : null);
    if (!tool){
      section.removeAttribute("data-tool");
      section.innerHTML = '<div class="no-tools">Pick a tool above to get started.</div>';
      return;
    }
    section.setAttribute("data-tool", tool.slug);
    if (tool.type === "rune-select") renderRuneTool(tool);
    else if (tool.type === "lr-select") renderLRTool(tool);
    else if (tool.type === "ld-select") renderLDTool(tool);
    else if (tool.type === "symbol-select") renderSymbolTool(tool);
    else if (tool.type === "verity-solver") renderVerityTool(tool);
    else renderWishTool(tool);
  }

  renderActive(getRequestedSlug());
})();
</script>

</body>
</html>
