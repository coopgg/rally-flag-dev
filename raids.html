<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raids - Rally Flag</title>
<meta name="description" content="Every Destiny 2 raid: pick one to open its guide.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rally Flag">
<meta property="og:title" content="Raids">
<meta property="og:description" content="Every Destiny 2 raid: pick one to open its guide.">
<meta property="og:url" content="https://rallyflag.gg/raids.html">
<meta property="og:image" content="https://rallyflag.gg/assets/icon-512.png">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  section{ max-width:1000px; margin:48px auto 0; padding:0 24px 90px; }
  .activity-grid{
    display:flex; flex-wrap:wrap; justify-content:center; gap:14px;
  }
  .activity-card{
    flex:0 1 230px;
    display:block; text-decoration:none; padding:22px 22px 20px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .activity-card:hover, .activity-card:focus-visible{ border-color:var(--accent); background:var(--accent-dim); }
  .activity-name{ font-family:'Oswald', sans-serif; font-weight:600; font-size:18px; color:var(--text); margin-bottom:6px; }
  .activity-arrow{ font-size:12px; color:var(--accent-bright); font-family:'JetBrains Mono', monospace; }
</style>
</head>
<body data-nav-group="guides">

<div id="site-nav"></div>

<div class="hero">
  <div class="eyebrow">Destiny 2 · Raid List</div>
  <h1 class="title">Raids</h1>
  <p class="subtitle">Pick a raid to open its guide.</p>
  <div class="subnav">
    <a href="guides.html">Overview</a>
    <a href="raids.html" class="active">Raids</a>
    <a href="dungeons.html">Dungeons</a>
  </div>
</div>

<section>
  <div class="activity-grid" id="activity-grid"></div>
</section>

<footer>
  <div>Unofficial fan project. Not affiliated with or endorsed by Bungie.</div>
</footer>

<script src="assets/nav.js"></script>
<script src="assets/raids-data.js"></script>
<script>
(function(){
  const grid = document.getElementById("activity-grid");
  window.RaidsData.RAIDS.forEach(raid => {
    const card = document.createElement("a");
    card.className = "activity-card panel-card";
    card.href = "raid-guide.html?slug=" + raid.slug;
    card.innerHTML =
      '<div class="activity-name">' + raid.name + '</div>' +
      '<div class="activity-arrow">View guide \u2192</div>';
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
