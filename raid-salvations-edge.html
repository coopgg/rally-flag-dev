<h1 id="raid-title">Salvation's Edge</h1> <div id="raid-difficulty">Normal · Master</div>
<a href="guides.html">Overview</a> <a href="raids.html">Raids</a> <a href="dungeons.html">Dungeons</a> <a href="public-events.html">Public Events</a>
<div id="encounter-subnav"><a href="#encounter-substratum">Substratum</a> <a href="#encounter-herald-of-finality">Herald of Finality</a> <a href="#encounter-repository">Repository</a> <a href="#encounter-verity">Verity</a> <a href="#encounter-zenith">Zenith</a></div></div> <section id="content">Overview
<p>Salvation's Edge is the final raid of the original Light and Darkness saga, and it plays like it: five long, intricate encounters that layer symbol logic, split teams, and shared timers on top of each other. It's widely considered one of the most mechanically demanding raids ever made, so take each encounter slowly the first time through.</p>
<strong>Master Difficulty</strong> Master raises enemies well above the raid's Normal Power level — expect a Power deficit unless you're specifically geared for it — and every hit lands harder across the board. Several encounters also add Champions (Barrier, Overload, or Unstoppable) that don't appear on Normal; check the callout under an affected encounter below for which ones and where.
<h2>Encounters</h2>
<div id="encounters-body"><div id="encounter-substratum">1
<h3>Substratum</h3>
<strong>Objective</strong> Split into a side team and a corner team, fight through the ring of rooms around the center, and use the sending and receiving plates you find along the way to lock all six generators.
<strong>Roles</strong> Side team heads through whichever door opens on one of the four flat walls; corner team takes whichever door opens at one of the four corners.
<ol><li>Grab the starting Resonance and deposit it in the central box to begin. This opens one wall door for the side team and one corner door for the corner team.</li><li>Fight through rooms toward a Hydra blocking each team's path. Killing it unlocks the next room.</li><li>Each team's path ends at an Overload Minotaur. Killing it spawns a Tormentor in the middle room.</li><li>Everyone heads to the middle to kill the Tormentor together — make sure everyone's out of the middle room before it dies, or a Hydra spawns there and traps whoever's still inside until it's killed.</li><li>Killing the Tormentor opens a new wall door and corner door. Progress through them the same way until you reach the room with the totem — that's your sending plate.</li><li>The matching receiving plate isn't just anywhere; it's in one of the two rooms adjacent to the sending plate, either the one before it or the one after.</li><li>Bounce a signal between the two plates (one player sends, the other receives and sends it back) to generate Resonance on each round-trip.</li><li>Collect three Resonance per player, then use them to lock the generator at the totem.</li><li>Once it's locked, a Subjugator spawns in the middle — kill it, then repeat this whole loop until all six generators are locked.</li></ol>
<strong>What wipes you</strong> Ignoring a plate that's just received a signal spawns a tough enemy in that room instead of progressing, and letting the shared timer expire wipes the team, so always have someone ready to answer a signal. You can only hold three Resonance at once, too — collecting a fourth kills you, so lock or deposit before grabbing more.</div><div id="encounter-herald-of-finality">2
<h3>Herald of Finality</h3>
<strong>Objective</strong> Shoot the blight in the center to start the fight, then cycle a buff between the center and three zones to expose and damage the boss's head and lock each zone's generator.
<strong>Roles</strong> Three pairs, one per zone; one player from each pair gets called to the center to expose and damage the boss while their partner handles the zone's generator.
<ol><li>Split into three pairs, one to the middle and one to each side of the arena, and shoot the blight in the center to start the fight.</li><li>Clear enemies in each zone until a tougher enemy appears.</li><li>At some point, one player from each pair gets Call to Reckoning and is called to the center.</li><li>Those centered players watch for blights spawning in the three outer zones (where their partners stayed) and either shoot them directly or call them out so their partner can.</li><li>Once all three blights are destroyed, the boss's head becomes damageable — the centered players damage it.</li><li>Damaging the head changes their buff into one that reveals which shape their zone's generator needs. They call that out so their partner collects the opposite resonance and locks the generator.</li><li>Once all three generators are locked, deposit the remaining resonance in the box at the front of the arena to start the damage phase, then repeat this whole cycle until the boss is dead.</li></ol>
<strong>What wipes you</strong> Failing to answer a plate that's received a signal spawns extra enemies, and letting the shared timer expire ends the attempt, so pace your rotations instead of chasing perfection in one zone.</div><div id="encounter-repository">3
<h3>Repository</h3>
<strong>Objective</strong> Push through three rooms, each with three generators requiring a specific shape, using the same signal-and-lock system from earlier encounters.
<strong>Roles</strong> Three pairs, one per lane, coordinating to figure out which generator needs which resource.
<ol><li>Split into three pairs and take a lane each: left, middle, and right.</li><li>Defeat the tough enemy in your lane to earn Stolen Favor, which reveals which shape your lane's generator needs.</li><li>Bounce the signal between your lane's plates to build up resources.</li><li>Since a lane's plates don't always feed its own generator, be ready to carry resources to a different lane's generator if that's where they're needed.</li><li>Lock all three generators, then clear the remaining enemies and defeat the miniboss to open the door forward.</li><li>Repeat this whole process for the next two rooms. The layout changes each time, so stay alert for a different plate-to-generator setup.</li></ol>
<strong>What wipes you</strong> Sending resources to the wrong generator wastes the trip but isn't fatal. The real risk is running out of time or letting rooms overrun with enemies while you're still solving the shape puzzle.</div><div id="encounter-verity">4
<h3>Verity</h3>
<strong>Objective</strong> Split into two teams with completely different jobs (three players go Outside dissecting statues, three get pulled Inside to solve their own shape puzzle) and work together to free the Inside players, three separate times, before the encounter ends.
<strong>Roles</strong> Outside (Dissection team): stays together in the main room, listens to what each Inside player calls out, and rebuilds three statues into the matching 3D shapes by trading 2D shape pieces between them. Inside (Solo players): three players get teleported into fully separate, isolated rooms and can't see or help each other directly. Each works out their own shape puzzle and has to escape by building the right item to match what Outside builds for them.
<ol><li>At the start, three players are pulled Inside into their own isolated rooms. Each Inside player checks which of Circle, Square, or Triangle their own statue is holding, then calls it out by position (Left, Middle, Right) to the Outside team. There are only three shapes and no repeats, so once two are known the third is a given.</li><li>Outside immediately knows what to build: each statue's target is the 3D shape made from the two 2D shapes that Inside statue is NOT holding (Circle needs Prism, Square needs Cone, Triangle needs Cylinder). Outside statues start already holding some shape, so the job is trading individual 2D pieces between two statues at a time: kill a Knight to collect the piece you want off one statue, hand it to the other, then do the reverse for the piece it's missing. The Dissection Solver, part of our Verity Tools on the Puzzle Helper page, works out this exact swap sequence for you.</li><li>Separately, Inside players are solving their own puzzle: each one looks at the wall behind their statue, which previews whatever their own two Knights currently hold. Killing a Knight drops that shape. If the wall already shows your own statue's shape doubled (Statue = Circle, Wall = Circle/Circle), skip straight to the final step below. Otherwise the wall shows two different shapes at first, and phase one is trading them away: kill a Knight, and whatever it drops, hand it to whichever of the other two Inside players' statues (visible in your own room) actually holds that shape. You're giving pieces away, not keeping them. The other two players are doing the same for you at the same time, so you end up receiving your own statue's shape twice in return. Once that's done, your wall flips to showing your own shape doubled.</li><li>Phase two reverses the direction: now give away one of your doubled pair to each of the other two Inside players, one shape to each. They're doing the same back to you, so you receive one of each of the two shapes you don't hold. Your wall flips again, this time to the two shapes your statue ISN'T holding, the same pairing Outside is using to build your statue's 3D target. Kill your Knights one last time, collect both, and they combine into the item that matches what Outside is building for your lane.</li><li>At some point during this shape-trading (usually a few rounds of Knight kills and hand-offs in), the Witness will "kill" all three Inside players at once. This is a scripted fake wipe, not a mistake. Their Ghosts appear to the Outside team, and each one needs to be carried to the correct statue among several possible pedestals to revive that player. The catch: the arrangement of which player is at which pedestal isn't fixed. "Dead" Inside players can see the location of one of the other dead players through the spectator camera, so they should call that out to help Outside sort out who goes where quickly.</li><li>Once revived, Inside players finish combining their two collected shapes into the matching item, and Outside finishes building the corresponding statue. When an Inside player's held item matches what Outside has built for their lane, that player is freed and rejoins the group.</li><li>With all three Inside players out, Outside finishes clearing remaining adds, including a pair of Unstoppable Ogres. Once that's done, the Witness triggers a second, separate fake-wipe: everyone except one player gets hit with a status that plays out like a death (Catatonic Decimation). The one player left standing has roughly a minute to find and deliver Ghosts to revive everyone (exactly the same statue-matching mechanic as the Inside revival, just now applied to the whole team) before the timer becomes a real wipe (Imminent End). If your team struggles to tell each other apart in the panic of this moment, Fireteam Fashion (the other half of our Verity Tools on the Puzzle Helper page) shows everyone's currently equipped gear side by side ahead of time, so the one survivor already knows who's who.</li><li>Repeat this entire loop (new players get pulled Inside, shapes get traded, both fake-wipes happen again) a total of three times before the encounter ends and the path forward opens.</li></ol>
<strong>What wipes you</strong> Reviving a downed player at the wrong statue kills them again instead of helping, so don't guess: confirm the pedestal before committing. The two fake-wipes are not real wipes by themselves, but running out the ~1-minute timer on the final all-but-one revival (once Catatonic Decimation flips into Imminent End) is a genuine wipe. This encounter punishes under-communication more than almost anything else in the raid, so over-explain what you're holding and what you're missing rather than assume it's obvious.
<strong>On Master</strong> On Master, the Ogre in each Inside player's isolated room becomes an Unstoppable Champion, and the Outside team's recurring Ogres do too — since who goes Inside is random, everyone should be ready to handle one.
<a href="puzzle-helper.html?tool=verity-solver">Verity Tools
Dissection Solver works out the minimum swap sequence for Outside; Fireteam Fashion shows everyone's gear for the Ghost phase.
Open tool →</a></div><div id="encounter-zenith">5
<h3>Zenith</h3>
<strong>Objective</strong> Earn Glyphbreaker by standing in the Witness's telegraphed attacks to collect the matching Resonance, use it to crack a glyph, and repeat until all six are gone, then survive a long, mobile damage phase.
<strong>Roles</strong> Multiple players cycle through collecting Resonance and cracking glyphs; everyone needs to react fast to the boss's periodic pattern challenge.
<ol><li>Stand in one of the boss's telegraphed arm attacks to reveal which type of Resonance you need to go collect from a different attack.</li><li>Get that Resonance by briefly standing in the correct attack zone without staying so long that you actually get hit by it.</li><li>Return to the first attack and stand in it again to crack that glyph, which grants Glyphbreaker so you can destroy it.</li><li>Try to have a few players ready to destroy glyphs around the same time, since doing so limits how many extra enemies spawn.</li><li>When the boss periodically tests the team with a field of nodes, shoot down the extras so the remaining ones form the shape matching whichever attack was most recently used. Get this wrong and it wipes the team.</li><li>Once all six glyphs are destroyed, a damage phase begins where the boss attacks large sections of the arena in alternating patterns. Stay mobile, and jump clear before his finishing slam.</li></ol>
<strong>What wipes you</strong> Building the wrong shape during the boss's pattern test wipes the whole team instantly. This one has zero room for guessing, so make sure whoever's calling out the shape is confident before anyone shoots.</div></div><a href="puzzle-helper.html?tool=witness-extra-chest">Witness's Extra Chest
Note the reference column's shapes at the start, then check all 5 hidden rooms across the raid, and deposit the right shape at whichever 3 turn out active.

<script src="assets/game-terms.js"></script>
<script src="assets/art-tints.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/raids-data.js"></script>
<script src="assets/sets-data.js"></script>
<script>
(function(){
  // Generated per-raid pages (raid-<slug>.html, tools/build-guide-pages.js)
  // set GUIDE_SLUG. On this template page, an old ?slug= link forwards to
  // the raid's own page, whose static tags give proper link previews.
  const slug = window.GUIDE_SLUG || new URLSearchParams(window.location.search).get("slug");
  const raid = window.RaidsData.RAIDS.find(r => r.slug === slug);
  if (raid && !window.GUIDE_SLUG){
    location.replace(window.rallyFlagGuideHref("raid", raid.slug) + location.hash);
    return;
  }
  const content = document.getElementById("content");

  if (!raid){
    document.getElementById("raid-title").textContent = "Raid not found";
    content.innerHTML = '<div class="not-found panel-card block">Head back to <a href="raids.html">the raid list</a> and pick one from there.</div>';
    return;
  }

  document.title = raid.name + " Raid Guide - Rally Flag";
  document.getElementById("raid-title").textContent = raid.name;
  // Header sits over the raid's official art.
  if (raid.art){
    const hero = document.getElementById("hero");
    hero.classList.add("has-art");
    const tint = window.rallyFlagArtTint(raid.art); // its colour shows until the art loads
    hero.insertAdjacentHTML("afterbegin", '<div class="hero-art"' + (tint ? ' style="background-color:' + tint + '"' : "") + '><img src="' + window.rallyFlagArtUrl(raid.art) + '" alt="" fetchpriority="high"></div>');
  }
  document.getElementById("raid-difficulty").textContent = raid.difficulties ? raid.difficulties.join(" · ") : "";

  function slugify(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function encounterAnchorId(e, i){
    return "encounter-" + (e.name ? slugify(e.name) : (i + 1));
  }

  let activeDifficulty = "Normal";
  function currentEncounters(){
    return (activeDifficulty === "Epic" && raid.epicEncounters) ? raid.epicEncounters : raid.encounters;
  }

  const encounterSubnavEl = document.getElementById("encounter-subnav");
  function renderSubnav(){
    const encounters = currentEncounters();
    if (encounters.length){
      encounterSubnavEl.style.display = "";
      encounterSubnavEl.innerHTML = encounters.map((e, i) =>
        '<a href="#' + encounterAnchorId(e, i) + '">' + e.name + '</a>'
      ).join("");
    } else {
      encounterSubnavEl.style.display = "none";
    }
  }
  renderSubnav();
  encounterSubnavEl.addEventListener("click", (ev) => {
    const link = ev.target.closest("a");
    if (!link) return;
    const target = document.querySelector(link.getAttribute("href"));
    if (!target) return;
    ev.preventDefault();
    target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    history.replaceState(null, "", link.getAttribute("href"));
  });

  const setsBySlug = {};
  window.ArmorSetsData.SETS.forEach(s => setsBySlug[s.slug] = s);

  const setLinksHtml = raid.armorSlugs.map(slug => {
    const set = setsBySlug[slug];
    const label = set ? set.name : slug;
    return '<a class="set-link" href="armor-set-bonuses.html?highlight=' + slug + '">' + label + ' \u2192</a>';
  }).join("");

  function buildEncountersHtml(encounters){
    return encounters.length
    ? encounters.map((e, i) => {
        if (e.objective || e.steps){
          const hl = window.GameTerms.highlight;
          const stepsHtml = (e.steps || []).map(s => '<li>' + hl(s) + '</li>').join("");
          const mapHtml = e.mapImage
            ? '<div class="encounter-map"><img src="' + e.mapImage.url + '" alt="' + e.name + ' encounter map" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.mapImage.credit +
              (e.mapImage.creditUrl ? ' · <a href="' + e.mapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const secondaryMapHtml = e.secondaryMapImage
            ? '<div class="encounter-map"><img src="' + e.secondaryMapImage.url + '" alt="' + e.name + ' encounter map variant" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.secondaryMapImage.credit +
              (e.secondaryMapImage.creditUrl ? ' · <a href="' + e.secondaryMapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const strategyHtml = e.strategyImage
            ? '<div class="encounter-map"><img src="' + e.strategyImage.url + '" alt="' + e.name + ' strategy diagram" loading="lazy">' +
              (e.strategyImage.label ? '<div class="encounter-map-label">' + e.strategyImage.label + '</div>' : '') +
              '</div>'
            : '';
          const advancedHtml = (e.advancedTactics && e.advancedTactics.length)
            ? '<div class="encounter-advanced">' +
                '<button class="encounter-advanced-toggle" type="button"><span class="caret">\u25b8</span> Advanced tactic (optional)</button>' +
                '<div class="encounter-advanced-body">' +
                  e.advancedTactics.map(t => '<p>' + hl(t) + '</p>').join("") +
                '</div>' +
              '</div>'
            : '';
          const encounterPuzzleHelperHtml = e.puzzleHelper
            ? '<a class="block panel-card puzzle-helper-link encounter-puzzle-helper-link" href="puzzle-helper.html?tool=' + e.puzzleHelper.slug + '">' +
                '<div>' +
                  '<div class="puzzle-helper-link-title">' + e.puzzleHelper.title + '</div>' +
                  '<div class="puzzle-helper-link-sub">' + e.puzzleHelper.blurb + '</div>' +
                '</div>' +
                '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
              '</a>'
            : '';
          return '<div class="block panel-card encounter-card" id="' + encounterAnchorId(e, i) + '">' +
            '<div class="encounter-head"><div class="encounter-num">' + (i + 1) + '</div><h3 class="encounter-title">' + e.name + '</h3></div>' +
            (e.objective ? '<div class="encounter-field"><span class="encounter-field-label">Objective</span>' + hl(e.objective) + '</div>' : '') +
            (e.roles ? '<div class="encounter-field"><span class="encounter-field-label">Roles</span>' + hl(e.roles) + '</div>' : '') +
            mapHtml +
            secondaryMapHtml +
            strategyHtml +
            (stepsHtml ? '<ol class="encounter-steps">' + stepsHtml + '</ol>' : '') +
            (e.wipe ? '<div class="encounter-wipe"><span class="encounter-wipe-label">What wipes you</span>' + hl(e.wipe) + '</div>' : '') +
            (e.master ? '<div class="encounter-master"><span class="encounter-master-label">On Master</span>' + hl(e.master) + '</div>' : '') +
            advancedHtml +
            encounterPuzzleHelperHtml +
          '</div>';
        }
        // Fallback for older, simpler encounter entries
        return '<div class="block panel-card encounter-card encounter-row" id="' + encounterAnchorId(e, i) + '"><div class="encounter-num">' + (i + 1) + '</div>' +
          '<div><div class="encounter-name">' + e.name + '</div><div class="encounter-notes">' + (e.notes || "") + '</div></div></div>';
      }).join("")
    : '<div class="block panel-card"><div class="block-empty">Encounter notes coming soon.</div></div>';
  }

  const difficultyToggleHtml = raid.epicEncounters
    ? '<div class="difficulty-toggle" id="difficulty-toggle">' +
        '<button type="button" class="difficulty-toggle-btn active" data-difficulty="Normal">Normal</button>' +
        '<button type="button" class="difficulty-toggle-btn" data-difficulty="Epic">Epic</button>' +
      '</div>'
    : '';

  const puzzleHelperHtml = raid.puzzleHelper
    ? '<a class="block panel-card puzzle-helper-link" href="puzzle-helper.html?tool=' + raid.puzzleHelper.slug + '">' +
        '<div>' +
          '<div class="puzzle-helper-link-title">' + raid.puzzleHelper.title + '</div>' +
          '<div class="puzzle-helper-link-sub">' + raid.puzzleHelper.blurb + '</div>' +
        '</div>' +
        '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
      '</a>'
    : '';

  const raidMasterNoteHtml = (raid.difficulties && raid.difficulties.includes("Master"))
    ? '<div class="raid-master-note"><span class="raid-master-note-label">Master Difficulty</span>' +
        "Master raises enemies well above the raid's Normal Power level — expect a Power deficit unless you're specifically geared for it — and every hit lands harder across the board. Several encounters also add Champions (Barrier, Overload, or Unstoppable) that don't appear on Normal; check the callout under an affected encounter below for which ones and where." +
      '</div>'
    : '';

  content.innerHTML =
    '<div class="block panel-card">' +
      '<div class="block-label">Overview</div>' +
      (raid.summary ? '<p>' + raid.summary + '</p>' : '<div class="block-empty">Overview coming soon.</div>') +
      raidMasterNoteHtml +
    '</div>' +
    '<div class="block-label-row encounters-head"><h2 class="block-label">Encounters</h2>' + difficultyToggleHtml + '</div>' +
    '<div id="encounters-body">' + buildEncountersHtml(currentEncounters()) + '</div>' +
    puzzleHelperHtml +
    '<div class="block panel-card">' +
      '<div class="block-label">Armor Sets From This Raid</div>' +
      '<div class="set-links">' + setLinksHtml + '</div>' +
    '</div>';

  content.addEventListener("click", (ev) => {
    const advToggle = ev.target.closest(".encounter-advanced-toggle");
    if (advToggle){
      advToggle.closest(".encounter-advanced").classList.toggle("open");
      return;
    }
    const diffBtn = ev.target.closest(".difficulty-toggle-btn");
    if (diffBtn){
      const newDifficulty = diffBtn.dataset.difficulty;
      if (newDifficulty === activeDifficulty) return;
      activeDifficulty = newDifficulty;
      content.querySelectorAll(".difficulty-toggle-btn").forEach(b => b.classList.toggle("active", b.dataset.difficulty === activeDifficulty));
      document.getElementById("encounters-body").innerHTML = buildEncountersHtml(currentEncounters());
      renderSubnav();
    }
  });
})();
</script>
<script src="assets/your-clears.js"></script>
</body>
