<h1 id="raid-title">Garden of Salvation</h1> <div id="raid-difficulty">Normal</div>

<div id="encounter-subnav"><a href="#encounter-evade-the-consecrated-mind">Evade the Consecrated Mind</a> <a href="#encounter-summon-the-consecrated-mind">Summon the Consecrated Mind</a> <a href="#encounter-defeat-consecrated-mind">Defeat Consecrated Mind</a> <a href="#encounter-defeat-sanctified-mind">Defeat Sanctified Mind</a></div></div> <section id="content">Overview
<p>Garden of Salvation is short compared to most raids (just four encounters), but it makes up for that with pure endurance. There's very little in the way of puzzles here; it's mostly about managing timers, buffs, and constant enemy pressure without anyone getting overwhelmed.</p>
<h2>Encounters</h2>
<div id="encounters-body"><div id="encounter-evade-the-consecrated-mind">1
<h3>Evade the Consecrated Mind</h3>
<strong>Objective</strong> Push through a series of barriers while dodging a slow-moving boss, then sprint through an open field to finish.
<strong>Roles</strong> Split into a forward group opening barriers and a rear group babysitting the boss, leapfrogging forward as the boss advances.
<ol><li>Have a few players shoot a floating box near the start to form a tether that opens the first door and starts the encounter.</li><li>Send a group ahead to fight through to each barrier, killing a shielded flying enemy and using a nearby box to tether the barrier open.</li><li>Keep a group near the boss collecting the orbs it periodically drops, since leaving one alone for too long wipes the team.</li><li>As the boss advances into a cleared area, have the trailing group leapfrog past it to the next barrier.</li><li>At the final barrier, all three tethers need to go up at once, since it takes three separate locks to open.</li><li>Once it's down, everyone pushes into the open field together, killing what you can and running the rest of the way to the end.</li></ol>
<strong>What wipes you</strong> Ignoring one of the boss's orb-drops for too long kills the whole team, so always keep someone assigned to grab it no matter what else is going on.</div><div id="encounter-summon-the-consecrated-mind">2
<h3>Summon the Consecrated Mind</h3>
<strong>Objective</strong> Secure four relay points around the map, then hold a fifth in the center until the boss is fully summoned.
<strong>Roles</strong> Rotate around the map clockwise as a group, leaving exactly one defender at each relay beyond the first (which starts with two); the two players freed up once the last corner is secured float between posts to help and refresh Enlightenment.
<ol><li>Kill the enemies in the center to start the fight.</li><li>Push clockwise as a group, clearing each relay, tethering it for Enlightenment, then leaving one player behind to defend it before the rest move to the next — the first relay keeps two players, and the last two players free up to float once the final corner is secured.</li><li>Repeat until all four corner relays are active and defended.</li><li>Once all four are up, each one is assaulted by its own group of flying enemies — defenders and floaters clear them using Enlightenment to break their shields.</li><li>Once every relay has survived its assault, the center opens up, and everyone regroups there to defend one final relay until the encounter ends.</li></ol>
<strong>What wipes you</strong> Losing a relay to enemies while it's undefended forces you to reclaim it from scratch. It's not an instant wipe, but it can snowball into one if multiple points fall at once, so don't leave a relay with zero defenders for long.</div><div id="encounter-defeat-consecrated-mind">3
<h3>Defeat Consecrated Mind</h3>
<strong>Objective</strong> Bank motes to trigger damage phases, while a separate team manages the Voltaic Overflow debuff that requires calling out which of the boss's eyes to shoot.
<strong>Roles</strong> Three players farm and deposit motes; three players follow the boss, with one holding Voltaic Overflow and calling out eye positions while the other two shoot them.
<ol><li>Tether the starting relay to begin the fight.</li><li>Have one group kill the enemies that drop motes and deposit them at the glowing relay, aiming for 10 at a time before the pickup timer expires.</li><li>Have the other group follow the boss, and whoever picks up its dropped Voltaic Charge gets hit with Voltaic Overflow and locked in place, and must call out which of the glowing eyes are lit, then shoot their own assigned eye.</li><li>The two free players each shoot one of the other called-out eyes, so all three go down together to free the trapped teammate.</li><li>Once 30 motes are banked, follow the boss to the relay for a damage phase: shine all its eyes red, then shoot its exposed core as it backs away.</li><li>Repeat the whole mote-and-eye cycle until the boss is dead.</li></ol>
<strong>What wipes you</strong> Failing to shoot the correct eyes in time kills whoever's holding Voltaic Overflow, and if all three chase-team players end up unable to pick up the charge at once, rotate someone in from the mote team immediately or the cycle stalls.</div><div id="encounter-defeat-sanctified-mind">4
<h3>Defeat Sanctified Mind</h3>
<strong>Objective</strong> Fill two relays with 30 motes each by sending players through temporary portals, then use those relays to stun the boss and deal damage.
<strong>Roles</strong> Two pairs collect motes on each side of the arena; one pair manages the relays, rebuilds broken platforms, and clears enemies.
<ol><li>Damage the boss and clear the enemies that spawn, including a shielded flyer that unlocks the relays.</li><li>Destroy the boss's shoulder or knee to open a portal, sending a pair through to collect motes on that side.</li><li>Destroy the same shoulder or knee again to pull that pair back, then immediately send the next pair through.</li><li>Deposit collected motes into the matching colored relay each time a pair returns, until both relays hit 30.</li><li>When the boss shows a colored symbol, use the matching relay to tether and break it, then immediately switch to the opposite relay to break the second symbol.</li><li>With both symbols broken, group up and unload damage on the boss's stomach before it resets, then repeat the whole cycle.</li></ol>
<strong>What wipes you</strong> Standing on a platform when the boss destroys it kills you instantly, so use the relay tether to rebuild broken platforms before they're needed again, and always know which platforms are safe before you need to cross them.</div></div>

  const raid = window.RaidsData.RAIDS.find(r => r.slug === slug);
  if (raid && !window.GUIDE_SLUG){
    location.replace(window.rallyFlagGuideHref("raid", raid.slug) + location.hash);
    return;

  const content = document.getElementById("content");

  function encounterAnchorId(e, i){
    return "encounter-" + (e.name ? slugify(e.name) : (i + 1));

    return (activeDifficulty === "Epic" && raid.epicEncounters) ? raid.epicEncounters : raid.encounters;

      encounterSubnavEl.innerHTML = encounters.map((e, i) =>
        '<a href="#' + encounterAnchorId(e, i) + '">' + e.name + '</a>'
      ).join("");
    } else {
      encounterSubnavEl.style.display = "none";
    }
  }
  renderSubnav();
  encounterSubnavEl.addEventListener("click", (ev) => {
    const link = ev.target.closest("a");
    if (!link) return;
    const target = document.querySelector(link.getAttribute("href"));
    if (!target) return;
    ev.preventDefault();
    target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    history.replaceState(null, "", link.getAttribute("href"));
  });

  const setsBySlug = {};
  window.ArmorSetsData.SETS.forEach(s => setsBySlug[s.slug] = s);

  const setLinksHtml = raid.armorSlugs.map(slug => {
    const set = setsBySlug[slug];
    const label = set ? set.name : slug;
    return '<a class="set-link" href="armor-set-bonuses.html?highlight=' + slug + '">' + label + ' \u2192</a>';
  }).join("");

  function buildEncountersHtml(encounters){
    return encounters.length
    ? encounters.map((e, i) => {
        if (e.objective || e.steps){
          const hl = window.GameTerms.highlight;
          const stepsHtml = (e.steps || []).map(s => '<li>' + hl(s) + '</li>').join("");
          const mapHtml = e.mapImage
            ? '<div class="encounter-map"><img src="' + e.mapImage.url + '" alt="' + e.name + ' encounter map" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.mapImage.credit +
              (e.mapImage.creditUrl ? ' · <a href="' + e.mapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const secondaryMapHtml = e.secondaryMapImage
            ? '<div class="encounter-map"><img src="' + e.secondaryMapImage.url + '" alt="' + e.name + ' encounter map variant" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.secondaryMapImage.credit +
              (e.secondaryMapImage.creditUrl ? ' · <a href="' + e.secondaryMapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const strategyHtml = e.strategyImage
            ? '<div class="encounter-map"><img src="' + e.strategyImage.url + '" alt="' + e.name + ' strategy diagram" loading="lazy">' +
              (e.strategyImage.label ? '<div class="encounter-map-label">' + e.strategyImage.label + '</div>' : '') +
              '</div>'
            : '';
          const advancedHtml = (e.advancedTactics && e.advancedTactics.length)
            ? '<div class="encounter-advanced">' +
                '<button class="encounter-advanced-toggle" type="button"><span class="caret">\u25b8</span> Advanced tactic (optional)</button>' +
                '<div class="encounter-advanced-body">' +
                  e.advancedTactics.map(t => '<p>' + hl(t) + '</p>').join("") +
                '</div>' +
              '</div>'
            : '';
          const encounterPuzzleHelperHtml = e.puzzleHelper
            ? '<a class="block panel-card puzzle-helper-link encounter-puzzle-helper-link" href="puzzle-helper.html?tool=' + e.puzzleHelper.slug + '">' +
                '<div>' +
                  '<div class="puzzle-helper-link-title">' + e.puzzleHelper.title + '</div>' +
                  '<div class="puzzle-helper-link-sub">' + e.puzzleHelper.blurb + '</div>' +
                '</div>' +
                '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
              '</a>'
            : '';
          return '<div class="block panel-card encounter-card" id="' + encounterAnchorId(e, i) + '">' +
            '<div class="encounter-head"><div class="encounter-num">' + (i + 1) + '</div><h3 class="encounter-title">' + e.name + '</h3></div>' +
            (e.objective ? '<div class="encounter-field"><span class="encounter-field-label">Objective</span>' + hl(e.objective) + '</div>' : '') +
            (e.roles ? '<div class="encounter-field"><span class="encounter-field-label">Roles</span>' + hl(e.roles) + '</div>' : '') +
            mapHtml +
            secondaryMapHtml +
            strategyHtml +
            (stepsHtml ? '<ol class="encounter-steps">' + stepsHtml + '</ol>' : '') +
            (e.wipe ? '<div class="encounter-wipe"><span class="encounter-wipe-label">What wipes you</span>' + hl(e.wipe) + '</div>' : '') +
            (e.master ? '<div class="encounter-master"><span class="encounter-master-label">On Master</span>' + hl(e.master) + '</div>' : '') +
            advancedHtml +
            encounterPuzzleHelperHtml +
          '</div>';
        }
        // Fallback for older, simpler encounter entries
        return '<div class="block panel-card encounter-card encounter-row" id="' + encounterAnchorId(e, i) + '"><div class="encounter-num">' + (i + 1) + '</div>' +
          '<div><div class="encounter-name">' + e.name + '</div><div class="encounter-notes">' + (e.notes || "") + '</div></div></div>';
      }).join("")
    : '<div class="block panel-card"><div class="block-empty">Encounter notes coming soon.</div></div>';
  }

  const difficultyToggleHtml = raid.epicEncounters
    ? '<div class="difficulty-toggle" id="difficulty-toggle">' +
        '<button type="button" class="difficulty-toggle-btn active" data-difficulty="Normal">Normal</button>' +
        '<button type="button" class="difficulty-toggle-btn" data-difficulty="Epic">Epic</button>' +
      '</div>'
    : '';

  const puzzleHelperHtml = raid.puzzleHelper
    ? '<a class="block panel-card puzzle-helper-link" href="puzzle-helper.html?tool=' + raid.puzzleHelper.slug + '">' +
        '<div>' +
          '<div class="puzzle-helper-link-title">' + raid.puzzleHelper.title + '</div>' +
          '<div class="puzzle-helper-link-sub">' + raid.puzzleHelper.blurb + '</div>' +
        '</div>' +
        '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
      '</a>'
    : '';

  const raidMasterNoteHtml = (raid.difficulties && raid.difficulties.includes("Master"))
    ? '<div class="raid-master-note"><span class="raid-master-note-label">Master Difficulty</span>' +
        "Master raises enemies well above the raid's Normal Power level — expect a Power deficit unless you're specifically geared for it — and every hit lands harder across the board. Several encounters also add Champions (Barrier, Overload, or Unstoppable) that don't appear on Normal; check the callout under an affected encounter below for which ones and where." +
      '</div>'
    : '';

  content.innerHTML =
    '<div class="block panel-card">' +
      '<div class="block-label">Overview</div>' +
      (raid.summary ? '<p>' + raid.summary + '</p>' : '<div class="block-empty">Overview coming soon.</div>') +
      raidMasterNoteHtml +
    '</div>' +
    '<div class="block-label-row encounters-head"><h2 class="block-label">Encounters</h2>' + difficultyToggleHtml + '</div>' +
    '<div id="encounters-body">' + buildEncountersHtml(currentEncounters()) + '</div>' +
    puzzleHelperHtml +
    '<div class="block panel-card">' +
      '<div class="block-label">Armor Sets From This Raid</div>' +
      '<div class="set-links">' + setLinksHtml + '</div>' +
    '</div>';

  content.addEventListener("click", (ev) => {
    const advToggle = ev.target.closest(".encounter-advanced-toggle");
    if (advToggle){
      advToggle.closest(".encounter-advanced").classList.toggle("open");
      return;
    }
    const diffBtn = ev.target.closest(".difficulty-toggle-btn");
    if (diffBtn){
      const newDifficulty = diffBtn.dataset.difficulty;
      if (newDifficulty === activeDifficulty) return;
      activeDifficulty = newDifficulty;
      content.querySelectorAll(".difficulty-toggle-btn").forEach(b => b.classList.toggle("active", b.dataset.difficulty === activeDifficulty));
      document.getElementById("encounters-body").innerHTML = buildEncountersHtml(currentEncounters());
      renderSubnav();
    }
  });
})();
</script>
<script src="assets/your-clears.js"></script>
</body>
</html>
