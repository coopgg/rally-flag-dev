<p>Pit of Heresy leans hard on one recurring idea: pick up a Hive relic sword, then use its light attack, heavy attack, or block to match whichever miniboss type you're facing. Learn that pattern once and most of the dungeon's puzzle rooms fall into place.</p>
<h2>Encounters</h2><div id="encounter-necropolis">1
<h3>Necropolis</h3>
<strong>Objective</strong> Find three symbol-marked rooms and use a Hive relic sword to defeat the specific miniboss guarding each one.
<strong>Roles</strong> No fixed roles. Clear as a group and share relic sword duty.
<ol><li>Look at the symbols in the starting room, then head out to find matching giant holograms around the area.</li><li>Defeat one of the patrolling Knights to claim a Hive relic sword. Watch out, some travel with an Ogre escort.</li><li>Bring the sword into each symbol room and use the correct attack for that miniboss: light attack for the Knight, heavy ranged blast for the Wizard, and guard for the Shrieker.</li><li>Clear all three rooms to break their chains and open the way forward.</li></ol>
<strong>What wipes you</strong> There's no hard wipe mechanic here. The main danger is losing the relic sword to a bad fight or getting caught by an Ogre while unarmed.</div><div id="encounter-tunnels-of-despair">2
<h3>Tunnels of Despair</h3>
<strong>Objective</strong> Kill Knights for a collectible orb and use it to snuff out three doors, while avoiding invincible Ogres patrolling the tunnels.
<strong>Roles</strong> No fixed roles. Move carefully and share lookout duty for Ogres.
<ol><li>Shoot through the webbing blocking the tunnel entrance.</li><li>Defeat a Knight to claim the orb it drops.</li><li>Carry the orb to one of the three doors and use it to extinguish that door's seal.</li><li>Repeat for the other two doors, staying alert for the Ogres patrolling the main tunnels.</li></ol>
<strong>What wipes you</strong> The Ogres here can't be killed and hit hard. There's no wipe condition tied to them directly, but getting caught out in the open is a fast way to lose a teammate.</div><div id="encounter-chamber-of-suffering">3
<h3>Chamber of Suffering</h3>
<strong>Objective</strong> Defend a totem plate while collecting orbs from Knights, then use six orbs to open the door forward, all while a stacking debuff punishes taking too long.
<strong>Roles</strong> One player holds the totem plate; the others clear enemies and funnel orbs back.
<ol><li>Have one player stand on the plate beneath the totem to keep it from wiping the team.</li><li>Defeat the Knights that spawn and collect the orbs they drop.</li><li>Deposit six orbs total at the door behind the totem to clear the encounter.</li><li>Prioritize any Knights that spawn on high ledges immediately, since they'll bombard the plate holder from range.</li></ol>
<strong>What wipes you</strong> A stacking debuff builds the longer you're in the room, eventually making almost any hit lethal, so treat this encounter as a speed run, not a slow clear.</div><div id="encounter-the-harrow">4
<h3>The Harrow</h3>
<strong>Objective</strong> Find three symbols scattered through a maze of traps and defeat the Wizard guarding each one to break a seal.
<strong>Roles</strong> No fixed roles. Move carefully as a group.
<ol><li>Note the three symbols shown at the entrance.</li><li>Search the surrounding maze for matching symbols.</li><li>Defeat the Wizard standing near each one to break its seal.</li><li>Break all three seals to complete the encounter.</li></ol>
<strong>What wipes you</strong> The real threat here is the maze itself: falling to your death or getting caught by a hard-hitting Wizard is a bigger risk than any dedicated wipe mechanic.</div><div id="encounter-zulmak-instrument-of-torment">5
<h3>Zulmak, Instrument of Torment</h3>
<strong>Objective</strong> Use relic swords to defeat three minibosses around the arena, extinguish a central pedestal with their orbs, then damage Zulmak before retreating from his charge attack.
<strong>Roles</strong> No fixed roles. Share sword duty and coordinate who's clearing the arena versus who's fighting minibosses.
<ol><li>Defeat a Knight near the center to claim a relic sword.</li><li>Use the sword's correct attack on one of the three miniboss types stationed around the arena: Knight, Wizard, or Shrieker.</li><li>Take the orb it drops to the central pedestal and extinguish it.</li><li>Repeat for the other two minibosses, then damage Zulmak once all three orbs are used.</li><li>Watch for his line-of-fire attack and relocate if it's headed your way.</li><li>When he kneels to charge a crystal, get out of the arena before it detonates, then repeat the whole cycle until he's dead.</li></ol>
<strong>What wipes you</strong> Staying inside the arena when Zulmak's charged crystal goes off kills anyone still standing there, so always confirm everyone's clear before it detonates.</div>

<script>
(function(){
  // Generated per-dungeon pages (dungeon-<slug>.html, tools/build-guide-pages.js)
  // set GUIDE_SLUG. On this template page, an old ?slug= link forwards to
  // the dungeon's own page, whose static tags give proper link previews.
  const slug = window.GUIDE_SLUG || new URLSearchParams(window.location.search).get("slug");
  const dungeon = window.DungeonsData.DUNGEONS.find(d => d.slug === slug);
  if (dungeon && !window.GUIDE_SLUG){
    location.replace(window.rallyFlagGuideHref("dungeon", dungeon.slug) + location.hash);
    return;
  }
  const content = document.getElementById("content");

  if (!dungeon){
    document.getElementById("dungeon-title").textContent = "Dungeon not found";
    content.innerHTML = '<div class="not-found panel-card block">Head back to <a href="dungeons.html">the dungeon list</a> and pick one from there.</div>';
    return;
  }

  document.title = dungeon.name + " Dungeon Guide - Rally Flag";
  document.getElementById("dungeon-title").textContent = dungeon.name;
  // Header sits over the dungeon's official art.
  if (dungeon.art){
    const hero = document.getElementById("hero");
    hero.classList.add("has-art");
    const tint = window.rallyFlagArtTint(dungeon.art); // its colour shows until the art loads
    hero.insertAdjacentHTML("afterbegin", '<div class="hero-art"' + (tint ? ' style="background-color:' + tint + '"' : "") + '><img src="' + window.rallyFlagArtUrl(dungeon.art) + '" alt="" fetchpriority="high"></div>');
  }


  function slugify(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function encounterAnchorId(e, i){
    return "encounter-" + (e.name ? slugify(e.name) : (i + 1));
  }

  const encounterSubnavEl = document.getElementById("encounter-subnav");
  if (dungeon.encounters.length){
    encounterSubnavEl.innerHTML = dungeon.encounters.map((e, i) =>
      '<a href="#' + encounterAnchorId(e, i) + '">' + e.name + '</a>'
    ).join("");
    encounterSubnavEl.addEventListener("click", (ev) => {
      const link = ev.target.closest("a");
      if (!link) return;
      const target = document.querySelector(link.getAttribute("href"));
      if (!target) return;
      ev.preventDefault();
      target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      history.replaceState(null, "", link.getAttribute("href"));
    });
  } else {
    encounterSubnavEl.style.display = "none";
  }

  const setsBySlug = {};
  window.ArmorSetsData.SETS.forEach(s => setsBySlug[s.slug] = s);

  const setLinksHtml = dungeon.armorSlugs.map(slug => {
    const set = setsBySlug[slug];
    const label = set ? set.name : slug;
    return '<a class="set-link" href="armor-set-bonuses.html?highlight=' + slug + '">' + label + ' \u2192</a>';
  }).join("");

  const encountersHtml = dungeon.encounters.length
    ? dungeon.encounters.map((e, i) => {
        if (e.objective || e.steps){
          const hl = window.GameTerms.highlight;
          const stepsHtml = (e.steps || []).map(s => '<li>' + hl(s) + '</li>').join("");
          return '<div class="block panel-card encounter-card" id="' + encounterAnchorId(e, i) + '">' +
            '<div class="encounter-head"><div class="encounter-num">' + (i + 1) + '</div><h3 class="encounter-title">' + e.name + '</h3></div>' +
            (e.objective ? '<div class="encounter-field"><span class="encounter-field-label">Objective</span>' + hl(e.objective) + '</div>' : '') +
            (e.roles ? '<div class="encounter-field"><span class="encounter-field-label">Roles</span>' + hl(e.roles) + '</div>' : '') +
            (stepsHtml ? '<ol class="encounter-steps">' + stepsHtml + '</ol>' : '') +
            (e.wipe ? '<div class="encounter-wipe"><span class="encounter-wipe-label">What wipes you</span>' + hl(e.wipe) + '</div>' : '') +
          '</div>';
        }
        // Fallback for older, simpler encounter entries
        return '<div class="block panel-card encounter-card encounter-row" id="' + encounterAnchorId(e, i) + '"><div class="encounter-num">' + (i + 1) + '</div>' +
          '<div><div class="encounter-name">' + e.name + '</div><div class="encounter-notes">' + (e.notes || "") + '</div></div></div>';
      }).join("")
    : '<div class="block panel-card"><div class="block-empty">Encounter notes coming soon.</div></div>';

  content.innerHTML =
    '<div class="block panel-card">' +
      '<div class="block-label">Overview</div>' +
      (dungeon.summary ? '<p>' + dungeon.summary + '</p>' : '<div class="block-empty">Overview coming soon.</div>') +
    '</div>' +
    '<h2 class="block-label encounters-head">Encounters</h2>' +
    encountersHtml +
    '<div class="block panel-card">' +
      '<div class="block-label">Armor Sets From This Dungeon</div>' +
      '<div class="set-links">' + setLinksHtml + '</div>' +
    '</div>';
})();
</script>
