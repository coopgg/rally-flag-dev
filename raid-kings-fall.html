<h1 id="raid-title">King's Fall</h1> <div id="raid-difficulty">Normal · Master</div>
<a href="guides.html">Overview</a> <a href="raids.html">Raids</a> <a href="dungeons.html">Dungeons</a> <a href="public-events.html">Public Events</a>
<div id="encounter-subnav"><a href="#encounter-relics-opening-the-gate">Relics &amp; Opening the Gate</a> <a href="#encounter-annihilator-totems">Annihilator Totems</a> <a href="#encounter-the-warpriest">The Warpriest</a> <a href="#encounter-golgoroth">Golgoroth</a> <a href="#encounter-daughters-of-oryx">Daughters of Oryx</a> <a href="#encounter-oryx-the-taken-king">Oryx, The Taken King</a></div></div> <section id="content">Overview
<p>King's Fall reintroduces a lot of ideas from Destiny's original raids: statues, totems, and boss fights that hinge on trading a single buff back and forth between a handful of players. Nothing here is subtle: if a role isn't being covered, you'll know almost immediately.</p>
<strong>Master Difficulty</strong> Master raises enemies well above the raid's Normal Power level — expect a Power deficit unless you're specifically geared for it — and every hit lands harder across the board. Several encounters also add Champions (Barrier, Overload, or Unstoppable) that don't appear on Normal; check the callout under an affected encounter below for which ones and where.
<h2>Encounters</h2>
<div id="encounters-body"><div id="encounter-relics-opening-the-gate">1
<h3>Relics &amp; Opening the Gate</h3>
<strong>Objective</strong> Carry two orbs, one from each side room, back to whichever statue in the center is currently lit, and deposit them there together to unlock the path forward.
<strong>Roles</strong> Split into two groups of three, one per side, each with a dedicated orb carrier.
<ol><li>Send one group left and one right, with one player per group responsible for grabbing the orb.</li><li>Have the other two players in each group clear enemies and destroy barriers blocking the return path.</li><li>Carry the orb back to the center and deposit it at whichever statue is currently lit — the left and right orb need to land there within a few seconds of each other, so whichever side gets there first should wait on the other.</li><li>Repeat for six rounds total, since orbs spawn slightly farther away each round and expire if held too long.</li><li>Once all six rounds are done, clear the remaining enemies near the portal to open it.</li></ol>
<strong>What wipes you</strong> Orbs expire if carried too long without being deposited, and depositing without the other side's orb landing at nearly the same time fails that round, forcing a retry. If a carrier goes down or gets cut off, grab the dropped orb quickly or the timer will force a restart on that run.
<strong>On Master</strong> On Master, the side-route Taken Phalanxes become Unstoppable Champions, and the central Taken Hobgoblin becomes an Overload Champion.</div><div id="encounter-annihilator-totems">2
<h3>Annihilator Totems</h3>
<strong>Objective</strong> Keep a totem in each of two side rooms defended at all times while running a three-player rotation that charges a central plate.
<strong>Roles</strong> Two teams of three, one per side room, each running a fixed rotation: Brand holder, plate depositor, balcony claimer.
<ol><li>Send half the team to each side room.</li><li>Have one player grab the Brand of the Unraveler or Brand of the Weaver (whichever matches your side) and stand near the totem, killing enemies to build Deathsinger's Power — never leave the totem undefended, even briefly.</li><li>Have another player clear the balcony (kill the enemy that spawns there, then the one it summons) to get the Brand Claimer buff, which lets them steal the Brand from the current holder.</li><li>Once the Brand is stolen, the player who lost it heads to the center plate and stands there until their Deathsinger's Power fully drains.</li><li>After draining, that same player becomes the next balcony claimer, continuing the rotation: holder, to depositor, to claimer, and back to holder again.</li><li>Repeat this loop on both sides until the encounter ends. There's no boss here, just constant buff management.</li></ol>
<strong>What wipes you</strong> Leaving a totem completely undefended wipes the team after a few seconds, so even mid-rotation, always make sure someone's covering it.
<strong>On Master</strong> On Master, three Unstoppable Champion Ogres appear together: one in the center room and one in each totem room.</div><div id="encounter-the-warpriest">3
<h3>The Warpriest</h3>
<strong>Objective</strong> Read a hidden sequence of glowing plates to earn the Brand of the Initiate, then burn the boss down while managing who's exposed to a room-clearing blast.
<strong>Roles</strong> Split into three pairs across the room; whoever ends up on the final plate gets the Brand of the Initiate and needs it passed along by teammates.
<ol><li>Clear enemies until a specific enemy type spawns and dies, which starts a sequence.</li><li>Stand on the center plate to see which side plate lights up first, then move to that plate.</li><li>From there, call out which plate lights up next, and repeat until three plates have been used in sequence.</li><li>Whoever stood on the final plate gets the Brand of the Initiate, so group up and burn the boss while it's active.</li><li>When the Brand's timer runs low, have someone grab the Brand Claimer buff from a Knight to pass the Brand to a new player, keeping the damage phase going.</li><li>When the boss unleashes his room-clearing attack, take cover behind one of the pillars to avoid it, then repeat the whole sequence.</li></ol>
<strong>What wipes you</strong> Letting the Brand of the Initiate's timer expire with nobody ready to take it over stalls the whole encounter, and getting caught without cover during the boss's blast can wipe the team outright. There's also a hard ceiling: using a pillar for cover destroys it, so you've only got a few uses before you're out of cover entirely.
<strong>On Master</strong> On Master, the glyph-plate Knights become Barrier Champions. Once the fight shifts to its Taken-heavy state, their replacements are Overload Taken Hobgoblins instead.</div><div id="encounter-golgoroth">4
<h3>Golgoroth</h3>
<strong>Objective</strong> Juggle a boss's attention between two players while the rest of the team shoots down orbs and deals damage from special pools on the ground.
<strong>Roles</strong> Two players trade the boss's aggro back and forth; everyone else destroys orbs, stands in the resulting pools, and deals damage.
<ol><li>Have one player shoot the boss's back to take Golgoroth's Gaze, giving the team a safe window.</li><li>While that's active, other players destroy an overhead orb, which creates a Pool of Reclaimed Light on the ground.</li><li>Stand in the Pool of Reclaimed Light to damage the boss's exposed weak point.</li><li>Just before the aggro timer runs out, the second player takes over Golgoroth's Gaze so the first can rotate to safety.</li><li>Repeat with a new orb and pool each time the Gaze swaps, watching for Unstable Light, which will explode on whoever's affected — move away from allies once you're marked, though exploding close to the boss himself deals him a solid chunk of damage, so use it as a parting shot if you can.</li><li>Continue until either all the available orbs are used or the boss is defeated.</li></ol>
<strong>What wipes you</strong> Failing to pass the boss's attention in time gets whoever's exposed killed, and letting too many orbs go unused across the fight eventually wipes the whole team. Both are about timing, not damage.
<strong>On Master</strong> On Master, the Knights controlling the final bridge or gate become Barrier Champions.</div><div id="encounter-daughters-of-oryx">5
<h3>Daughters of Oryx</h3>
<strong>Objective</strong> Repeatedly build a path across the arena to collect pieces of the Blightguard, then use it to steal the Aura of Immortality from one of two bosses and burn her down before a timer expires.
<strong>Roles</strong> One player gets randomly selected each round to cross the path and collect the Blightguard piece; everyone else manages the plates and clears adds.
<ol><li>Stand on the glowing plate to reveal which second plate needs to be activated, forming a path across the room.</li><li>The randomly chosen player crosses that path to collect a piece of the Blightguard.</li><li>Repeat this three times to gather all the pieces needed.</li><li>On the third piece, the same player uses it to steal the Aura of Immortality from whichever daughter is actively shooting at the team, not the one singing — this is also around when her sister's wipe-attack timer is running out, so move quickly.</li><li>With the aura stolen, the whole team groups up inside it and burns down that same daughter, the one you stole the aura from, before her sister's song finishes.</li><li>Repeat the entire process for the second boss.</li></ol>
<strong>What wipes you</strong> The boss's song wipes the team automatically if nobody steals her aura in time. The whole encounter is a race to build the path and grab the buff pieces fast enough to make that deadline every round.
<strong>On Master</strong> On Master, the Knight that begins each ascendant path becomes a Barrier Champion.</div><div id="encounter-oryx-the-taken-king">6
<h3>Oryx, The Taken King</h3>
<strong>Objective</strong> Repeat a path-and-buff cycle similar to the Daughters fight to steal an aura, use it to safely detonate bombs that stun Oryx, then damage his exposed chest, across several long rounds.
<strong>Roles</strong> One player gets randomly selected each round to cross the path; a few players are responsible for triggering bombs during the stun window; everyone else clears enemies and supports.
<ol><li>Build the path and send the selected player across to collect a piece of the Blightguard, repeating this three times as in the earlier fight.</li><li>Defeat the Light-Eater Ogres that drop Corrupted Light bombs around the room, along with the Light-Eater Knights that try to disarm them.</li><li>On the third piece, use it to steal the Aura of Immortality from the Vessel of Oryx.</li><li>When the boss begins his wipe attack, each assigned player must walk fully into their Corrupted Light and wait for it to arm, then sprint back to the Aura of Immortality holder's position before it detonates — anyone still outside the aura when it goes off is killed.</li><li>With Oryx stunned, unload damage on his exposed chest.</li><li>After the damage window ends, either survive a wave of extra attacks or fight through a side challenge, depending on which one triggers, then repeat the whole cycle until his health is low enough for the final stand.</li><li>In the final stand, two Light-Eater Ogres spawn and drop two more bombs instead of four — trigger them one at a time rather than together, and finish him off before you run out of chances; failing here wipes the team even while standing in the aura.</li></ol>
<strong>What wipes you</strong> Missing the bomb detonation window during his wipe attack is an instant wipe, though triggering even just one bomb is enough to stun him and avoid that — triggering more just extends the damage window. Failing to get back into the aura before a triggered bomb detonates kills whoever's still outside it. This is one of the longest fights in the game, so pace your ammo and your patience accordingly.
<strong>On Master</strong> On Master, the Knights standing on the plates become Overload Taken Hobgoblins.</div></div>

<script src="assets/game-terms.js"></script>
<script src="assets/art-tints.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/raids-data.js"></script>
<script src="assets/sets-data.js"></script>
<script>
(function(){
  // Generated per-raid pages (raid-<slug>.html, tools/build-guide-pages.js)
  // set GUIDE_SLUG. On this template page, an old ?slug= link forwards to
  // the raid's own page, whose static tags give proper link previews.
  const slug = window.GUIDE_SLUG || new URLSearchParams(window.location.search).get("slug");
  const raid = window.RaidsData.RAIDS.find(r => r.slug === slug);
  if (raid && !window.GUIDE_SLUG){
    location.replace(window.rallyFlagGuideHref("raid", raid.slug) + location.hash);
    return;
  }
  const content = document.getElementById("content");

  if (!raid){
    document.getElementById("raid-title").textContent = "Raid not found";
    content.innerHTML = '<div class="not-found panel-card block">Head back to <a href="raids.html">the raid list</a> and pick one from there.</div>';
    return;
  }

  document.title = raid.name + " Raid Guide - Rally Flag";
  document.getElementById("raid-title").textContent = raid.name;
  // Header sits over the raid's official art.
  if (raid.art){
    const hero = document.getElementById("hero");
    hero.classList.add("has-art");
    const tint = window.rallyFlagArtTint(raid.art); // its colour shows until the art loads
    hero.insertAdjacentHTML("afterbegin", '<div class="hero-art"' + (tint ? ' style="background-color:' + tint + '"' : "") + '><img src="' + window.rallyFlagArtUrl(raid.art) + '" alt="" fetchpriority="high"></div>');
  }
  document.getElementById("raid-difficulty").textContent = raid.difficulties ? raid.difficulties.join(" · ") : "";

  function slugify(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function encounterAnchorId(e, i){
    return "encounter-" + (e.name ? slugify(e.name) : (i + 1));
  }

  let activeDifficulty = "Normal";
  function currentEncounters(){
    return (activeDifficulty === "Epic" && raid.epicEncounters) ? raid.epicEncounters : raid.encounters;
  }

  const encounterSubnavEl = document.getElementById("encounter-subnav");
  function renderSubnav(){
    const encounters = currentEncounters();
    if (encounters.length){
      encounterSubnavEl.style.display = "";
      encounterSubnavEl.innerHTML = encounters.map((e, i) =>
        '<a href="#' + encounterAnchorId(e, i) + '">' + e.name + '</a>'
      ).join("");
    } else {
      encounterSubnavEl.style.display = "none";
    }
  }
  renderSubnav();
  encounterSubnavEl.addEventListener("click", (ev) => {
    const link = ev.target.closest("a");
    if (!link) return;
    const target = document.querySelector(link.getAttribute("href"));
    if (!target) return;
    ev.preventDefault();
    target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    history.replaceState(null, "", link.getAttribute("href"));
  });

  const setsBySlug = {};
  window.ArmorSetsData.SETS.forEach(s => setsBySlug[s.slug] = s);

  const setLinksHtml = raid.armorSlugs.map(slug => {
    const set = setsBySlug[slug];
    const label = set ? set.name : slug;
    return '<a class="set-link" href="armor-set-bonuses.html?highlight=' + slug + '">' + label + ' \u2192</a>';
  }).join("");

  function buildEncountersHtml(encounters){
    return encounters.length
    ? encounters.map((e, i) => {
        if (e.objective || e.steps){
          const hl = window.GameTerms.highlight;
          const stepsHtml = (e.steps || []).map(s => '<li>' + hl(s) + '</li>').join("");
          const mapHtml = e.mapImage
            ? '<div class="encounter-map"><img src="' + e.mapImage.url + '" alt="' + e.name + ' encounter map" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.mapImage.credit +
              (e.mapImage.creditUrl ? ' · <a href="' + e.mapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const secondaryMapHtml = e.secondaryMapImage
            ? '<div class="encounter-map"><img src="' + e.secondaryMapImage.url + '" alt="' + e.name + ' encounter map variant" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.secondaryMapImage.credit +
              (e.secondaryMapImage.creditUrl ? ' · <a href="' + e.secondaryMapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const strategyHtml = e.strategyImage
            ? '<div class="encounter-map"><img src="' + e.strategyImage.url + '" alt="' + e.name + ' strategy diagram" loading="lazy">' +
              (e.strategyImage.label ? '<div class="encounter-map-label">' + e.strategyImage.label + '</div>' : '') +
              '</div>'
            : '';
          const advancedHtml = (e.advancedTactics && e.advancedTactics.length)
            ? '<div class="encounter-advanced">' +
                '<button class="encounter-advanced-toggle" type="button"><span class="caret">\u25b8</span> Advanced tactic (optional)</button>' +
                '<div class="encounter-advanced-body">' +
                  e.advancedTactics.map(t => '<p>' + hl(t) + '</p>').join("") +
                '</div>' +
              '</div>'
            : '';
          const encounterPuzzleHelperHtml = e.puzzleHelper
            ? '<a class="block panel-card puzzle-helper-link encounter-puzzle-helper-link" href="puzzle-helper.html?tool=' + e.puzzleHelper.slug + '">' +
                '<div>' +
                  '<div class="puzzle-helper-link-title">' + e.puzzleHelper.title + '</div>' +
                  '<div class="puzzle-helper-link-sub">' + e.puzzleHelper.blurb + '</div>' +
                '</div>' +
                '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
              '</a>'
            : '';
          return '<div class="block panel-card encounter-card" id="' + encounterAnchorId(e, i) + '">' +
            '<div class="encounter-head"><div class="encounter-num">' + (i + 1) + '</div><h3 class="encounter-title">' + e.name + '</h3></div>' +
            (e.objective ? '<div class="encounter-field"><span class="encounter-field-label">Objective</span>' + hl(e.objective) + '</div>' : '') +
            (e.roles ? '<div class="encounter-field"><span class="encounter-field-label">Roles</span>' + hl(e.roles) + '</div>' : '') +
            mapHtml +
            secondaryMapHtml +
            strategyHtml +
            (stepsHtml ? '<ol class="encounter-steps">' + stepsHtml + '</ol>' : '') +
            (e.wipe ? '<div class="encounter-wipe"><span class="encounter-wipe-label">What wipes you</span>' + hl(e.wipe) + '</div>' : '') +
            (e.master ? '<div class="encounter-master"><span class="encounter-master-label">On Master</span>' + hl(e.master) + '</div>' : '') +
            advancedHtml +
            encounterPuzzleHelperHtml +
          '</div>';
        }
        // Fallback for older, simpler encounter entries
        return '<div class="block panel-card encounter-card encounter-row" id="' + encounterAnchorId(e, i) + '"><div class="encounter-num">' + (i + 1) + '</div>' +
          '<div><div class="encounter-name">' + e.name + '</div><div class="encounter-notes">' + (e.notes || "") + '</div></div></div>';
      }).join("")
    : '<div class="block panel-card"><div class="block-empty">Encounter notes coming soon.</div></div>';
  }

  const difficultyToggleHtml = raid.epicEncounters
    ? '<div class="difficulty-toggle" id="difficulty-toggle">' +
        '<button type="button" class="difficulty-toggle-btn active" data-difficulty="Normal">Normal</button>' +
        '<button type="button" class="difficulty-toggle-btn" data-difficulty="Epic">Epic</button>' +
      '</div>'
    : '';

  const puzzleHelperHtml = raid.puzzleHelper
    ? '<a class="block panel-card puzzle-helper-link" href="puzzle-helper.html?tool=' + raid.puzzleHelper.slug + '">' +
        '<div>' +
          '<div class="puzzle-helper-link-title">' + raid.puzzleHelper.title + '</div>' +
          '<div class="puzzle-helper-link-sub">' + raid.puzzleHelper.blurb + '</div>' +
        '</div>' +
        '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
      '</a>'
    : '';

  const raidMasterNoteHtml = (raid.difficulties && raid.difficulties.includes("Master"))
    ? '<div class="raid-master-note"><span class="raid-master-note-label">Master Difficulty</span>' +
        "Master raises enemies well above the raid's Normal Power level — expect a Power deficit unless you're specifically geared for it — and every hit lands harder across the board. Several encounters also add Champions (Barrier, Overload, or Unstoppable) that don't appear on Normal; check the callout under an affected encounter below for which ones and where." +
      '</div>'
    : '';

  content.innerHTML =
    '<div class="block panel-card">' +
      '<div class="block-label">Overview</div>' +
      (raid.summary ? '<p>' + raid.summary + '</p>' : '<div class="block-empty">Overview coming soon.</div>') +
      raidMasterNoteHtml +
    '</div>' +
    '<div class="block-label-row encounters-head"><h2 class="block-label">Encounters</h2>' + difficultyToggleHtml + '</div>' +
    '<div id="encounters-body">' + buildEncountersHtml(currentEncounters()) + '</div>' +
    puzzleHelperHtml +
    '<div class="block panel-card">' +
      '<div class="block-label">Armor Sets From This Raid</div>' +
      '<div class="set-links">' + setLinksHtml + '</div>' +
    '</div>';

  content.addEventListener("click", (ev) => {
    const advToggle = ev.target.closest(".encounter-advanced-toggle");
    if (advToggle){
      advToggle.closest(".encounter-advanced").classList.toggle("open");
      return;
    }
    const diffBtn = ev.target.closest(".difficulty-toggle-btn");
    if (diffBtn){
      const newDifficulty = diffBtn.dataset.difficulty;
      if (newDifficulty === activeDifficulty) return;
      activeDifficulty = newDifficulty;
      content.querySelectorAll(".difficulty-toggle-btn").forEach(b => b.classList.toggle("active", b.dataset.difficulty === activeDifficulty));
      document.getElementById("encounters-body").innerHTML = buildEncountersHtml(currentEncounters());
      renderSubnav();
    }
  });
})();
</script>
<script src="assets/your-clears.js"></script>
</body>
