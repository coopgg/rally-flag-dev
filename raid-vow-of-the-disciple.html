<h1 id="raid-title">Vow of the Disciple</h1> <div id="raid-difficulty">Normal · Master</div>
<a href="guides.html">Overview</a> <a href="raids.html">Raids</a> <a href="dungeons.html">Dungeons</a> <a href="public-events.html">Public Events</a>
<div id="encounter-subnav"><a href="#encounter-payload">Payload</a> <a href="#encounter-acquisition">Acquisition</a> <a href="#encounter-the-caretaker">The Caretaker</a> <a href="#encounter-the-upended">The Upended</a> <a href="#encounter-rhulk-disciple-of-the-witness">Rhulk, Disciple of the Witness</a></div></div> <section id="content">Overview
<p>Vow of the Disciple hinges on symbol callouts more than any raid before it. Nearly every encounter has you finding two or three symbols, matching them to a target, and acting fast once you do. It also introduces a stacking darkness debuff that follows you through the whole raid, so managing that matters as much as the mechanics themselves.</p>
<strong>Master Difficulty</strong> Master raises enemies well above the raid's Normal Power level — expect a Power deficit unless you're specifically geared for it — and every hit lands harder across the board. Several encounters also add Champions (Barrier, Overload, or Unstoppable) that don't appear on Normal; check the callout under an affected encounter below for which ones and where.
<h2>Encounters</h2>
<div id="encounters-body"><div id="encounter-payload">1
<h3>Payload</h3>
<strong>Objective</strong> Escort a moving payload across the map by collecting pickups that spawn from defeated enemies and bringing them back to keep the payload rolling forward.
<strong>Roles</strong> No fixed roles, split up to clear enemies and keep the payload fed.
<ol><li>Defeat the large enemies along the route, which spawn collectible pickups in the area around them.</li><li>Gather the pickups (you can only carry three at once) and bring them back to the payload to push it forward.</li><li>Standing near the payload actively reduces your stacking darkness debuff, while keeping the area's enemies cleared stops it from climbing further.</li><li>Keep clearing enemies and feeding the payload until it reaches the end of the path.</li></ol>
<strong>What wipes you</strong> The darkness debuff kills you outright if it maxes out, so don't wander too far from the payload for too long.</div><div id="encounter-acquisition">2
<h3>Acquisition</h3>
<strong>Objective</strong> Identify a hidden three-symbol code for each of three obelisks by clearing rooms and reading callouts, then shoot the right symbols before the room's own meter forces a wipe.
<strong>Roles</strong> Split into pairs, one pair per obelisk, but treat the three obelisks as one shared puzzle — the code your team pieces together might end up matching a different obelisk than the one that revealed it. Once an obelisk has taken its code, it's done for the rest of the encounter unless the team wipes, so by the third round you already know which one is left.
<ol><li>Shoot the central crystal to start the encounter and get the doors moving.</li><li>Watch the reference pillars: one lights up to show which side of the room an enemy is spawning on, and defeating it reveals which room to enter.</li><li>Clear the enemies inside that room, which reveals a matching pair of symbols; a callout on the pillar tells you which of the two to remember.</li><li>Repeat this two more times until a full three-symbol code is known.</li><li>Check the obelisks that haven't been cleared yet — only one of them will actually display that exact combination, even if it isn't the one that revealed it — and shoot its three symbols in quick succession.</li><li>Repeat the entire process two more times, once for each remaining obelisk — by the third round only one is left, so you just need the code.</li></ol>
<strong>What wipes you</strong> The obelisk fills a hidden meter as the fight goes on, faster if you shoot wrong symbols or let enemies attack it. If it fills completely, the team wipes, so speed and accuracy both matter.
<strong>On Master</strong> On Master, the room Glyphkeepers become Overload Champions, and the Abominations that spawn during offerings become Unstoppable Champions.</div><div id="encounter-the-caretaker">3
<h3>The Caretaker</h3>
<strong>Objective</strong> Stun a boss to keep him from reaching a central obelisk, collect symbols from a dark side room to unlock a damage phase, then repeat across three floors.
<strong>Roles</strong> Two players keep the boss's attention and stun him, two clear enemies and support, two rotate through a dark room collecting symbols.
<ol><li>Have two players bait the boss — one gets close to trigger his slam attack, then shoots his face the moment it's exposed to stagger him, while the other shoots his back to drop him to the ground and halt his advance toward the obelisk.</li><li>Send the other two players in and out of a dark room one at a time, each grabbing three symbols before shooting them onto the central obelisk.</li><li>Watch a stacking darkness debuff while inside the dark room. It clears once you're back outside.</li><li>Once all nine symbols are collected and delivered, a damage phase begins on three rotating floor plates.</li><li>Stand on each plate as it activates, damage the boss, and rotate to the next plate when it deactivates.</li><li>Repeat this whole loop on each of the raid's three floors, then finish with a final stand in a hallway with its own set of plates.</li></ol>
<strong>What wipes you</strong> Letting the boss reach the obelisk while unstunned wipes the team, and running out of plates during the final stand without finishing him off does the same. This fight is a straight damage race as much as a mechanics one.
<strong>On Master</strong> On Master, the Vandals in the outer arena become Overload Champions.</div><div id="encounter-the-upended">4
<h3>The Upended</h3>
<strong>Objective</strong> Carry one or more artifacts through several rooms, find matching symbols in each, and deposit the artifacts before a shared timer runs out.
<strong>Roles</strong> Split into two groups of three to clear each room; different artifacts unlock different actions, so track who's holding what.
<ol><li>Clear each room's enemies, noting the symbols that appear. Some symbols are only visible while holding an artifact.</li><li>Work out which symbols match and shoot them on the door at the room's exit to unlock the next area.</li><li>Carry the artifact(s) with you as you go, since depositing one at the end of a room adds time to the shared clock.</li><li>Defeat the enemy that spawns partway through each room for another chunk of extra time.</li><li>Continue through each room, passing artifacts to new carriers as needed, until you reach the end.</li></ol>
<strong>What wipes you</strong> The shared timer wipes the whole team if it hits zero. Killing the time-adding enemy and depositing artifacts promptly are the only ways to keep pace with it.
<strong>On Master</strong> On Master, the Taken Glyphkeepers become Unstoppable Champions and the Scorn Glyphkeepers become Overload Champions.</div><div id="encounter-rhulk-disciple-of-the-witness">5
<h3>Rhulk, Disciple of the Witness</h3>
<strong>Objective</strong> Split a shared buff between players and feed it through one of the boss's attacks to build a deliverable version, bank it at the right pillar to push back his barrier, then repeat a weak-point sequence each round before damaging him and finishing with his final stand.
<strong>Roles</strong> Two players dedicate themselves to splitting and re-splitting Leeching Force; two more convert it into Emanating Force and carry it to a called-out pillar; the last two clear adds and call out matching symbols.
<ol><li>Destroy the dark crystal above Rhulk's head to grant whoever shot it Leeching Force and stop a team-wide darkness debuff from stacking. If nobody's holding Leeching Force when the window runs out, he summons another crystal — let that happen three times without reaching a damage phase and the team wipes outright.</li><li>Whoever has Leeching Force stands on a specific floor marker, which spawns two crystals nearby — have teammates shoot those to split Leeching Force from the floor-stander onto the two crystal-shooters.</li><li>Have only one of those two holders deliberately take one of Rhulk's laser beams to convert their Leeching Force into Emanating Force — doing this with both at once loses the buff entirely instead of splitting it.</li><li>A smoother version of this loop: instead of converting both new holders right away, send one of them straight back to the floor marker to start the next split while the other converts into Emanating Force and carries it to the pillar. Keeping a holder already mid-split this way means the team isn't stuck waiting on a brand new symbol callout before every single pillar — it just takes tighter coordination so Leeching Force never gets dropped entirely.</li><li>Meanwhile, clear adds and kill the Glyphkeepers that spawn to reveal two sets of symbols, one visible only to players holding Leeching Force and one only to those without it — find the match and call out which of six pillars it points to.</li><li>Deposit the Emanating Force at that pillar to push the barrier back, then repeat the whole split-convert-deposit cycle (six pillars total) until the barrier fully recedes and the stairs open.</li><li>Inside, shoot Rhulk's glaive after he stabs it into the ground to gain Leeching Force again and reveal a symbol pointing to one of four corner pillars — convert it into Emanating Force in his laser beam as before and deposit it there to expose a weak point.</li><li>Destroy that weak point, then repeat the glaive-convert-deposit sequence three more times until all four weak points are down and he's finally vulnerable.</li><li>Damage him until he resets and goes immune, then retreat and repeat the whole weak-point sequence to force another damage window. Expect to do this a few times.</li><li>In his final stand, save your strongest abilities — he moves constantly and a darkness debuff stacks on the whole team until he's dead.</li></ol>
<strong>What wipes you</strong> Letting Rhulk summon a third unclaimed crystal is an instant wipe on its own, separate from the final stand's darkness debuff maxing out. Converting both holders into Emanating Force at the same time loses your progress entirely instead of splitting it, so always keep one Leeching Force holder in reserve.
<strong>On Master</strong> On Master, the Taken Glyphkeeper becomes an Overload Champion and the Scorn Glyphkeeper becomes an Unstoppable Champion.</div></div>

  <div>Unofficial fan project. Not affiliated with or endorsed by Bungie.</div>
</footer>

<script src="assets/game-terms.js"></script>
<script src="assets/art-tints.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/raids-data.js"></script>
<script src="assets/sets-data.js"></script>
<script>
(function(){
  // Generated per-raid pages (raid-<slug>.html, tools/build-guide-pages.js)
  // set GUIDE_SLUG. On this template page, an old ?slug= link forwards to
  // the raid's own page, whose static tags give proper link previews.
  const slug = window.GUIDE_SLUG || new URLSearchParams(window.location.search).get("slug");
  const raid = window.RaidsData.RAIDS.find(r => r.slug === slug);
  if (raid && !window.GUIDE_SLUG){
    location.replace(window.rallyFlagGuideHref("raid", raid.slug) + location.hash);
    return;
  }
  const content = document.getElementById("content");

  if (!raid){
    document.getElementById("raid-title").textContent = "Raid not found";
    content.innerHTML = '<div class="not-found panel-card block">Head back to <a href="raids.html">the raid list</a> and pick one from there.</div>';
    return;
  }

  document.title = raid.name + " Raid Guide - Rally Flag";
  document.getElementById("raid-title").textContent = raid.name;
  // Header sits over the raid's official art.
  if (raid.art){
    const hero = document.getElementById("hero");
    hero.classList.add("has-art");
    const tint = window.rallyFlagArtTint(raid.art); // its colour shows until the art loads
    hero.insertAdjacentHTML("afterbegin", '<div class="hero-art"' + (tint ? ' style="background-color:' + tint + '"' : "") + '><img src="' + window.rallyFlagArtUrl(raid.art) + '" alt="" fetchpriority="high"></div>');
  }
  document.getElementById("raid-difficulty").textContent = raid.difficulties ? raid.difficulties.join(" · ") : "";

  function slugify(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function encounterAnchorId(e, i){
    return "encounter-" + (e.name ? slugify(e.name) : (i + 1));
  }

  let activeDifficulty = "Normal";
  function currentEncounters(){
    return (activeDifficulty === "Epic" && raid.epicEncounters) ? raid.epicEncounters : raid.encounters;
  }

  const encounterSubnavEl = document.getElementById("encounter-subnav");
  function renderSubnav(){
    const encounters = currentEncounters();
    if (encounters.length){
      encounterSubnavEl.style.display = "";
      encounterSubnavEl.innerHTML = encounters.map((e, i) =>
        '<a href="#' + encounterAnchorId(e, i) + '">' + e.name + '</a>'
      ).join("");
    } else {
      encounterSubnavEl.style.display = "none";
    }
  }
  renderSubnav();
  encounterSubnavEl.addEventListener("click", (ev) => {
    const link = ev.target.closest("a");
    if (!link) return;
    const target = document.querySelector(link.getAttribute("href"));
    if (!target) return;
    ev.preventDefault();
    target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    history.replaceState(null, "", link.getAttribute("href"));
  });

  const setsBySlug = {};
  window.ArmorSetsData.SETS.forEach(s => setsBySlug[s.slug] = s);

  const setLinksHtml = raid.armorSlugs.map(slug => {
    const set = setsBySlug[slug];
    const label = set ? set.name : slug;
    return '<a class="set-link" href="armor-set-bonuses.html?highlight=' + slug + '">' + label + ' \u2192</a>';
  }).join("");

  function buildEncountersHtml(encounters){
    return encounters.length
    ? encounters.map((e, i) => {
        if (e.objective || e.steps){
          const hl = window.GameTerms.highlight;
          const stepsHtml = (e.steps || []).map(s => '<li>' + hl(s) + '</li>').join("");
          const mapHtml = e.mapImage
            ? '<div class="encounter-map"><img src="' + e.mapImage.url + '" alt="' + e.name + ' encounter map" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.mapImage.credit +
              (e.mapImage.creditUrl ? ' · <a href="' + e.mapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const secondaryMapHtml = e.secondaryMapImage
            ? '<div class="encounter-map"><img src="' + e.secondaryMapImage.url + '" alt="' + e.name + ' encounter map variant" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.secondaryMapImage.credit +
              (e.secondaryMapImage.creditUrl ? ' · <a href="' + e.secondaryMapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const strategyHtml = e.strategyImage
            ? '<div class="encounter-map"><img src="' + e.strategyImage.url + '" alt="' + e.name + ' strategy diagram" loading="lazy">' +
              (e.strategyImage.label ? '<div class="encounter-map-label">' + e.strategyImage.label + '</div>' : '') +
              '</div>'
            : '';
          const advancedHtml = (e.advancedTactics && e.advancedTactics.length)
            ? '<div class="encounter-advanced">' +
                '<button class="encounter-advanced-toggle" type="button"><span class="caret">\u25b8</span> Advanced tactic (optional)</button>' +
                '<div class="encounter-advanced-body">' +
                  e.advancedTactics.map(t => '<p>' + hl(t) + '</p>').join("") +
                '</div>' +
              '</div>'
            : '';
          const encounterPuzzleHelperHtml = e.puzzleHelper
            ? '<a class="block panel-card puzzle-helper-link encounter-puzzle-helper-link" href="puzzle-helper.html?tool=' + e.puzzleHelper.slug + '">' +
                '<div>' +
                  '<div class="puzzle-helper-link-title">' + e.puzzleHelper.title + '</div>' +
                  '<div class="puzzle-helper-link-sub">' + e.puzzleHelper.blurb + '</div>' +
                '</div>' +
                '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
              '</a>'
            : '';
          return '<div class="block panel-card encounter-card" id="' + encounterAnchorId(e, i) + '">' +
            '<div class="encounter-head"><div class="encounter-num">' + (i + 1) + '</div><h3 class="encounter-title">' + e.name + '</h3></div>' +
            (e.objective ? '<div class="encounter-field"><span class="encounter-field-label">Objective</span>' + hl(e.objective) + '</div>' : '') +
            (e.roles ? '<div class="encounter-field"><span class="encounter-field-label">Roles</span>' + hl(e.roles) + '</div>' : '') +
            mapHtml +
            secondaryMapHtml +
            strategyHtml +
            (stepsHtml ? '<ol class="encounter-steps">' + stepsHtml + '</ol>' : '') +
            (e.wipe ? '<div class="encounter-wipe"><span class="encounter-wipe-label">What wipes you</span>' + hl(e.wipe) + '</div>' : '') +
            (e.master ? '<div class="encounter-master"><span class="encounter-master-label">On Master</span>' + hl(e.master) + '</div>' : '') +
            advancedHtml +
            encounterPuzzleHelperHtml +
          '</div>';
        }
        // Fallback for older, simpler encounter entries
        return '<div class="block panel-card encounter-card encounter-row" id="' + encounterAnchorId(e, i) + '"><div class="encounter-num">' + (i + 1) + '</div>' +
          '<div><div class="encounter-name">' + e.name + '</div><div class="encounter-notes">' + (e.notes || "") + '</div></div></div>';
      }).join("")
    : '<div class="block panel-card"><div class="block-empty">Encounter notes coming soon.</div></div>';
  }

  const difficultyToggleHtml = raid.epicEncounters
    ? '<div class="difficulty-toggle" id="difficulty-toggle">' +
        '<button type="button" class="difficulty-toggle-btn active" data-difficulty="Normal">Normal</button>' +
        '<button type="button" class="difficulty-toggle-btn" data-difficulty="Epic">Epic</button>' +
      '</div>'
    : '';

  const puzzleHelperHtml = raid.puzzleHelper
    ? '<a class="block panel-card puzzle-helper-link" href="puzzle-helper.html?tool=' + raid.puzzleHelper.slug + '">' +
        '<div>' +
          '<div class="puzzle-helper-link-title">' + raid.puzzleHelper.title + '</div>' +
          '<div class="puzzle-helper-link-sub">' + raid.puzzleHelper.blurb + '</div>' +
        '</div>' +
        '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
      '</a>'
    : '';

  const raidMasterNoteHtml = (raid.difficulties && raid.difficulties.includes("Master"))
    ? '<div class="raid-master-note"><span class="raid-master-note-label">Master Difficulty</span>' +
        "Master raises enemies well above the raid's Normal Power level — expect a Power deficit unless you're specifically geared for it — and every hit lands harder across the board. Several encounters also add Champions (Barrier, Overload, or Unstoppable) that don't appear on Normal; check the callout under an affected encounter below for which ones and where." +
      '</div>'
    : '';

  content.innerHTML =
    '<div class="block panel-card">' +
      '<div class="block-label">Overview</div>' +
      (raid.summary ? '<p>' + raid.summary + '</p>' : '<div class="block-empty">Overview coming soon.</div>') +
      raidMasterNoteHtml +
    '</div>' +
    '<div class="block-label-row encounters-head"><h2 class="block-label">Encounters</h2>' + difficultyToggleHtml + '</div>' +
    '<div id="encounters-body">' + buildEncountersHtml(currentEncounters()) + '</div>' +
    puzzleHelperHtml +
    '<div class="block panel-card">' +
      '<div class="block-label">Armor Sets From This Raid</div>' +
      '<div class="set-links">' + setLinksHtml + '</div>' +
    '</div>';

  content.addEventListener("click", (ev) => {
    const advToggle = ev.target.closest(".encounter-advanced-toggle");
    if (advToggle){
      advToggle.closest(".encounter-advanced").classList.toggle("open");
      return;
    }
    const diffBtn = ev.target.closest(".difficulty-toggle-btn");
    if (diffBtn){
      const newDifficulty = diffBtn.dataset.difficulty;
      if (newDifficulty === activeDifficulty) return;
      activeDifficulty = newDifficulty;
      content.querySelectorAll(".difficulty-toggle-btn").forEach(b => b.classList.toggle("active", b.dataset.difficulty === activeDifficulty));
      document.getElementById("encounters-body").innerHTML = buildEncountersHtml(currentEncounters());
      renderSubnav();
    }
  });
})();
</script>
<script src="assets/your-clears.js"></script>
</body>
</html>
