<h1 id="raid-title">Pantheon</h1>
<a href="guides.html">Overview</a> <a href="raids.html">Raids</a> <a href="dungeons.html">Dungeons</a> <a href="public-events.html">Public Events</a>
<div id="encounter-subnav"><a href="#encounter-argos-planetary-core-calus-resplendent">Argos, Planetary Core (Calus Resplendent)</a> <a href="#encounter-gahlran-the-sorrow-bearer-calus-resplendent">Gahlran, the Sorrow-Bearer (Calus Resplendent)</a> <a href="#encounter-emperor-calus-calus-resplendent">Emperor Calus (Calus Resplendent)</a> <a href="#encounter-warpriest-morgeth-surpassing">Warpriest (Morgeth Surpassing)</a> <a href="#encounter-consecrated-mind-sol-inherent-morgeth-surpassing">Consecrated Mind, Sol Inherent (Morgeth Surpassing)</a> <a href="#encounter-morgeth-the-spirekeeper-morgeth-surpassing">Morgeth, the Spirekeeper (Morgeth Surpassing)</a> <a href="#encounter-insurrection-prime-the-gauntlet-only">Insurrection Prime (The Gauntlet only)</a></div></div> <section id="content">Overview
<p>Pantheon isn't a traditional raid — it's three ways to fight vaulted raid bosses without running the full raids. Calus Resplendent runs the three Leviathan-era bosses (Argos, Gahlran, Emperor Calus) close to their originals. Morgeth Surpassing takes three bosses from three different raids — Warpriest (King's Fall), Consecrated Mind (Garden of Salvation), Morgeth (Last Wish) — each merged with the non-boss encounter that originally preceded it. The Gauntlet strings all six together and adds a seventh: Insurrection Prime, the returning final boss of the vaulted Scourge of the Past raid.</p>
<h2>Encounters</h2>
<div id="encounters-body"><div id="encounter-argos-planetary-core-calus-resplendent">1
<h3>Argos, Planetary Core (Calus Resplendent)</h3>
<strong>Objective</strong> Charge Vex Craniums to match the shield's current combination, shoot down the matching Quantum Mines together to drop the shield and open a damage window, then deal with a guaranteed wipe bomb by destroying weak points on the boss's body.
<strong>Roles</strong> Three pairs, one per elemental station, each with a runner carrying charged Vex Craniums and a defender holding the platform.
<ol><li>Split into three pairs and take a station each: one per element.</li><li>Keep charging Vex Craniums back-to-back at your station without waiting for them to be needed — you'll often need two of the same element before the encounter's over.</li><li>Watch which side of the shield is active and which combination of elements its floating Quantum Mines are asking for.</li><li>Once three players are holding the matching elements, shoot those Quantum Mines down together on a synced countdown — destroying all three at once grants a bonus to the damage phase that follows.</li><li>During the damage window, watch for a grabbing net attack that snatches a player away and kills them on a short timer if they're not freed, and shoot down the homing missiles the boss throws before they reach the group.</li><li>At some point regardless of what you do, the boss disengages completely and starts charging a guaranteed wipe attack. One pair of matching weak points (head, arms, or back) lights up — split into two groups of three and each group destroys its side's point before the timer runs out, then go back to charging orbs.</li></ol>
<strong>What wipes you</strong> Bringing the wrong combination of charged Vex Craniums wastes that attempt entirely, and you only get a handful of tries before the encounter fails outright, so confirm the shield's combination out loud before committing resources to it. Letting the wipe-bomb timer run out without destroying that cycle's weak points kills the whole team outright.</div><div id="encounter-gahlran-the-sorrow-bearer-calus-resplendent">2
<h3>Gahlran, the Sorrow-Bearer (Calus Resplendent)</h3>
<strong>Objective</strong> Manage the shared, timed Witch's Blessing across three sections of the arena to survive, clear shielded crystals and a Gahlran's Deception decoy in each section, then expose and burn down the real boss across several damage phases.
<strong>Roles</strong> Three pairs, one Blessed and one unblessed player each, managing their own section and its copy of the boss.
<ol><li>Split into three pairs and take a section of the arena each, one player starting Blessed and one unblessed.</li><li>Enemies in your section can only be damaged by whichever partner currently holds Witch's Blessing, so split kills accordingly.</li><li>Before Witch's Blessing's timer runs out, both partners shoot the same point together to safely pass it between them and reset the clock.</li><li>When a shielded crystal spawns in your section, have the Blessed and unblessed player shoot it together immediately — these are a top wipe risk if ignored, so drop what you're doing.</li><li>Once your section's Gahlran's Deception appears, lure it onto the platform in front of your boss copy, then have the Blessed and unblessed player melee it together to break its shield and stun it.</li><li>Wait for your boss copy to finish its fireball attack and its hand to glow, then shoot the hand — its cleaver slam will finish off the stunned Deception if it's positioned on the platform.</li><li>Once every section's Deception is dead, all three copies start channeling. Shoot your copy's hands, then its head, to force it out — two of the three will disappear as fakes, leaving the real boss.</li><li>Group up on the real boss to deal damage, staying off the ground near him (he can one-shot in melee range) and breaking his hands whenever he goes immune to keep the window open.</li><li>The boss disengages after each damage phase and the fight resets to the enemy-wave stage — return to your sections, resync Witch's Blessing, and repeat. Expect to go through several damage phases before he's dead.</li></ol>
<strong>What wipes you</strong> Letting Witch's Blessing's timer hit zero kills whoever's holding it, and ignoring a shielded crystal is one of the fastest ways to wipe the whole team, so it always comes before everything else. This fight punishes anyone who lets the Blessing-swap habit slip, even for a few seconds.</div><div id="encounter-emperor-calus-calus-resplendent">3
<h3>Emperor Calus (Calus Resplendent)</h3>
<strong>Objective</strong> Split into a Throne Room team and a Shadow Realm team to solve symbol callouts and farm a damage buff by surviving waves and shooting down skulls, then reunite for rotating damage phases across platforms.
<strong>Roles</strong> Three players hold the Throne Room and kill a called-out target; three players survive the Shadow Realm, clear its waves, and farm Force of Will.
<ol><li>Shoot the cup out of Calus's hand to start the fight and clear the first wave of enemies.</li><li>When Calus claps, everyone is pulled into the Shadow Realm — three players immediately cross back out to the Throne Room, three stay behind.</li><li>Each Shadow Realm player watches for the symbols appearing on Calus's forehead and calls them out as they see them.</li><li>The Throne Room team finds the one symbol plate that wasn't called out and kills the enemy standing on it. This is what advances the fight.</li><li>Meanwhile the Shadow Realm team survives several waves of shielded enemies that throw knockback grenades — spread out and call targets by side so nobody gets caught in a blind spot.</li><li>After those waves, Calus starts spitting skulls. Group up and shoot them down with wide-area damage — each one destroyed stacks the team's Force of Will higher.</li><li>Once Force of Will is stacked high enough, the Throne Room team breaks Calus's shield to pull the Shadow Realm team back in, and everyone spreads onto the marked platforms to deal damage.</li><li>Each platform depletes as you damage him — move to the next one once it's used up, and step off briefly if he attacks directly, then get back on as soon as you can.</li><li>If he isn't dead by the time the platforms run out, send players back to the Shadow Realm to farm Force of Will again and repeat the whole cycle.</li></ol>
<strong>What wipes you</strong> Killing the wrong enemy in the Throne Room during a symbol round wipes the team, so always double check which plate wasn't called before committing to a kill. Letting the Shadow Realm's knockback grenades catch you off guard can throw you off the arena entirely.</div><div id="encounter-warpriest-morgeth-surpassing">4
<h3>Warpriest (Morgeth Surpassing)</h3>
<strong>Objective</strong> Run the totem puzzle that used to be its own encounter directly into the Warpriest fight: rotate a totem buff and a claim buff between three players per team to keep building and depositing a resource, then start and extend a damage phase before taking cover from a room-wide wipe attack.
<strong>Roles</strong> Two teams of three, one per totem room, continuously rotating through holding the Brand of the Unraveler or Weaver, earning the Brand Claimer buff, and depositing Deathsinger's Power.
<ol><li>Split into two groups of three and head to a totem room on each side.</li><li>One player grabs the Brand of the Unraveler or Weaver (whichever matches their room) and stands under the totem, killing enemies there to build Deathsinger's Power — leaving the totem for too long kills the team, and the Brand itself has its own timer that kills its holder if it runs out.</li><li>A teammate kills the room's marked enemy, then the stronger enemy it spawns, to earn the Brand Claimer buff — bring it to the totem holder and steal their Brand off them so they're free to leave.</li><li>The freed player carries their Deathsinger's Power to the Warpriest room and deposits it on one of the three plates, staying until it fully drains.</li><li>After depositing, that player repeats the same marked-enemy kill in the Warpriest room to earn another Brand Claimer buff, then heads back to their totem room to steal the Brand there and keep the cycle going.</li><li>Once the team's deposited enough, one of the plates turns active — wait until everyone's ready before anyone steps on it, since it starts the damage phase immediately and an early start weakens it.</li><li>During the damage phase, everyone stacks on whoever's holding the Brand of the Initiate and focuses Warpriest. That Brand also has a timer, so have spare players earn Brand Claimer buffs and steal it back and forth to keep the window open longer.</li><li>When the room starts turning white, stop shooting and get behind one of the three pillars — each one only blocks the wipe attack once before it's gone for good, so don't waste one early.</li><li>Repeat the whole totem-to-plate cycle, including rebuilding toward another damage phase, until he's dead.</li></ol>
<strong>What wipes you</strong> Leaving the totem unattended or letting either Brand's timer hit zero kills whoever's exposed, and once all three pillars are used up, the room-wide attack has nothing left to hide behind — so pace yourself through those pillars across the whole fight, not just the first phase.</div><div id="encounter-consecrated-mind-sol-inherent-morgeth-surpassing">5
<h3>Consecrated Mind, Sol Inherent (Morgeth Surpassing)</h3>
<strong>Objective</strong> Defend five relay points from being sacrificed to while a runner banks a resource from marked enemies into the center, react to the boss's periodic weak-point callouts, then group up to cleanse and burn it down once the center relay overloads.
<strong>Roles</strong> Five players each hold a relay; a sixth runs the arena collecting the resource and feeding the center relay.
<ol><li>At each relay, kill the enemy guarding its tether point to unlock it, then connect the tether back to the relay — everyone in that tether line gets Enlightenment, needed to damage the shielded enemies trying to sacrifice themselves there.</li><li>When the cue to refresh appears, every relay defender reconnects to their own tether point at the same time, while the player at the center relay and the runner do a two-player tether together — done together, this refreshes everyone's Enlightenment at once instead of one at a time.</li><li>Call out the marked enemy whenever one spawns near your relay so the runner can swing by, clear it, and collect what it drops.</li><li>The runner carries what's collected to the center relay and deposits it there, repeating until it's fully charged.</li><li>Through all of this, the boss periodically spits a puddle somewhere in the arena — have a player step into it, then shoot the three weak points it exposes that match the callout (inner or outer). That player can't repeat the puddle again for a couple of minutes, so rotate who takes it.</li><li>Once the center relay is overloaded, the boss is drawn to it — group up in the center and shoot down every weak point it exposes to cleanse it.</li><li>With it cleansed, the boss backs off from the center for the real damage window — focus precision damage on it from range.</li><li>If it's not dead by the end of that window, go back to defending relays and collecting the resource to force another one.</li></ol>
<strong>What wipes you</strong> Letting enough of the shielded enemies finish sacrificing at an undefended relay wipes the team outright, so a relay going undefended is never just a tempo loss. Missing a weak-point callout, especially during the group cleanse, is one of the easiest ways to stall the whole encounter.</div><div id="encounter-morgeth-the-spirekeeper-morgeth-surpassing">6
<h3>Morgeth, the Spirekeeper (Morgeth Surpassing)</h3>
<strong>Objective</strong> Collect Taken Strength without overloading, free trapped teammates — which transfers their stacks onto you — so pairs can push into a side realm guided by callouts from the team outside, then finish the cycle and survive a jumping-puzzle gauntlet before the final damage phase.
<strong>Roles</strong> Two teams of three collecting and clearing adds on each side; whoever frees a trapped teammate carries zero stacks beforehand and goes with them into the side realm, while everyone still outside reads the symbols behind the boss and calls out which ones to avoid.
<ol><li>Collect Taken Strength around the arena. Each player can safely hold two stacks, and a third stack kills you and drops everything you're carrying — pick up fresh Taken Strength promptly, since the boss has his own meter that keeps rising for the whole fight regardless of phase.</li><li>When a player holding two stacks gets trapped by the boss, a teammate with zero stacks of their own needs to kill Eye of Riven and use what it drops to free them — freeing someone transfers their stacks onto you, so going in already holding any is how you accidentally kill yourself.</li><li>Freeing a trapped player pulls both of you into a side realm cut off from the rest of the team. Inside, only the player who did the freeing can see which orbs are safe — they'll need to talk their blind partner onto the right ones.</li><li>The team still outside watches the wall behind the boss for the symbols that appear and calls them out, since those are the ones to avoid grabbing inside.</li><li>Repeat the whole trap-and-free cycle, rotating through pairs, until every player on the team has gone through the side realm.</li><li>Once the last pair is inside, a final stack spawns near the boss — whoever doesn't already have two stacks grabs it to pull him in and start the damage phase right there.</li><li>Focus his exposed weak point while his meter climbs. Partway through, kill the enemy that spawns, grab what it drops, and use it on him before the meter gets dangerously high — this safely ends the phase and sends everyone back to the main arena instead of risking the wipe.</li><li>If he isn't dead yet, go back to collecting Taken Strength and running the trap-and-free cycle to force another damage phase.</li><li>Once his health drops low enough, the floor opens into a short jumping-puzzle gauntlet — survive it to reach the final arena.</li><li>In the final arena, spread out and collect every stack of Taken Strength scattered around him (the two-stack rule still applies) before he's vulnerable, then finish him off before his meter runs out.</li></ol>
<strong>What wipes you</strong> Picking up a third stack of Taken Strength kills you outright, freeing a trapped teammate while already holding stacks of your own can do the same, missing an avoid-callout can wipe whoever's inside the side realm, and letting the boss's meter hit its cap at any point in the fight — not just the final stand — wipes the whole team.</div><div id="encounter-insurrection-prime-the-gauntlet-only">7
<h3>Insurrection Prime (The Gauntlet only)</h3>
<strong>Objective</strong> Kill an immune, shielded Berserker to spawn the boss and the tactical map, split into an underground team and a surface team to gather the three Phase Radiance buffs for every player, hunt down more Berserkers to power up a tank and strip the boss's armor, then stun it with the tank and burn down the small target exposed in its chest.
<strong>Roles</strong> One player reads the map and calls out targets; the rest split between shield-panel snipers, battery runners, and (early on) the underground Phase Radiance team.
<ol><li>Find the Berserker guarding the start of the fight, get inside its slowing dome, and destroy its two weak points (one on each side) before finishing it off — it drops a battery.</li><li>Carry that battery to the deposit point at the rally flag. Dropping it in spawns the boss and activates the tactical map — holding a battery puts a timer on you, and dropping one locks you out of carrying another for a bit, so don't let the same person try to carry two in a row.</li><li>Split into two teams of three. One heads underground (after clearing whatever's guarding and blocking its entrance) to melee the three safe Phase Radiance terminals there — Angular, Parallel, and Continuous, one per player — and never touch the odd flashing one, which wipes the team instantly.</li><li>Once that team has all three Phase Radiance buffs, swap — they head back to the surface and the other team goes underground to grab their own three, so the fireteam ends up with two players on each of the three.</li><li>Everyone with a Phase Radiance buff carries a damaging field that hurts anyone nearby with a different one, so keep same-buff pairs together and different-buff pairs apart from here on.</li><li>While that's happening, hunt down more Berserkers the same way as the opener, and carry what they drop to the deposit points the map calls out — wrong deposits waste the carry, so have the map reader direct everyone to the right spot.</li><li>Enough correctly-deposited batteries spawns a vehicle that can stun the boss. Meanwhile, snipers destroy the six armor plates on the boss's body (two each on its knees, arms, and back) with precision weapons, and shoot the glowing canister that appears whenever it goes airborne to cancel its missile barrage.</li><li>Once every buff is assigned, the deposits are done, the vehicle has spawned, and every armor plate is down, have the vehicle fire on the boss to stun it and force its chest open.</li><li>Group into your three same-buff pairs, spread those pairs apart from each other, and focus the small target exposed in its chest — not the mech itself.</li><li>The boss can pulse mid-phase and reassign some players to a different buff. Check your buff after every pulse and immediately relocate to the matching pair if it's changed, even if you think you didn't move.</li><li>If it's not dead after one stun, go back to gathering buffs, batteries, and armor-plate damage to force another damage phase.</li></ol>
<strong>What wipes you</strong> Touching the odd flashing Phase Radiance terminal wipes the team instantly, and standing next to a teammate with a mismatched buff kills you both — during the damage phase especially, check your buff and your position after every pulse instead of assuming you're still in the right spot.</div></div>

<script src="assets/game-terms.js"></script>
<script src="assets/art-tints.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/raids-data.js"></script>
<script src="assets/sets-data.js"></script>
<script>
(function(){
  // Generated per-raid pages (raid-<slug>.html, tools/build-guide-pages.js)
  // set GUIDE_SLUG. On this template page, an old ?slug= link forwards to
  // the raid's own page, whose static tags give proper link previews.
  const slug = window.GUIDE_SLUG || new URLSearchParams(window.location.search).get("slug");
  const raid = window.RaidsData.RAIDS.find(r => r.slug === slug);
  if (raid && !window.GUIDE_SLUG){
    location.replace(window.rallyFlagGuideHref("raid", raid.slug) + location.hash);
    return;
  }
  const content = document.getElementById("content");

  if (!raid){
    document.getElementById("raid-title").textContent = "Raid not found";
    content.innerHTML = '<div class="not-found panel-card block">Head back to <a href="raids.html">the raid list</a> and pick one from there.</div>';
    return;
  }

  document.title = raid.name + " Raid Guide - Rally Flag";
  document.getElementById("raid-title").textContent = raid.name;
  // Header sits over the raid's official art.
  if (raid.art){
    const hero = document.getElementById("hero");
    hero.classList.add("has-art");
    const tint = window.rallyFlagArtTint(raid.art); // its colour shows until the art loads
    hero.insertAdjacentHTML("afterbegin", '<div class="hero-art"' + (tint ? ' style="background-color:' + tint + '"' : "") + '><img src="' + window.rallyFlagArtUrl(raid.art) + '" alt="" fetchpriority="high"></div>');
  }
  document.getElementById("raid-difficulty").textContent = raid.difficulties ? raid.difficulties.join(" · ") : "";

  function slugify(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function encounterAnchorId(e, i){
    return "encounter-" + (e.name ? slugify(e.name) : (i + 1));
  }

  let activeDifficulty = "Normal";
  function currentEncounters(){
    return (activeDifficulty === "Epic" && raid.epicEncounters) ? raid.epicEncounters : raid.encounters;
  }

  const encounterSubnavEl = document.getElementById("encounter-subnav");
  function renderSubnav(){
    const encounters = currentEncounters();
    if (encounters.length){
      encounterSubnavEl.style.display = "";
      encounterSubnavEl.innerHTML = encounters.map((e, i) =>
        '<a href="#' + encounterAnchorId(e, i) + '">' + e.name + '</a>'
      ).join("");
    } else {
      encounterSubnavEl.style.display = "none";
    }
  }
  renderSubnav();
  encounterSubnavEl.addEventListener("click", (ev) => {
    const link = ev.target.closest("a");
    if (!link) return;
    const target = document.querySelector(link.getAttribute("href"));
    if (!target) return;
    ev.preventDefault();
    target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    history.replaceState(null, "", link.getAttribute("href"));
  });

  const setsBySlug = {};
  window.ArmorSetsData.SETS.forEach(s => setsBySlug[s.slug] = s);

  const setLinksHtml = raid.armorSlugs.map(slug => {
    const set = setsBySlug[slug];
    const label = set ? set.name : slug;
    return '<a class="set-link" href="armor-set-bonuses.html?highlight=' + slug + '">' + label + ' \u2192</a>';
  }).join("");

  function buildEncountersHtml(encounters){
    return encounters.length
    ? encounters.map((e, i) => {
        if (e.objective || e.steps){
          const hl = window.GameTerms.highlight;
          const stepsHtml = (e.steps || []).map(s => '<li>' + hl(s) + '</li>').join("");
          const mapHtml = e.mapImage
            ? '<div class="encounter-map"><img src="' + e.mapImage.url + '" alt="' + e.name + ' encounter map" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.mapImage.credit +
              (e.mapImage.creditUrl ? ' · <a href="' + e.mapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const secondaryMapHtml = e.secondaryMapImage
            ? '<div class="encounter-map"><img src="' + e.secondaryMapImage.url + '" alt="' + e.name + ' encounter map variant" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.secondaryMapImage.credit +
              (e.secondaryMapImage.creditUrl ? ' · <a href="' + e.secondaryMapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const strategyHtml = e.strategyImage
            ? '<div class="encounter-map"><img src="' + e.strategyImage.url + '" alt="' + e.name + ' strategy diagram" loading="lazy">' +
              (e.strategyImage.label ? '<div class="encounter-map-label">' + e.strategyImage.label + '</div>' : '') +
              '</div>'
            : '';
          const advancedHtml = (e.advancedTactics && e.advancedTactics.length)
            ? '<div class="encounter-advanced">' +
                '<button class="encounter-advanced-toggle" type="button"><span class="caret">\u25b8</span> Advanced tactic (optional)</button>' +
                '<div class="encounter-advanced-body">' +
                  e.advancedTactics.map(t => '<p>' + hl(t) + '</p>').join("") +
                '</div>' +
              '</div>'
            : '';
          const encounterPuzzleHelperHtml = e.puzzleHelper
            ? '<a class="block panel-card puzzle-helper-link encounter-puzzle-helper-link" href="puzzle-helper.html?tool=' + e.puzzleHelper.slug + '">' +
                '<div>' +
                  '<div class="puzzle-helper-link-title">' + e.puzzleHelper.title + '</div>' +
                  '<div class="puzzle-helper-link-sub">' + e.puzzleHelper.blurb + '</div>' +
                '</div>' +
                '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
              '</a>'
            : '';
          return '<div class="block panel-card encounter-card" id="' + encounterAnchorId(e, i) + '">' +
            '<div class="encounter-head"><div class="encounter-num">' + (i + 1) + '</div><h3 class="encounter-title">' + e.name + '</h3></div>' +
            (e.objective ? '<div class="encounter-field"><span class="encounter-field-label">Objective</span>' + hl(e.objective) + '</div>' : '') +
            (e.roles ? '<div class="encounter-field"><span class="encounter-field-label">Roles</span>' + hl(e.roles) + '</div>' : '') +
            mapHtml +
            secondaryMapHtml +
            strategyHtml +
            (stepsHtml ? '<ol class="encounter-steps">' + stepsHtml + '</ol>' : '') +
            (e.wipe ? '<div class="encounter-wipe"><span class="encounter-wipe-label">What wipes you</span>' + hl(e.wipe) + '</div>' : '') +
            (e.master ? '<div class="encounter-master"><span class="encounter-master-label">On Master</span>' + hl(e.master) + '</div>' : '') +
            advancedHtml +
            encounterPuzzleHelperHtml +
          '</div>';
        }
        // Fallback for older, simpler encounter entries
        return '<div class="block panel-card encounter-card encounter-row" id="' + encounterAnchorId(e, i) + '"><div class="encounter-num">' + (i + 1) + '</div>' +
          '<div><div class="encounter-name">' + e.name + '</div><div class="encounter-notes">' + (e.notes || "") + '</div></div></div>';
      }).join("")
    : '<div class="block panel-card"><div class="block-empty">Encounter notes coming soon.</div></div>';
  }

  const difficultyToggleHtml = raid.epicEncounters
    ? '<div class="difficulty-toggle" id="difficulty-toggle">' +
        '<button type="button" class="difficulty-toggle-btn active" data-difficulty="Normal">Normal</button>' +
        '<button type="button" class="difficulty-toggle-btn" data-difficulty="Epic">Epic</button>' +
      '</div>'
    : '';

  const puzzleHelperHtml = raid.puzzleHelper
    ? '<a class="block panel-card puzzle-helper-link" href="puzzle-helper.html?tool=' + raid.puzzleHelper.slug + '">' +
        '<div>' +
          '<div class="puzzle-helper-link-title">' + raid.puzzleHelper.title + '</div>' +
          '<div class="puzzle-helper-link-sub">' + raid.puzzleHelper.blurb + '</div>' +
        '</div>' +
        '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
      '</a>'
    : '';

  const raidMasterNoteHtml = (raid.difficulties && raid.difficulties.includes("Master"))
    ? '<div class="raid-master-note"><span class="raid-master-note-label">Master Difficulty</span>' +
        "Master raises enemies well above the raid's Normal Power level — expect a Power deficit unless you're specifically geared for it — and every hit lands harder across the board. Several encounters also add Champions (Barrier, Overload, or Unstoppable) that don't appear on Normal; check the callout under an affected encounter below for which ones and where." +
      '</div>'
    : '';

  content.innerHTML =
    '<div class="block panel-card">' +
      '<div class="block-label">Overview</div>' +
      (raid.summary ? '<p>' + raid.summary + '</p>' : '<div class="block-empty">Overview coming soon.</div>') +
      raidMasterNoteHtml +
    '</div>' +
    '<div class="block-label-row encounters-head"><h2 class="block-label">Encounters</h2>' + difficultyToggleHtml + '</div>' +
    '<div id="encounters-body">' + buildEncountersHtml(currentEncounters()) + '</div>' +
    puzzleHelperHtml +
    '<div class="block panel-card">' +
      '<div class="block-label">Armor Sets From This Raid</div>' +
      '<div class="set-links">' + setLinksHtml + '</div>' +
    '</div>';

  content.addEventListener("click", (ev) => {
    const advToggle = ev.target.closest(".encounter-advanced-toggle");
    if (advToggle){
      advToggle.closest(".encounter-advanced").classList.toggle("open");
      return;
    }
    const diffBtn = ev.target.closest(".difficulty-toggle-btn");
    if (diffBtn){
      const newDifficulty = diffBtn.dataset.difficulty;
      if (newDifficulty === activeDifficulty) return;
      activeDifficulty = newDifficulty;
      content.querySelectorAll(".difficulty-toggle-btn").forEach(b => b.classList.toggle("active", b.dataset.difficulty === activeDifficulty));
      document.getElementById("encounters-body").innerHTML = buildEncountersHtml(currentEncounters());
      renderSubnav();
    }
  });
})();
</script>
