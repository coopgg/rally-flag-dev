<h1 id="raid-title">Vault of Glass</h1> <div id="raid-difficulty">Normal · Master</div>
<a href="guides.html">Overview</a> <a href="raids.html">Raids</a> <a href="dungeons.html">Dungeons</a> <a href="public-events.html">Public Events</a>
<div id="encounter-subnav"><a href="#encounter-opening-the-vault-of-glass">Opening the Vault of Glass</a> <a href="#encounter-confluxes">Confluxes</a> <a href="#encounter-oracles">Oracles</a> <a href="#encounter-templar">Templar</a> <a href="#encounter-gorgon-s-labyrinth">Gorgon's Labyrinth</a> <a href="#encounter-gatekeeper">Gatekeeper</a> <a href="#encounter-atheon-time-s-conflux">Atheon, Time's Conflux</a></div></div> <section id="content">Overview
<p>Vault of Glass is Destiny's oldest raid, brought back from the original game. The whole thing is built around Vex time-travel shenanigans: if you get pulled through a portal alone, that's supposed to happen, not a sign you messed up. A few ideas repeat through every encounter: one person carries a special item called the Relic that does something different in each fight, callouts matter more than damage, and almost every encounter has a specific 'do this wrong and the raid wipes' rule. Learn that one rule per encounter and the rest takes care of itself.</p>
<strong>Master Difficulty</strong> Master raises enemies well above the raid's Normal Power level — expect a Power deficit unless you're specifically geared for it — and every hit lands harder across the board. Several encounters also add Champions (Barrier, Overload, or Unstoppable) that don't appear on Normal; check the callout under an affected encounter below for which ones and where.
<h2>Encounters</h2>
<div id="encounters-body"><div id="encounter-opening-the-vault-of-glass">1
<h3>Opening the Vault of Glass</h3>
<strong>Objective</strong> Activate and hold three Vex sync plates until a central Spire finishes forming and the vault door opens.
<strong>Roles</strong> Split into three pairs, one pair per plate.
Our plate formation
<ol><li>Head to the three sync plates around the starting area (one to the left, one straight ahead near the door, one to the right) and send a pair to each.</li><li>Stand on each plate to build the connection between them.</li><li>Small Vex like Goblins and Hobgoblins can't take a plate back. Only Praetorians can, so focus them down before they reach your plate.</li><li>Watch for Cyclops enemies spawning in the open area. They hit hard, so drop them fast with Supers or heavy weapons.</li><li>Keep the pressure off all three plates until the Spire in the center fully forms and the door opens.</li></ol>
<strong>What wipes you</strong> Losing a plate to a Praetorian resets that plate's progress, and an unchecked Cyclops can wipe a two-person team fast, so don't let either one go unanswered.</div><div id="encounter-confluxes">2
<h3>Confluxes</h3>
<strong>Objective</strong> Defend one Conflux, then two, then three, as Vex enemies march in to sacrifice themselves into them.
<strong>Roles</strong> Stay together for the single-Conflux phase, then split into pairs as more Confluxes appear.
Map by SCA · <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=2955271467">original post</a>
<ol><li>In the opening phase there's only one Conflux, so stay together and clear whatever rushes in.</li><li>When it splits into two, divide the team in half and defend one Conflux each.</li><li>In the final phase there are three Confluxes, so pair up, two players per Conflux.</li><li>Prioritize Wyverns and any tougher Champion-type enemies the instant they appear over regular Vex.</li><li>Watch for glowing pools left behind by defeated enemies. Standing in one marks you for Negation, and there's a cleansing well in the center of the arena to clear the debuff.</li></ol>
<strong>What wipes you</strong> Letting too many regular Vex sacrifice into a Conflux fails it, but letting even one Wyvern sacrifice is an instant wipe, so kill Wyverns the moment you see them, no exceptions.
<strong>On Master</strong> On Master, the Minotaurs that show up during this encounter are Overload Champions.</div><div id="encounter-oracles">3
<h3>Oracles</h3>
<strong>Objective</strong> Destroy Oracles in the exact order they spawn, across five rounds that each add one more (3, then 4, 5, 6, and 7).
<strong>Roles</strong> Assign each player to watch one or two specific spawn points and call out a number the instant theirs appears.
Map by SCA · <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=2955271467">original post</a>
<ol><li>Spread out so every spawn point has someone watching it. With six players, one or two people will need to cover two spots each.</li><li>When an Oracle spawns, that player immediately calls out its position in the sequence.</li><li>Destroy them strictly in that order, not whichever one is closest.</li><li>Watch for Hobgoblins sniping from the edges of the room while you work through the sequence.</li><li>Repeat for all five rounds, with one more Oracle live each time.</li></ol>
<strong>What wipes you</strong> Destroying Oracles out of order marks the team, and running out of time before finishing a round wipes everyone, so a clear labeling system (like L1-L3 and R1-R4) matters more than raw damage here.</div><div id="encounter-templar">4
<h3>Templar</h3>
<strong>Objective</strong> Break Templar's shield using the Relic, damage him during his exposed window, and repeat until he's dead.
<strong>Roles</strong> One player carries the Relic and handles Oracles, shield removal, and rescuing anyone detained; everyone else deals damage once the shield drops.
Map by SCA · <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=2955271467">original post</a>
<ol><li>Pick up the Relic to start the fight. Three Oracles spawn immediately and must be destroyed in order, same rule as the Oracles encounter.</li><li>Once those Oracles are down, the Relic holder uses its charged attack to knock off Templar's shield.</li><li>With the shield down, everyone except the Relic holder focuses Templar's weak point until he drops a teleport ring on the ground. If a player gets randomly detained during this window, have them move away from the group while a teammate shoots the detainment field to free them.</li><li>Optionally, the Relic holder can stand inside that ring to block the teleport and extend the damage window, but this spawns extra Praetorians that need clearing.</li><li>If Templar does teleport, he regains his shield, so repeat the Oracle-shield-damage cycle until he's dead.</li></ol>
<strong>What wipes you</strong> If the Relic gets dropped, someone needs to grab it again within about 10 seconds or it wipes the team, so protect the Relic holder like they're the only objective that matters.</div><div id="encounter-gorgon-s-labyrinth">5
<h3>Gorgon's Labyrinth</h3>
<strong>Objective</strong> Cross a fog-filled maze patrolled by giant Harpies called Gorgons without being spotted. There's no combat here, just stealth and patience.
<strong>Roles</strong> No special roles, move together and stay low.
Map by SCA · <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=2955271467">original post</a>
<ol><li>Stay crouched and hug cover as you move through the maze.</li><li>If a Gorgon notices you, it enrages, so freeze and wait it out rather than panicking or running.</li><li>The large rocks on the left side of the maze let you jump across and avoid several Gorgons at once, which tends to be the most consistent route.</li><li>Exit on the left-hand side of the maze relative to where you came in.</li></ol>
<strong>What wipes you</strong> Being spotted by a Gorgon is the only way to lose progress here. There's no timer, so it's always better to move slowly than rush and get caught.</div><div id="encounter-gatekeeper">6
<h3>Gatekeeper</h3>
<strong>Objective</strong> Relay the Relic between two portals to clear shielded Praetorians on each side, then defend a Conflux that spawns in the main room.
<strong>Roles</strong> One player starts with the Relic; two players hold the portals and call out enemy spawns; one or two guard the sync plates keeping the portals open.
Map by SCA · <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=2955271467">original post</a>
Map by SCA, Mars/Venus portal variant · <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=2955271467">original post</a>
<ol><li>Defeat the Gatekeeper enemy in the center of the room, then grab the Relic that spawns where it died.</li><li>While that's happening, the rest of the team activates both portals by standing on their sync plates.</li><li>Send one player into each portal. They call out as soon as a shielded Praetorian appears on their side.</li><li>The Relic holder rushes into whichever portal has the Praetorian, breaks its shield, then drops the Relic for the player already inside to pick up.</li><li>That player carries the Relic back out and across to the opposite portal, where the process repeats.</li><li>Watch the sync plates: if a Minotaur reaches one, it shuts that portal down until it's cleared.</li><li>Additional Gatekeepers can respawn in the middle of the room and lock both portals again — kill them to reopen things and keep the rotation going.</li><li>Once enough Praetorians are cleared this way, a Conflux appears in the main room. Regroup there and defend it, including a few Wyverns that show up near the end, until the encounter ends.</li></ol>
<strong>What wipes you</strong> The Relic can only pass through one portal at a time before it has to be dropped for someone else to carry. Holding it too long, or losing the Relic holder mid-handoff, stalls the whole rotation.</div><div id="encounter-atheon-time-s-conflux">7
<h3>Atheon, Time's Conflux</h3>
<strong>Objective</strong> Coordinate between a team that gets teleported away and a team that stays behind, matching an Oracle order across both sides, to earn a damage window on Atheon.
<strong>Roles</strong> Three players stay in the main room calling out Oracle order and managing portals; three get teleported and must report which side they landed on, then handle Oracles and Relic duty inside.
Map by SCA · <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=2955271467">original post</a>
Map by SCA, Mars/Venus portal variant · <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=2955271467">original post</a>
<ol><li>Destroy the floating Vex cube to start the fight. This spawns Atheon along with waves of Harpies.</li><li>Clear Harpies until three players get randomly teleported away.</li><li>The teleported players immediately call out which side they're on.</li><li>The team left behind opens the matching portal and calls out the order Oracles are spawning above them, so the teleported group can destroy their own Oracles in the same order.</li><li>One teleported player grabs a Relic on their side to clear Praetorians and cleanse Marked by the Void from the group.</li><li>After nine Oracles are destroyed across three rounds, the teleported players escape back through the portal.</li><li>Everyone gets the Time's Vengeance buff, which opens a damage window on Atheon. Focus fire immediately since it doesn't last long, and if a player gets randomly detained during this window, have them move well away from the group while teammates shoot the detainment field to free them.</li><li>Repeat the whole cycle until Atheon is dead. There's no separate final stand phase.</li></ol>
<strong>What wipes you</strong> Getting the Oracle order wrong on either side, or running out of time before the teleported players escape, ends the run, and dropping the Relic for more than about 10 seconds does too. Clean callouts between the inside and outside teams matter more here than anywhere else in the raid.</div></div>

<script src="assets/game-terms.js"></script>
<script src="assets/art-tints.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/raids-data.js"></script>
<script src="assets/sets-data.js"></script>
<script>
(function(){
  // Generated per-raid pages (raid-<slug>.html, tools/build-guide-pages.js)
  // set GUIDE_SLUG. On this template page, an old ?slug= link forwards to
  // the raid's own page, whose static tags give proper link previews.
  const slug = window.GUIDE_SLUG || new URLSearchParams(window.location.search).get("slug");
  const raid = window.RaidsData.RAIDS.find(r => r.slug === slug);
  if (raid && !window.GUIDE_SLUG){
    location.replace(window.rallyFlagGuideHref("raid", raid.slug) + location.hash);
    return;
  }
  const content = document.getElementById("content");

  if (!raid){
    document.getElementById("raid-title").textContent = "Raid not found";
    content.innerHTML = '<div class="not-found panel-card block">Head back to <a href="raids.html">the raid list</a> and pick one from there.</div>';
    return;
  }

  document.title = raid.name + " Raid Guide - Rally Flag";
  document.getElementById("raid-title").textContent = raid.name;
  // Header sits over the raid's official art.
  if (raid.art){
    const hero = document.getElementById("hero");
    hero.classList.add("has-art");
    const tint = window.rallyFlagArtTint(raid.art); // its colour shows until the art loads
    hero.insertAdjacentHTML("afterbegin", '<div class="hero-art"' + (tint ? ' style="background-color:' + tint + '"' : "") + '><img src="' + window.rallyFlagArtUrl(raid.art) + '" alt="" fetchpriority="high"></div>');
  }
  document.getElementById("raid-difficulty").textContent = raid.difficulties ? raid.difficulties.join(" · ") : "";

  function slugify(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function encounterAnchorId(e, i){
    return "encounter-" + (e.name ? slugify(e.name) : (i + 1));
  }

  let activeDifficulty = "Normal";
  function currentEncounters(){
    return (activeDifficulty === "Epic" && raid.epicEncounters) ? raid.epicEncounters : raid.encounters;
  }

  const encounterSubnavEl = document.getElementById("encounter-subnav");
  function renderSubnav(){
    const encounters = currentEncounters();
    if (encounters.length){
      encounterSubnavEl.style.display = "";
      encounterSubnavEl.innerHTML = encounters.map((e, i) =>
        '<a href="#' + encounterAnchorId(e, i) + '">' + e.name + '</a>'
      ).join("");
    } else {
      encounterSubnavEl.style.display = "none";
    }
  }
  renderSubnav();
  encounterSubnavEl.addEventListener("click", (ev) => {
    const link = ev.target.closest("a");
    if (!link) return;
    const target = document.querySelector(link.getAttribute("href"));
    if (!target) return;
    ev.preventDefault();
    target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    history.replaceState(null, "", link.getAttribute("href"));
  });

  const setsBySlug = {};
  window.ArmorSetsData.SETS.forEach(s => setsBySlug[s.slug] = s);

  const setLinksHtml = raid.armorSlugs.map(slug => {
    const set = setsBySlug[slug];
    const label = set ? set.name : slug;
    return '<a class="set-link" href="armor-set-bonuses.html?highlight=' + slug + '">' + label + ' \u2192</a>';
  }).join("");

  function buildEncountersHtml(encounters){
    return encounters.length
    ? encounters.map((e, i) => {
        if (e.objective || e.steps){
          const hl = window.GameTerms.highlight;
          const stepsHtml = (e.steps || []).map(s => '<li>' + hl(s) + '</li>').join("");
          const mapHtml = e.mapImage
            ? '<div class="encounter-map"><img src="' + e.mapImage.url + '" alt="' + e.name + ' encounter map" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.mapImage.credit +
              (e.mapImage.creditUrl ? ' · <a href="' + e.mapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const secondaryMapHtml = e.secondaryMapImage
            ? '<div class="encounter-map"><img src="' + e.secondaryMapImage.url + '" alt="' + e.name + ' encounter map variant" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.secondaryMapImage.credit +
              (e.secondaryMapImage.creditUrl ? ' · <a href="' + e.secondaryMapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const strategyHtml = e.strategyImage
            ? '<div class="encounter-map"><img src="' + e.strategyImage.url + '" alt="' + e.name + ' strategy diagram" loading="lazy">' +
              (e.strategyImage.label ? '<div class="encounter-map-label">' + e.strategyImage.label + '</div>' : '') +
              '</div>'
            : '';
          const advancedHtml = (e.advancedTactics && e.advancedTactics.length)
            ? '<div class="encounter-advanced">' +
                '<button class="encounter-advanced-toggle" type="button"><span class="caret">\u25b8</span> Advanced tactic (optional)</button>' +
                '<div class="encounter-advanced-body">' +
                  e.advancedTactics.map(t => '<p>' + hl(t) + '</p>').join("") +
                '</div>' +
              '</div>'
            : '';
          const encounterPuzzleHelperHtml = e.puzzleHelper
            ? '<a class="block panel-card puzzle-helper-link encounter-puzzle-helper-link" href="puzzle-helper.html?tool=' + e.puzzleHelper.slug + '">' +
                '<div>' +
                  '<div class="puzzle-helper-link-title">' + e.puzzleHelper.title + '</div>' +
                  '<div class="puzzle-helper-link-sub">' + e.puzzleHelper.blurb + '</div>' +
                '</div>' +
                '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
              '</a>'
            : '';
          return '<div class="block panel-card encounter-card" id="' + encounterAnchorId(e, i) + '">' +
            '<div class="encounter-head"><div class="encounter-num">' + (i + 1) + '</div><h3 class="encounter-title">' + e.name + '</h3></div>' +
            (e.objective ? '<div class="encounter-field"><span class="encounter-field-label">Objective</span>' + hl(e.objective) + '</div>' : '') +
            (e.roles ? '<div class="encounter-field"><span class="encounter-field-label">Roles</span>' + hl(e.roles) + '</div>' : '') +
            mapHtml +
            secondaryMapHtml +
            strategyHtml +
            (stepsHtml ? '<ol class="encounter-steps">' + stepsHtml + '</ol>' : '') +
            (e.wipe ? '<div class="encounter-wipe"><span class="encounter-wipe-label">What wipes you</span>' + hl(e.wipe) + '</div>' : '') +
            (e.master ? '<div class="encounter-master"><span class="encounter-master-label">On Master</span>' + hl(e.master) + '</div>' : '') +
            advancedHtml +
            encounterPuzzleHelperHtml +
          '</div>';
        }
        // Fallback for older, simpler encounter entries
        return '<div class="block panel-card encounter-card encounter-row" id="' + encounterAnchorId(e, i) + '"><div class="encounter-num">' + (i + 1) + '</div>' +
          '<div><div class="encounter-name">' + e.name + '</div><div class="encounter-notes">' + (e.notes || "") + '</div></div></div>';
      }).join("")
    : '<div class="block panel-card"><div class="block-empty">Encounter notes coming soon.</div></div>';
  }

  const difficultyToggleHtml = raid.epicEncounters
    ? '<div class="difficulty-toggle" id="difficulty-toggle">' +
        '<button type="button" class="difficulty-toggle-btn active" data-difficulty="Normal">Normal</button>' +
        '<button type="button" class="difficulty-toggle-btn" data-difficulty="Epic">Epic</button>' +
      '</div>'
    : '';

  const puzzleHelperHtml = raid.puzzleHelper
    ? '<a class="block panel-card puzzle-helper-link" href="puzzle-helper.html?tool=' + raid.puzzleHelper.slug + '">' +
        '<div>' +
          '<div class="puzzle-helper-link-title">' + raid.puzzleHelper.title + '</div>' +
          '<div class="puzzle-helper-link-sub">' + raid.puzzleHelper.blurb + '</div>' +
        '</div>' +
        '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
      '</a>'
    : '';

  const raidMasterNoteHtml = (raid.difficulties && raid.difficulties.includes("Master"))
    ? '<div class="raid-master-note"><span class="raid-master-note-label">Master Difficulty</span>' +
        "Master raises enemies well above the raid's Normal Power level — expect a Power deficit unless you're specifically geared for it — and every hit lands harder across the board. Several encounters also add Champions (Barrier, Overload, or Unstoppable) that don't appear on Normal; check the callout under an affected encounter below for which ones and where." +
      '</div>'
    : '';

  content.innerHTML =
    '<div class="block panel-card">' +
      '<div class="block-label">Overview</div>' +
      (raid.summary ? '<p>' + raid.summary + '</p>' : '<div class="block-empty">Overview coming soon.</div>') +
      raidMasterNoteHtml +
    '</div>' +
    '<div class="block-label-row encounters-head"><h2 class="block-label">Encounters</h2>' + difficultyToggleHtml + '</div>' +
    '<div id="encounters-body">' + buildEncountersHtml(currentEncounters()) + '</div>' +
    puzzleHelperHtml +
    '<div class="block panel-card">' +
      '<div class="block-label">Armor Sets From This Raid</div>' +
      '<div class="set-links">' + setLinksHtml + '</div>' +
    '</div>';

  content.addEventListener("click", (ev) => {
    const advToggle = ev.target.closest(".encounter-advanced-toggle");
    if (advToggle){
      advToggle.closest(".encounter-advanced").classList.toggle("open");
      return;
    }
    const diffBtn = ev.target.closest(".difficulty-toggle-btn");
    if (diffBtn){
      const newDifficulty = diffBtn.dataset.difficulty;
      if (newDifficulty === activeDifficulty) return;
      activeDifficulty = newDifficulty;
      content.querySelectorAll(".difficulty-toggle-btn").forEach(b => b.classList.toggle("active", b.dataset.difficulty === activeDifficulty));
      document.getElementById("encounters-body").innerHTML = buildEncountersHtml(currentEncounters());
      renderSubnav();
    }
  });
})();
</script>
<script src="assets/your-clears.js"></script>
</body>
