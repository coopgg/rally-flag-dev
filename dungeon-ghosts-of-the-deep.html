<p>Ghosts of the Deep leans on one repeating idea: track down a Hive rune symbol, defeat a Lightbearer to claim a Vestige of Light buff, then imbue the correct matching statue before the buff's timer runs out. Every encounter builds on that same rune-and-imbue loop.</p>
<h2>Encounters</h2><div id="encounter-hive-ritual-disrupted">1
<h3>Hive Ritual Disrupted</h3>
<strong>Objective</strong> Track a trail of Hive runes to find and defeat a Lightbearer, then imbue the matching statue with the buff it drops, four times total.
<strong>Roles</strong> No fixed roles. Move together and share lookout duty for the rune symbol.
<ol><li>Defeat the enemies by the door to spawn a tougher enemy, then follow the trail it leaves toward a Hive rune in the sky, and remember the symbol.</li><li>Clear the enemies at that location to reveal the next point in the trail, and repeat until you reach a Lightbearer.</li><li>Defeat the Lightbearer, then immediately defeat its Ghost. Whoever gets that kill receives the Vestige of Light buff.</li><li>Return to the starting door and defeat the Wizard guarding it.</li><li>Reveal the illusion on the ground to grant the team a short window of Deepsight.</li><li>While that's active, the Vestige of Light holder interacts with the statue matching the symbol you tracked earlier.</li><li>Repeat this whole sequence four times to open the door.</li></ol>
<strong>What wipes you</strong> Imbuing the wrong statue kills whoever's holding the buff and resets that attempt, so don't rush the interaction if you're not sure you remembered the symbol correctly.</div><div id="encounter-ecthar-the-shield-of-savath-n">2
<h3>Ecthar, the Shield of Savathûn</h3>
<strong>Objective</strong> Track three underwater runes while dodging the boss, then collect the Vestige of Light from three Lightbearers to imbue three statues and trigger a damage phase.
<strong>Roles</strong> One or more players go underwater to find runes and lead the boss away; the rest hold the main room and clear adds.
<ol><li>Defeat the enemies praying near the fountain to spawn the boss, along with the enemy that unlocks a Deepsight window.</li><li>Use Deepsight to note three lit Hive rune symbols on the walls.</li><li>Send at least one player underwater (this pulls the boss along with them) to find and touch all three matching runes.</li><li>While that's happening, the rest of the team clears the adds spawning in the main room.</li><li>Back on the surface, defeat the Lightbearer Wizards that appear, then defeat each one's Ghost to claim the Vestige of Light buff.</li><li>Carry that buff to one of the three statues and imbue it, then repeat for all three.</li><li>Once the third statue is imbued, defeat the Knight that spawns and step into the pool it leaves to break the boss's shield and begin the damage phase.</li><li>Damage the boss until it goes immune, then repeat the whole cycle.</li></ol>
<strong>What wipes you</strong> There's no instant wipe here, but losing track of the underwater player or letting adds overwhelm the surface team can stall progress badly. A Well of Radiance or similar support makes a real difference in this room.</div><div id="encounter-simmumah-ur-nokru-lucent-necromancer">3
<h3>Simmumah ur-Nokru, Lucent Necromancer</h3>
<strong>Objective</strong> Reveal three linked locations, lure a specific enemy to each while standing in them to unlock Hive runes, then imbue all three using Vestiges collected from side chambers before starting a damage phase.
<strong>Roles</strong> No fixed roles. Coordinate on which location each player is luring the enemy to, and who's collecting Vestiges.
<ol><li>Crush the Ghost near the boss to start the encounter, then reveal the illusion to gain Deepsight and spot three connected locations.</li><li>Stand at one location so it glows, then defeat Vorlog, Risen in Heresy while standing inside that glow to reveal a Hive rune there.</li><li>Repeat for the other two locations. The heart location must always be done last in this part of the sequence.</li><li>Enter one of the water chambers to find a Lightbearer, defeat it and its Ghost to claim a Vestige buff, and note the Hive rune symbol in that room.</li><li>Return to the main area, use Deepsight again, and imbue the matching location with the Vestige before its 60-second timer runs out.</li><li>Repeat this chamber-and-imbue process for all three locations, then begin the damage phase.</li><li>Stand inside one of the three locations to drop the boss's shield, then unload damage until it goes immune.</li><li>Repeat the whole rune-and-damage cycle. The required locations shift each round, so re-check with Deepsight every time.</li></ol>
<strong>What wipes you</strong> Letting a Vestige of Light buff's 60-second timer expire before you imbue the correct location kills whoever's holding it, so always confirm the symbol match through Deepsight before committing to the run back.</div>

<script>
(function(){
  // Generated per-dungeon pages (dungeon-<slug>.html, tools/build-guide-pages.js)
  // set GUIDE_SLUG. On this template page, an old ?slug= link forwards to
  // the dungeon's own page, whose static tags give proper link previews.
  const slug = window.GUIDE_SLUG || new URLSearchParams(window.location.search).get("slug");
  const dungeon = window.DungeonsData.DUNGEONS.find(d => d.slug === slug);
  if (dungeon && !window.GUIDE_SLUG){
    location.replace(window.rallyFlagGuideHref("dungeon", dungeon.slug) + location.hash);
    return;
  }
  const content = document.getElementById("content");

  if (!dungeon){
    document.getElementById("dungeon-title").textContent = "Dungeon not found";
    content.innerHTML = '<div class="not-found panel-card block">Head back to <a href="dungeons.html">the dungeon list</a> and pick one from there.</div>';
    return;
  }

  document.title = dungeon.name + " Dungeon Guide - Rally Flag";
  document.getElementById("dungeon-title").textContent = dungeon.name;
  // Header sits over the dungeon's official art.
  if (dungeon.art){
    const hero = document.getElementById("hero");
    hero.classList.add("has-art");
    const tint = window.rallyFlagArtTint(dungeon.art); // its colour shows until the art loads
    hero.insertAdjacentHTML("afterbegin", '<div class="hero-art"' + (tint ? ' style="background-color:' + tint + '"' : "") + '><img src="' + window.rallyFlagArtUrl(dungeon.art) + '" alt="" fetchpriority="high"></div>');
  }


  function slugify(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function encounterAnchorId(e, i){
    return "encounter-" + (e.name ? slugify(e.name) : (i + 1));
  }

  const encounterSubnavEl = document.getElementById("encounter-subnav");
  if (dungeon.encounters.length){
    encounterSubnavEl.innerHTML = dungeon.encounters.map((e, i) =>
      '<a href="#' + encounterAnchorId(e, i) + '">' + e.name + '</a>'
    ).join("");
    encounterSubnavEl.addEventListener("click", (ev) => {
      const link = ev.target.closest("a");
      if (!link) return;
      const target = document.querySelector(link.getAttribute("href"));
      if (!target) return;
      ev.preventDefault();
      target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      history.replaceState(null, "", link.getAttribute("href"));
    });
  } else {
    encounterSubnavEl.style.display = "none";
  }

  const setsBySlug = {};
  window.ArmorSetsData.SETS.forEach(s => setsBySlug[s.slug] = s);

  const setLinksHtml = dungeon.armorSlugs.map(slug => {
    const set = setsBySlug[slug];
    const label = set ? set.name : slug;
    return '<a class="set-link" href="armor-set-bonuses.html?highlight=' + slug + '">' + label + ' \u2192</a>';
  }).join("");

  const encountersHtml = dungeon.encounters.length
    ? dungeon.encounters.map((e, i) => {
        if (e.objective || e.steps){
          const hl = window.GameTerms.highlight;
          const stepsHtml = (e.steps || []).map(s => '<li>' + hl(s) + '</li>').join("");
          return '<div class="block panel-card encounter-card" id="' + encounterAnchorId(e, i) + '">' +
            '<div class="encounter-head"><div class="encounter-num">' + (i + 1) + '</div><h3 class="encounter-title">' + e.name + '</h3></div>' +
            (e.objective ? '<div class="encounter-field"><span class="encounter-field-label">Objective</span>' + hl(e.objective) + '</div>' : '') +
            (e.roles ? '<div class="encounter-field"><span class="encounter-field-label">Roles</span>' + hl(e.roles) + '</div>' : '') +
            (stepsHtml ? '<ol class="encounter-steps">' + stepsHtml + '</ol>' : '') +
            (e.wipe ? '<div class="encounter-wipe"><span class="encounter-wipe-label">What wipes you</span>' + hl(e.wipe) + '</div>' : '') +
          '</div>';
        }
        // Fallback for older, simpler encounter entries
        return '<div class="block panel-card encounter-card encounter-row" id="' + encounterAnchorId(e, i) + '"><div class="encounter-num">' + (i + 1) + '</div>' +
          '<div><div class="encounter-name">' + e.name + '</div><div class="encounter-notes">' + (e.notes || "") + '</div></div></div>';
      }).join("")
    : '<div class="block panel-card"><div class="block-empty">Encounter notes coming soon.</div></div>';

  content.innerHTML =
    '<div class="block panel-card">' +
      '<div class="block-label">Overview</div>' +
      (dungeon.summary ? '<p>' + dungeon.summary + '</p>' : '<div class="block-empty">Overview coming soon.</div>') +
    '</div>' +
    '<h2 class="block-label encounters-head">Encounters</h2>' +
    encountersHtml +
    '<div class="block panel-card">' +
      '<div class="block-label">Armor Sets From This Dungeon</div>' +
      '<div class="set-links">' + setLinksHtml + '</div>' +
    '</div>';
})();
</script>
