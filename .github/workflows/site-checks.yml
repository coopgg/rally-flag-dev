# Runs tests/site-check.js on every push to main and every pull request: every public
# page at desktop/phone × dark/light in headless Chromium (script errors,
# axe accessibility, sideways scroll, broken images, text under 12px,
# layout shift), plus generated guide pages, old-link forwarding and
# internal links; then tests/locker-check.mjs for the Locker's behaviour.
# Dev-only: .github/ and tests/ are never promoted to prod.
name: Site checks

on:
  # main is what dev deploys from; the claude/* work branch gets the same
  # commits, so running there too would just double every run.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      # The Locker's behaviour (moves, loadouts, DIM import/apply, sync,
      # maintenance) against sample data, a mocked Bungie and the workers'
      # own code: see tests/locker-check.mjs.
      - run: npm run locker
