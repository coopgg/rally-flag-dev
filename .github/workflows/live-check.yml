# Daily check of the live site, https://rallyflag.gg: the same page checks
# as site-checks.yml (script errors, axe, sideways scroll, broken images,
# text under 12px, layout shift, old-link forwarding, internal links over
# HTTP), plus the colour-contrast pass for every theme × dark/light.
# Catches what changes without a push: Bungie moving an image path or
# changing an API response. A failed scheduled run emails the repo owner.
# Dev-only: .github/ and tests/ are never promoted to prod.
name: Live site check

on:
  schedule:
    - cron: "7 13 * * *" # daily, 13:07 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tests
    env:
      LIVE_URL: https://rallyflag.gg/
      THEMES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
