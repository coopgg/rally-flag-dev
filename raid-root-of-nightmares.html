<h1 id="raid-title">Root of Nightmares</h1> <div id="raid-difficulty">Normal · Master</div>
<a href="guides.html">Overview</a> <a href="raids.html">Raids</a> <a href="dungeons.html">Dungeons</a> <a href="public-events.html">Public Events</a>
<div id="encounter-subnav"><a href="#encounter-cataclysm">Cataclysm</a> <a href="#encounter-scission">Scission</a> <a href="#encounter-zo-aurc-explicator-of-planets">Zo'Aurc, Explicator of Planets</a> <a href="#encounter-nezarec-final-god-of-pain">Nezarec, Final God of Pain</a></div></div> <section id="content">Overview
<p>Root of Nightmares runs almost entirely on one shared idea: building a network of glowing nodes by carrying a short-lived buff from one to the next. Once you understand that loop, every encounter in this raid is a variation on the same theme, just with a different twist bolted on.</p>
<strong>Master Difficulty</strong> Master raises enemies well above the raid's Normal Power level — expect a Power deficit unless you're specifically geared for it — and every hit lands harder across the board. Several encounters also add Champions (Barrier, Overload, or Unstoppable) that don't appear on Normal; check the callout under an affected encounter below for which ones and where.
<h2>Encounters</h2>
<div id="encounters-body"><div id="encounter-cataclysm">1
<h3>Cataclysm</h3>
<strong>Objective</strong> Build a network of nodes by carrying Field of Light between them while the rest of the team holds off waves of enemies.
<strong>Roles</strong> Two players manage the node network; everyone else focuses on add-clear.
<ol><li>Have two players grab Field of Light from the glowing node and use it to activate the next node in the sequence.</li><li>Return to the aura to refresh Field of Light before moving to activate each subsequent node. Don't refresh early, or you can accidentally strip the buff from a teammate mid-route.</li><li>Continue until the whole network for that section is connected.</li><li>Meanwhile, everyone else defeats Psion pairs as they appear. Killing both spawns a Tormentor that, when defeated, buys the network builders extra time.</li><li>Repeat across the arena until all sections are complete.</li></ol>
<strong>What wipes you</strong> The Sweeping Terror timer wipes the team if it runs out. Finishing a network pauses it, so the faster your two builders work, the less pressure everyone else is under.
<strong>On Master</strong> On Master, expect more Barrier Champion Colossi and Solar-shielded Centurions.</div><div id="encounter-scission">2
<h3>Scission</h3>
<strong>Objective</strong> Build two zig-zagging node networks across a gap by jumping back and forth with Field of Light or Flux of Darkness, while clearing enemies that can only be damaged by whoever's holding it.
<strong>Roles</strong> One dedicated jumper per side who crosses the gap repeatedly; everyone else clears enemies and can relay-run nodes on their own side.
<ol><li>Grab your side's Field of Light or Flux of Darkness and use a jump mechanism to cross to the other side.</li><li>Activate the next node in the sequence on the far side, then return to refresh the buff before crossing again.</li><li>Have a teammate on your home side pick up any newly-available near node while you're mid-crossing, to save time.</li><li>Defeat the Redolence of Splendor or Redolence of Decay enemies that spawn, prioritizing the type that only takes damage from whoever's holding the matching buff.</li><li>Once a full network on a level is done, a tougher version of that same enemy spawns, so defeat it to unlock the next level and repeat.</li></ol>
<strong>What wipes you</strong> There's no instant wipe here, but stacking distractions slows your builders down against the encounter's shared timer, so keep the crossing player's job as simple as possible and handle everything else around them.
<strong>On Master</strong> On Master, Unstoppable Champion Incendiors are added on each floor, and Barrier Champion Colossi still show up near the end of each floor.</div><div id="encounter-zo-aurc-explicator-of-planets">3
<h3>Zo'Aurc, Explicator of Planets</h3>
<strong>Objective</strong> Swap mismatched planets to their correct sides using Planetary Insight, then deliver the right combination to a set of central plates for a damage phase.
<strong>Roles</strong> Two pairs handle planet-swapping on each side; the rest handle add-clear and later plate positioning.
<ol><li>Defeat Terrestrial Lieutenants to earn Planetary Insight, which reveals a planet's true side.</li><li>Find the planets that don't belong on their current side, carry them across, and swap them with a partner doing the same from the other direction.</li><li>Once all mismatched planets are swapped, defeat more enemies to reveal the color pattern needed on three central plates.</li><li>Carry matching planets from the sides to the correct central plate based on that pattern.</li><li>Stand on whichever plate matches the boss's current shield type to deal bonus damage, and rotate to the next one as its shield changes — the sequence always follows a pattern where whichever color appears twice among the three plates goes first and last, so you can call the full rotation order before damage even starts.</li><li>Repeat the whole cycle until the boss is defeated.</li></ol>
<strong>What wipes you</strong> Nothing here directly wipes the team, but failing to deal enough damage during a plate rotation means you can't cycle through all of them. Slow, correct swaps beat fast, wrong ones.
<strong>On Master</strong> On Master, Barrier Champion Colossi replace the Terrestrial Lieutenants that grant Planetary Insight, so you'll need Barrier coverage just to start reading planets. Solar-shielded Centurions still show up as the trigger wave.</div><div id="encounter-nezarec-final-god-of-pain">4
<h3>Nezarec, Final God of Pain</h3>
<strong>Objective</strong> Build two networks of nodes (one of each energy type) while periodically stunning the boss, then burn him down in short damage phases across multiple rounds.
<strong>Roles</strong> Two players build the node networks; two more take turns tanking Nezarec's aggro and signaling which safe zone color is needed; everyone else keeps both lanes clear of adds.
<ol><li>Assign two players to build a Light network and a Dark network simultaneously, same node logic as earlier encounters.</li><li>Have two players take turns tanking Nezarec: shoot his chest to take Nezarec's Hatred, pulling his aggro off the team and onto yourself, then shoot one of his shoulders — the color of the resulting blast tells your network builders which Refuge to prepare.</li><li>If his wipe attack goes off before both networks are finished, take Field of Light to a completed Dark node, or Flux of Darkness to a completed Light node, to create a Light's Refuge or Darkness's Refuge matching the color his shoulder revealed, and have the team shelter in it.</li><li>Once both networks are complete, group up as he's exposed and unload as much damage as possible before he goes immune.</li><li>Reset and repeat: each round gives you less time before his wipe attack triggers, so move faster each time, with the tanks swapping Nezarec's Hatred back and forth to buy extra seconds.</li><li>Continue until his final stand, where you'll need to finish him off before he wipes the team outright.</li></ol>
<strong>What wipes you</strong> Getting caught outside a Refuge during his wipe attack kills everyone who isn't protected. The fastest way to avoid needing one at all is finishing both node networks before his patience runs out.
<strong>On Master</strong> On Master, Barrier Champion Colossi replace the normal Esteemed Colossi.</div></div><a href="puzzle-helper.html?tool=nezarec-extra-chest">Nezarec's Extra Chest
Note the reference wall's Light/Dark pattern at the start, then work out which orbs to connect in each of the raid's three hidden rooms.

  }
  document.getElementById("raid-difficulty").textContent = raid.difficulties ? raid.difficulties.join(" · ") : "";

  function slugify(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function encounterAnchorId(e, i){
    return "encounter-" + (e.name ? slugify(e.name) : (i + 1));
  }

  let activeDifficulty = "Normal";
  function currentEncounters(){
    return (activeDifficulty === "Epic" && raid.epicEncounters) ? raid.epicEncounters : raid.encounters;
  }

  const encounterSubnavEl = document.getElementById("encounter-subnav");
  function renderSubnav(){
    const encounters = currentEncounters();
    if (encounters.length){
      encounterSubnavEl.style.display = "";
      encounterSubnavEl.innerHTML = encounters.map((e, i) =>
        '<a href="#' + encounterAnchorId(e, i) + '">' + e.name + '</a>'
      ).join("");
    } else {
      encounterSubnavEl.style.display = "none";
    }
  }
  renderSubnav();
  encounterSubnavEl.addEventListener("click", (ev) => {
    const link = ev.target.closest("a");
    if (!link) return;
    const target = document.querySelector(link.getAttribute("href"));
    if (!target) return;
    ev.preventDefault();
    target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    history.replaceState(null, "", link.getAttribute("href"));
  });

  const setsBySlug = {};
  window.ArmorSetsData.SETS.forEach(s => setsBySlug[s.slug] = s);

  const setLinksHtml = raid.armorSlugs.map(slug => {
    const set = setsBySlug[slug];
    const label = set ? set.name : slug;
    return '<a class="set-link" href="armor-set-bonuses.html?highlight=' + slug + '">' + label + ' \u2192</a>';
  }).join("");

  function buildEncountersHtml(encounters){
    return encounters.length
    ? encounters.map((e, i) => {
        if (e.objective || e.steps){
          const hl = window.GameTerms.highlight;
          const stepsHtml = (e.steps || []).map(s => '<li>' + hl(s) + '</li>').join("");
          const mapHtml = e.mapImage
            ? '<div class="encounter-map"><img src="' + e.mapImage.url + '" alt="' + e.name + ' encounter map" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.mapImage.credit +
              (e.mapImage.creditUrl ? ' · <a href="' + e.mapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const secondaryMapHtml = e.secondaryMapImage
            ? '<div class="encounter-map"><img src="' + e.secondaryMapImage.url + '" alt="' + e.name + ' encounter map variant" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.secondaryMapImage.credit +
              (e.secondaryMapImage.creditUrl ? ' · <a href="' + e.secondaryMapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const strategyHtml = e.strategyImage
            ? '<div class="encounter-map"><img src="' + e.strategyImage.url + '" alt="' + e.name + ' strategy diagram" loading="lazy">' +
              (e.strategyImage.label ? '<div class="encounter-map-label">' + e.strategyImage.label + '</div>' : '') +
              '</div>'
            : '';
          const advancedHtml = (e.advancedTactics && e.advancedTactics.length)
            ? '<div class="encounter-advanced">' +
                '<button class="encounter-advanced-toggle" type="button"><span class="caret">\u25b8</span> Advanced tactic (optional)</button>' +
                '<div class="encounter-advanced-body">' +
                  e.advancedTactics.map(t => '<p>' + hl(t) + '</p>').join("") +
                '</div>' +
              '</div>'
            : '';
          const encounterPuzzleHelperHtml = e.puzzleHelper
            ? '<a class="block panel-card puzzle-helper-link encounter-puzzle-helper-link" href="puzzle-helper.html?tool=' + e.puzzleHelper.slug + '">' +
                '<div>' +
                  '<div class="puzzle-helper-link-title">' + e.puzzleHelper.title + '</div>' +
                  '<div class="puzzle-helper-link-sub">' + e.puzzleHelper.blurb + '</div>' +
                '</div>' +
                '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
              '</a>'
            : '';
          return '<div class="block panel-card encounter-card" id="' + encounterAnchorId(e, i) + '">' +
            '<div class="encounter-head"><div class="encounter-num">' + (i + 1) + '</div><h3 class="encounter-title">' + e.name + '</h3></div>' +
            (e.objective ? '<div class="encounter-field"><span class="encounter-field-label">Objective</span>' + hl(e.objective) + '</div>' : '') +
            (e.roles ? '<div class="encounter-field"><span class="encounter-field-label">Roles</span>' + hl(e.roles) + '</div>' : '') +
            mapHtml +
            secondaryMapHtml +
            strategyHtml +
            (stepsHtml ? '<ol class="encounter-steps">' + stepsHtml + '</ol>' : '') +
            (e.wipe ? '<div class="encounter-wipe"><span class="encounter-wipe-label">What wipes you</span>' + hl(e.wipe) + '</div>' : '') +
            (e.master ? '<div class="encounter-master"><span class="encounter-master-label">On Master</span>' + hl(e.master) + '</div>' : '') +
            advancedHtml +
            encounterPuzzleHelperHtml +
          '</div>';
        }
        // Fallback for older, simpler encounter entries
        return '<div class="block panel-card encounter-card encounter-row" id="' + encounterAnchorId(e, i) + '"><div class="encounter-num">' + (i + 1) + '</div>' +
          '<div><div class="encounter-name">' + e.name + '</div><div class="encounter-notes">' + (e.notes || "") + '</div></div></div>';
      }).join("")
    : '<div class="block panel-card"><div class="block-empty">Encounter notes coming soon.</div></div>';
  }

  const difficultyToggleHtml = raid.epicEncounters
    ? '<div class="difficulty-toggle" id="difficulty-toggle">' +
        '<button type="button" class="difficulty-toggle-btn active" data-difficulty="Normal">Normal</button>' +
        '<button type="button" class="difficulty-toggle-btn" data-difficulty="Epic">Epic</button>' +
      '</div>'
    : '';

  const puzzleHelperHtml = raid.puzzleHelper
    ? '<a class="block panel-card puzzle-helper-link" href="puzzle-helper.html?tool=' + raid.puzzleHelper.slug + '">' +
        '<div>' +
          '<div class="puzzle-helper-link-title">' + raid.puzzleHelper.title + '</div>' +
          '<div class="puzzle-helper-link-sub">' + raid.puzzleHelper.blurb + '</div>' +
        '</div>' +
        '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
      '</a>'
    : '';

  const raidMasterNoteHtml = (raid.difficulties && raid.difficulties.includes("Master"))
    ? '<div class="raid-master-note"><span class="raid-master-note-label">Master Difficulty</span>' +
        "Master raises enemies well above the raid's Normal Power level — expect a Power deficit unless you're specifically geared for it — and every hit lands harder across the board. Several encounters also add Champions (Barrier, Overload, or Unstoppable) that don't appear on Normal; check the callout under an affected encounter below for which ones and where." +
      '</div>'
    : '';

  content.innerHTML =
    '<div class="block panel-card">' +
      '<div class="block-label">Overview</div>' +
      (raid.summary ? '<p>' + raid.summary + '</p>' : '<div class="block-empty">Overview coming soon.</div>') +
      raidMasterNoteHtml +
    '</div>' +
    '<div class="block-label-row encounters-head"><h2 class="block-label">Encounters</h2>' + difficultyToggleHtml + '</div>' +
    '<div id="encounters-body">' + buildEncountersHtml(currentEncounters()) + '</div>' +
    puzzleHelperHtml +
    '<div class="block panel-card">' +
      '<div class="block-label">Armor Sets From This Raid</div>' +
      '<div class="set-links">' + setLinksHtml + '</div>' +
    '</div>';

  content.addEventListener("click", (ev) => {
    const advToggle = ev.target.closest(".encounter-advanced-toggle");
    if (advToggle){
      advToggle.closest(".encounter-advanced").classList.toggle("open");
      return;
    }
    const diffBtn = ev.target.closest(".difficulty-toggle-btn");
    if (diffBtn){
      const newDifficulty = diffBtn.dataset.difficulty;
      if (newDifficulty === activeDifficulty) return;
      activeDifficulty = newDifficulty;
      content.querySelectorAll(".difficulty-toggle-btn").forEach(b => b.classList.toggle("active", b.dataset.difficulty === activeDifficulty));
      document.getElementById("encounters-body").innerHTML = buildEncountersHtml(currentEncounters());
      renderSubnav();
    }
  });
})();
</script>
<script src="assets/your-clears.js"></script>
</body>
</html>
