<h1 id="raid-title">Deep Stone Crypt</h1> <div id="raid-difficulty">Normal</div>
<a href="guides.html">Overview</a> <a href="raids.html">Raids</a> <a href="dungeons.html">Dungeons</a> <a href="public-events.html">Public Events</a>
<div id="encounter-subnav"><a href="#encounter-pike-sparrow">Pike &amp; Sparrow</a> <a href="#encounter-crypt-security">Crypt Security</a> <a href="#encounter-atraks-1-fallen-exo">Atraks-1, Fallen Exo</a> <a href="#encounter-descent">Descent</a> <a href="#encounter-taniks-reborn">Taniks, Reborn</a> <a href="#encounter-taniks-the-abomination">Taniks, the Abomination</a></div></div> <section id="content">Overview
<p>Deep Stone Crypt introduced two buffs, Scanner and Operator, that show up again and again through the raid: Scanner lets you see something hidden that other players can't, and Operator lets you interact with terminals and free trapped teammates. Nearly every encounter comes down to the same loop: find the right target, tell someone else, and don't let the timers run out.</p>
<h2>Encounters</h2>
<div id="encounters-body"><div id="encounter-pike-sparrow">1
<h3>Pike &amp; Sparrow</h3>
<strong>Objective</strong> Ride vehicles across an icy field, bubble to bubble, to reach the entrance without freezing to death.
<strong>Roles</strong> No fixed roles, just keep moving as a group.
<ol><li>Grab a Pike or Sparrow at the start and follow the marked path across the ice.</li><li>Duck into each shielded bubble along the way to clear Frostbite with the bubble's Shelter from the Storm buff before it stacks too high.</li><li>Clear out the Fallen defending each bubble as you go.</li><li>Push through to the final bubble, which is guarded by tougher enemies, then continue on to the entrance.</li></ol>
<strong>What wipes you</strong> Staying out in the storm too long stacks Frostbite, which kills you at max stacks, so don't skip a bubble's Shelter from the Storm even if you think you can make it.</div><div id="encounter-crypt-security">2
<h3>Crypt Security</h3>
<strong>Objective</strong> Use two rotating buffs, Scanner and Operator, to identify and destroy six hidden fuses, split between an upstairs team and a basement teammate.
<strong>Roles</strong> Split into two teams of three (light side and dark side); one player goes alone into the basement as Operator.
<ol><li>Defeat the enemy that drops the Operator buff, pick it up, and head down to the basement alone right away.</li><li>Defeat the enemy that drops the Scanner buff and use it to look through the floor and call out which basement keypads are lit on your side.</li><li>Pass the Scanner buff across to the other side using the terminal so they can call out their two keypads.</li><li>The Operator, already waiting in the basement, shoots each keypad as it's called out.</li><li>Pass the Operator buff back upstairs and give the Scanner buff to whoever's now in the basement.</li><li>The new basement Scanner calls out which of six fuses is lit; everyone upstairs on that side shoots the matching fuse.</li><li>Repeat calling out and destroying fuses one at a time until all six are gone.</li></ol>
<strong>What wipes you</strong> There's no instant wipe here, but the basement player only has a few minutes before the room floods with fire and kills them, so swap out whoever's down there if the fight is dragging on.</div><div id="encounter-atraks-1-fallen-exo">3
<h3>Atraks-1, Fallen Exo</h3>
<strong>Objective</strong> Split between the Crypt and a space area to find the correct enemy copy, defeat it, and eject a stacking debuff out an airlock, repeating until enough copies are cleared for a final stand.
<strong>Roles</strong> Three players in space, three in the Crypt; one Scanner locates the correct enemy copy, one Operator manages airlocks and frees debuffed players.
<ol><li>Split into two teams of three: one heads to space, one stays in the Crypt.</li><li>Each team defeats an enemy to claim either the Scanner or Operator buff, then shares buffs between areas using the terminals so both teams get access to each.</li><li>The Scanner finds the one glowing enemy copy out of several identical ones and calls it out for the team to kill.</li><li>Whoever kills it picks up the Replicator debuff and needs to get to an airlock the Operator has unlocked before time runs out.</li><li>Stand in the airlock and have the Operator shoot Replicator off your head to clear it safely into space.</li><li>Pass the Scanner buff back and forth between space and the Crypt to repeat this process until eight Replicator debuffs are ejected total.</li><li>For the final stand, everyone moves to space, and the Scanner calls out each glowing copy in sequence until the boss is dead.</li></ol>
<strong>What wipes you</strong> Replicator kills whoever's carrying it if it isn't ejected through an airlock in time, so always have the Operator ready and watching for stranded players before the timer runs out.</div><div id="encounter-descent">4
<h3>Descent</h3>
<strong>Objective</strong> Navigate a jumping puzzle along the outside of the station back to solid ground.
<strong>Roles</strong> No fixed roles, just take it carefully.
<ol><li>Work your way along the platforms on the outside of the station, following the path back toward the interior.</li><li>Take your time on tricky jumps rather than rushing. There's no enemy pressure here, just the fall.</li><li>Grab the hidden chest on a platform to the left if your team wants it before continuing.</li></ol>
<strong>What wipes you</strong> Falling just costs you the climb, not the raid. There's no wipe mechanic here, just don't fall.</div><div id="encounter-taniks-reborn">5
<h3>Taniks, Reborn</h3>
<strong>Objective</strong> Collect three buffs, identify which buckets need Nuclear Cores, and stun Taniks long enough to deposit them, repeating until a hatch opens.
<strong>Roles</strong> One Scanner calls out which buckets are active, one Operator releases Nuclear Cores, one Suppressor stuns Taniks.
<ol><li>Defeat the enemies that drop the Scanner, Operator, and Suppressor buffs.</li><li>The Scanner calls out which buckets around the room are lit up and need a Nuclear Core.</li><li>The Operator shoots the keypad near the core dispenser to release Nuclear Cores for two players to grab.</li><li>The Suppressor moves under each of three drones in sequence, shooting Taniks from underneath each one to stun him.</li><li>Once Taniks is stunned, the core carriers deposit their Nuclear Cores into the correct buckets.</li><li>When a core is deposited, one buff gets disabled at random, so swap it to a new player using the terminal.</li><li>Repeat until enough cores are deposited to open the center hatch, then everyone drops down and runs to the end before Taniks catches up.</li></ol>
<strong>What wipes you</strong> Holding a Nuclear Core too long builds up a radiation debuff that kills you, so pass it to a teammate before it maxes out, and don't dawdle once the hatch opens, since Taniks will kill anyone he catches.</div><div id="encounter-taniks-the-abomination">6
<h3>Taniks, the Abomination</h3>
<strong>Objective</strong> Combine the Scanner, Operator, and Suppressor roles from the previous fight to deposit Nuclear Cores across three zones, then burn down Taniks in a multi-part damage phase.
<strong>Roles</strong> Three pairs, one per zone; one Scanner calls out active buckets, one Operator frees trapped players, one Suppressor stuns Taniks.
<ol><li>Split into three pairs and send one to each of the three zones around the arena.</li><li>Defeat enemies to claim the Scanner, Operator, and Suppressor buffs.</li><li>The Scanner calls out which two Nuclear Core buckets are currently active.</li><li>Everyone focuses Taniks' wings to knock loose Nuclear Cores, then two players carry them toward the correct buckets.</li><li>Swap a Nuclear Core to a fresh carrier before the radiation debuff maxes out on whoever's holding it.</li><li>The Suppressor moves under three drones in sequence, stunning Taniks each time so the cores can actually be deposited.</li><li>The Operator frees any core carrier who gets trapped in a barrier during this process. The third time the Suppressor stuns Taniks, a buff gets disabled at random — swap it to a new player using the terminal.</li><li>Repeat until four cores are deposited, at which point Taniks moves to the center for a damage phase: jump past the outer ring but stay inside the inner one to deal damage.</li><li>Repeat the whole core-and-damage cycle until his final health chunk, when he starts teleporting around the arena, then chase him down and finish the fight.</li></ol>
<strong>What wipes you</strong> This fight punishes indecision: letting radiation max out on a core carrier kills them, and running out of time in the final teleporting phase is a hard wipe with no second chances, so keep pushing damage even when things feel chaotic.</div></div>

    return;
  }
  const content = document.getElementById("content");

  if (!raid){
    document.getElementById("raid-title").textContent = "Raid not found";
    content.innerHTML = '<div class="not-found panel-card block">Head back to <a href="raids.html">the raid list</a> and pick one from there.</div>';
    return;
  }

  document.title = raid.name + " Raid Guide - Rally Flag";
  document.getElementById("raid-title").textContent = raid.name;
  // Header sits over the raid's official art.
  if (raid.art){
    const hero = document.getElementById("hero");
    hero.classList.add("has-art");
    const tint = window.rallyFlagArtTint(raid.art); // its colour shows until the art loads
    hero.insertAdjacentHTML("afterbegin", '<div class="hero-art"' + (tint ? ' style="background-color:' + tint + '"' : "") + '><img src="' + window.rallyFlagArtUrl(raid.art) + '" alt="" fetchpriority="high"></div>');
  }
  document.getElementById("raid-difficulty").textContent = raid.difficulties ? raid.difficulties.join(" · ") : "";

  function slugify(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function encounterAnchorId(e, i){
    return "encounter-" + (e.name ? slugify(e.name) : (i + 1));
  }

  let activeDifficulty = "Normal";
  function currentEncounters(){
    return (activeDifficulty === "Epic" && raid.epicEncounters) ? raid.epicEncounters : raid.encounters;
  }

  const encounterSubnavEl = document.getElementById("encounter-subnav");
  function renderSubnav(){
    const encounters = currentEncounters();
    if (encounters.length){
      encounterSubnavEl.style.display = "";
      encounterSubnavEl.innerHTML = encounters.map((e, i) =>
        '<a href="#' + encounterAnchorId(e, i) + '">' + e.name + '</a>'
      ).join("");
    } else {
      encounterSubnavEl.style.display = "none";
    }
  }
  renderSubnav();
  encounterSubnavEl.addEventListener("click", (ev) => {
    const link = ev.target.closest("a");
    if (!link) return;
    const target = document.querySelector(link.getAttribute("href"));
    if (!target) return;
    ev.preventDefault();
    target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    history.replaceState(null, "", link.getAttribute("href"));
  });

  const setsBySlug = {};
  window.ArmorSetsData.SETS.forEach(s => setsBySlug[s.slug] = s);

  const setLinksHtml = raid.armorSlugs.map(slug => {
    const set = setsBySlug[slug];
    const label = set ? set.name : slug;
    return '<a class="set-link" href="armor-set-bonuses.html?highlight=' + slug + '">' + label + ' \u2192</a>';
  }).join("");

  function buildEncountersHtml(encounters){
    return encounters.length
    ? encounters.map((e, i) => {
        if (e.objective || e.steps){
          const hl = window.GameTerms.highlight;
          const stepsHtml = (e.steps || []).map(s => '<li>' + hl(s) + '</li>').join("");
          const mapHtml = e.mapImage
            ? '<div class="encounter-map"><img src="' + e.mapImage.url + '" alt="' + e.name + ' encounter map" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.mapImage.credit +
              (e.mapImage.creditUrl ? ' · <a href="' + e.mapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const secondaryMapHtml = e.secondaryMapImage
            ? '<div class="encounter-map"><img src="' + e.secondaryMapImage.url + '" alt="' + e.name + ' encounter map variant" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.secondaryMapImage.credit +
              (e.secondaryMapImage.creditUrl ? ' · <a href="' + e.secondaryMapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const strategyHtml = e.strategyImage
            ? '<div class="encounter-map"><img src="' + e.strategyImage.url + '" alt="' + e.name + ' strategy diagram" loading="lazy">' +
              (e.strategyImage.label ? '<div class="encounter-map-label">' + e.strategyImage.label + '</div>' : '') +
              '</div>'
            : '';
          const advancedHtml = (e.advancedTactics && e.advancedTactics.length)
            ? '<div class="encounter-advanced">' +
                '<button class="encounter-advanced-toggle" type="button"><span class="caret">\u25b8</span> Advanced tactic (optional)</button>' +
                '<div class="encounter-advanced-body">' +
                  e.advancedTactics.map(t => '<p>' + hl(t) + '</p>').join("") +
                '</div>' +
              '</div>'
            : '';
          const encounterPuzzleHelperHtml = e.puzzleHelper
            ? '<a class="block panel-card puzzle-helper-link encounter-puzzle-helper-link" href="puzzle-helper.html?tool=' + e.puzzleHelper.slug + '">' +
                '<div>' +
                  '<div class="puzzle-helper-link-title">' + e.puzzleHelper.title + '</div>' +
                  '<div class="puzzle-helper-link-sub">' + e.puzzleHelper.blurb + '</div>' +
                '</div>' +
                '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
              '</a>'
            : '';
          return '<div class="block panel-card encounter-card" id="' + encounterAnchorId(e, i) + '">' +
            '<div class="encounter-head"><div class="encounter-num">' + (i + 1) + '</div><h3 class="encounter-title">' + e.name + '</h3></div>' +
            (e.objective ? '<div class="encounter-field"><span class="encounter-field-label">Objective</span>' + hl(e.objective) + '</div>' : '') +
            (e.roles ? '<div class="encounter-field"><span class="encounter-field-label">Roles</span>' + hl(e.roles) + '</div>' : '') +
            mapHtml +
            secondaryMapHtml +
            strategyHtml +
            (stepsHtml ? '<ol class="encounter-steps">' + stepsHtml + '</ol>' : '') +
            (e.wipe ? '<div class="encounter-wipe"><span class="encounter-wipe-label">What wipes you</span>' + hl(e.wipe) + '</div>' : '') +
            (e.master ? '<div class="encounter-master"><span class="encounter-master-label">On Master</span>' + hl(e.master) + '</div>' : '') +
            advancedHtml +
            encounterPuzzleHelperHtml +
          '</div>';
        }
        // Fallback for older, simpler encounter entries
        return '<div class="block panel-card encounter-card encounter-row" id="' + encounterAnchorId(e, i) + '"><div class="encounter-num">' + (i + 1) + '</div>' +
          '<div><div class="encounter-name">' + e.name + '</div><div class="encounter-notes">' + (e.notes || "") + '</div></div></div>';
      }).join("")
    : '<div class="block panel-card"><div class="block-empty">Encounter notes coming soon.</div></div>';
  }

  const difficultyToggleHtml = raid.epicEncounters
    ? '<div class="difficulty-toggle" id="difficulty-toggle">' +
        '<button type="button" class="difficulty-toggle-btn active" data-difficulty="Normal">Normal</button>' +
        '<button type="button" class="difficulty-toggle-btn" data-difficulty="Epic">Epic</button>' +
      '</div>'
    : '';

  const puzzleHelperHtml = raid.puzzleHelper
    ? '<a class="block panel-card puzzle-helper-link" href="puzzle-helper.html?tool=' + raid.puzzleHelper.slug + '">' +
        '<div>' +
          '<div class="puzzle-helper-link-title">' + raid.puzzleHelper.title + '</div>' +
          '<div class="puzzle-helper-link-sub">' + raid.puzzleHelper.blurb + '</div>' +
        '</div>' +
        '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
      '</a>'
    : '';

  const raidMasterNoteHtml = (raid.difficulties && raid.difficulties.includes("Master"))
    ? '<div class="raid-master-note"><span class="raid-master-note-label">Master Difficulty</span>' +
        "Master raises enemies well above the raid's Normal Power level — expect a Power deficit unless you're specifically geared for it — and every hit lands harder across the board. Several encounters also add Champions (Barrier, Overload, or Unstoppable) that don't appear on Normal; check the callout under an affected encounter below for which ones and where." +
      '</div>'
    : '';

  content.innerHTML =
    '<div class="block panel-card">' +
      '<div class="block-label">Overview</div>' +
      (raid.summary ? '<p>' + raid.summary + '</p>' : '<div class="block-empty">Overview coming soon.</div>') +
      raidMasterNoteHtml +
    '</div>' +
    '<div class="block-label-row encounters-head"><h2 class="block-label">Encounters</h2>' + difficultyToggleHtml + '</div>' +
    '<div id="encounters-body">' + buildEncountersHtml(currentEncounters()) + '</div>' +
    puzzleHelperHtml +
    '<div class="block panel-card">' +
      '<div class="block-label">Armor Sets From This Raid</div>' +
      '<div class="set-links">' + setLinksHtml + '</div>' +
    '</div>';

  content.addEventListener("click", (ev) => {
    const advToggle = ev.target.closest(".encounter-advanced-toggle");
    if (advToggle){
      advToggle.closest(".encounter-advanced").classList.toggle("open");
      return;
    }
    const diffBtn = ev.target.closest(".difficulty-toggle-btn");
    if (diffBtn){
      const newDifficulty = diffBtn.dataset.difficulty;
      if (newDifficulty === activeDifficulty) return;
      activeDifficulty = newDifficulty;
      content.querySelectorAll(".difficulty-toggle-btn").forEach(b => b.classList.toggle("active", b.dataset.difficulty === activeDifficulty));
      document.getElementById("encounters-body").innerHTML = buildEncountersHtml(currentEncounters());
      renderSubnav();
    }
  });
})();
</script>
<script src="assets/your-clears.js"></script>
</body>
</html>
