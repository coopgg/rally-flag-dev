<p>Vesper's Host reuses the Scanner and Operator buffs from Deep Stone Crypt and adds a new one, Suppressor, layered with a nuke-carrying mechanic. If you already know Scanner-finds-it, Operator-shoots-it, you're most of the way to understanding this dungeon.</p>
<h2>Encounters</h2><div id="encounter-activation">1
<h3>Activation</h3>
<strong>Objective</strong> Use Scanner and Operator buffs to activate the correct panels in three separate rooms, releasing a nuclear core each time to carry back and deposit.
<strong>Roles</strong> One player carries Scanner to identify safe panels; one carries Operator to shoot them; everyone else clears enemies and helps carry nukes.
<ol><li>Interact with the sphere in the center to start, then defeat enemies until a carrier drops the Scanner buff.</li><li>Head down the hallway, clearing enemies, until another carrier drops the Operator buff.</li><li>Approach panels with Scanner active: if a panel disappears from your radar up close, it's dangerous and shouldn't be shot.</li><li>Have the Operator shoot the safe panels to spawn a nuclear core in a nearby bucket.</li><li>Carry the core back to the main room. It stacks a Radiation debuff the longer you hold it, so pass it to a teammate or drop it if you need to slow the stacking.</li><li>Defeat the Brig guarding the deposit point to remove its shield, then deposit the core.</li><li>Repeat this whole process two more times for a total of three cores.</li></ol>
<strong>What wipes you</strong> Radiation stacks kill you outright at ten, so don't be a hero carrying the nuke solo across the whole map. Pass it along or drop it to let the stacks decay.</div><div id="encounter-integration-nukes">2
<h3>Integration &amp; Nukes</h3>
<strong>Objective</strong> Open and close doors using a collected charge to find nukes hidden in a maze, then deposit them into numbered buckets in the correct order, all while avoiding the boss's wipe attack.
<strong>Roles</strong> No fixed roles. Move as a group and pass the nuke around to manage Radiation.
<ol><li>Collect a Power Reserves charge from Fallen terminals and use it to open or close doors in the maze.</li><li>Find the nuke matching the next numbered bucket and carry it there, passing it between teammates to keep Radiation stacks low.</li><li>Defeat the Captain that spawns after each deposit, which drops the next nuke you'll need.</li><li>Watch for Raneiks Unified roaming the halls: if it connects a beam to you, break line of sight immediately by ducking behind cover.</li><li>Repeat finding and depositing nukes in order until the encounter ends.</li></ol>
<strong>What wipes you</strong> Getting caught in Raneiks Unified's beam attack without breaking line of sight wipes the team, so always know where the nearest cover is while you're moving through the maze.</div><div id="encounter-raneiks-unified">3
<h3>Raneiks Unified</h3>
<strong>Objective</strong> Track two pairs of numbered Servitors across two trips upstairs, then shoot the matching panels below to force the boss to split apart for a timed damage phase.
<strong>Roles</strong> No fixed roles. Clear enemies together, then rotate through buff collection for the panel and damage sequence.
<ol><li>Clear enemies in the starting room, then defeat the tougher enemy that spawns to teleport the team upstairs.</li><li>Upstairs, clear the Shanks until a special one drops the Suppressor buff.</li><li>Use the Suppressor's grenade near the boss to spawn a decoy, then destroy the decoy to split the boss into individual Servitors.</li><li>Look for the two Servitors with extra lights on their face and remember their numbers.</li><li>Return downstairs and repeat the whole process to get two more numbers, for four total.</li><li>Grab the Operator buff and shoot the four panels matching the numbers you collected to start the damage phase.</li><li>Defeat the Suppressor Shank that spawns, use its buff on the boss again to split it, then unload damage. You only have 25 seconds before it reforms.</li><li>Repeat the whole cycle until it's dead.</li></ol>
<strong>What wipes you</strong> There's no instant wipe here, but mixing up which Servitor numbers you saw wastes an entire panel attempt, so confirm the numbers with your team before committing to the shot.</div><div id="encounter-corrupted-puppeteer">4
<h3>Corrupted Puppeteer</h3>
<strong>Objective</strong> Use all three buffs together (Suppressor, Scanner, and Operator) to identify and activate panels, deposit two nukes to strip the boss's shield, then finish it in a multi-stage damage phase.
<strong>Roles</strong> No fixed roles. Rotate through all three buffs as they're needed.
<ol><li>Defeat enemies to claim the Suppressor buff, then use it near a Broken Puppet and destroy its decoy to strip its immunity and clear its radiation field.</li><li>Defeat Broken Puppets to spawn carriers for the Scanner and Operator buffs, claiming both.</li><li>Have the Scanner check the four center panels to find the one correct panel, matched by a blue number.</li><li>The Operator shoots that panel, then find and shoot the matching blue number on panels elsewhere in the room.</li><li>Once the correct panels are lit, head down through the flashing red side to the lower area.</li><li>In the next room, the Operator activates all the panels, spawning boss copies. The Scanner checks each one, and any that turn white on the radar should be destroyed.</li><li>Defeat the correct copy to drop a nuke, then carry it to the bucket in that section.</li><li>Repeat this process in the connected room, then once two nukes are deposited, the boss's shield drops.</li><li>Take the elevator to the boss arena and begin the damage phase across the center and side platforms.</li><li>Look for the unique Broken Puppet during the fight: defeating it drops a nuke you can deposit in the left bunker while the boss is immune, extending your damage window.</li><li>Repeat until the boss is dead.</li></ol>
<strong>What wipes you</strong> Radiation stacks and the boss's lightning damage both punish standing still too long, so keep moving between panel duties instead of camping one spot.</div>

<script>
(function(){
  // Generated per-dungeon pages (dungeon-<slug>.html, tools/build-guide-pages.js)

  const slug = window.GUIDE_SLUG || new URLSearchParams(window.location.search).get("slug");
  const dungeon = window.DungeonsData.DUNGEONS.find(d => d.slug === slug);
  if (dungeon && !window.GUIDE_SLUG){
    location.replace(window.rallyFlagGuideHref("dungeon", dungeon.slug) + location.hash);
    return;
  }
  const content = document.getElementById("content");

  if (!dungeon){
    document.getElementById("dungeon-title").textContent = "Dungeon not found";
    content.innerHTML = '<div class="not-found panel-card block">Head back to <a href="dungeons.html">the dungeon list</a> and pick one from there.</div>';
    return;
  }

  document.title = dungeon.name + " Dungeon Guide - Rally Flag";
  document.getElementById("dungeon-title").textContent = dungeon.name;
  // Header sits over the dungeon's official art.
  if (dungeon.art){
    const hero = document.getElementById("hero");
    hero.classList.add("has-art");

  }


  function slugify(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function encounterAnchorId(e, i){
    return "encounter-" + (e.name ? slugify(e.name) : (i + 1));
  }

  const encounterSubnavEl = document.getElementById("encounter-subnav");
  if (dungeon.encounters.length){
    encounterSubnavEl.innerHTML = dungeon.encounters.map((e, i) =>
      '<a href="#' + encounterAnchorId(e, i) + '">' + e.name + '</a>'
    ).join("");
    encounterSubnavEl.addEventListener("click", (ev) => {
      const link = ev.target.closest("a");
      if (!link) return;
      const target = document.querySelector(link.getAttribute("href"));
      if (!target) return;
      ev.preventDefault();

      history.replaceState(null, "", link.getAttribute("href"));
    });

  const setsBySlug = {};

  const setLinksHtml = dungeon.armorSlugs.map(slug => {

  }).join("");
