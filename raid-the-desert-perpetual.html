<h1 id="raid-title">The Desert Perpetual</h1> <div id="raid-difficulty">Normal · Epic</div>
<a href="guides.html">Overview</a> <a href="raids.html">Raids</a> <a href="dungeons.html">Dungeons</a> <a href="public-events.html">Public Events</a>
<div id="encounter-subnav"><a href="#encounter-predestination">Predestination</a> <a href="#encounter-epoptes-lord-of-quanta">Epoptes, Lord of Quanta</a> <a href="#encounter-iatros-inward-tuned">Iatros, Inward-Tuned</a> <a href="#encounter-agraios-inherent">Agraios, Inherent</a> <a href="#encounter-keregos-the-worldline">Keregos, The Worldline</a></div></div> <section id="content">Overview
<p>The Desert Perpetual is built around a hub-and-spoke structure: you clear three boss encounters in whatever order you like before the final fight. Nearly everything in this raid runs on the same core loop: collect a resource called Chronons, bank them to buy time, and use buffs to reveal information only certain players can see.</p>
<h2>Encounters</h2>
<div id="encounters-body"><div id="encounter-predestination">1
<h3>Predestination</h3>
<strong>Objective</strong> Reach a central hub platform and pick which of the raid's three optional boss encounters to tackle first.
<strong>Roles</strong> No fixed roles, this is a traversal section.
<ol><li>Push through the opening area to reach a platform in the center with three interactive spheres.</li><li>Interact with whichever sphere corresponds to the boss you want to fight first. Each lights a path toward a different door.</li><li>Follow that path to reach the chosen encounter.</li><li>After finishing a boss encounter, you'll return to this hub to pick the next one.</li></ol>
<strong>What wipes you</strong> There's no wipe risk here. It's purely about choosing an order and getting your team there.</div><div id="encounter-epoptes-lord-of-quanta">2
<h3>Epoptes, Lord of Quanta</h3>
<strong>Objective</strong> Split into three groups to solve callouts across two side rooms and the main arena, unlocking the boss's shield before a rotating damage phase.
<strong>Roles</strong> Two pairs head into side rooms carrying a buff; two players hold the middle, clear enemies, and relay callouts.
<ol><li>Defeat the tough enemies that spawn to reveal two buff plates, and send a pair to each side room.</li><li>In each side room, watch for a lit symbol over your Hydra and call it to the other room — then shoot the shield-eye position your counterpart calls back to you, not the one you saw yourself. Repeat this cross-call-and-shoot four times total.</li><li>Meanwhile, the two players in the middle read a set of markers near the central pillar, call out which one is unlit, and the side room players shoot the matching orb in a triangle above their Hydra based on that callout.</li><li>Everyone regroups in the middle and clears enemies again, then the two buffed players head back into their side rooms a second time to finish the two remaining shield-eyes, followed by the large central eye on each Hydra.</li><li>With every side-room eye destroyed, return to the middle and shoot the matching eyes on the main boss's shield to start the damage phase.</li><li>During damage, the boss periodically pulls a new pair of players into its eye-beams to shoot fresh eyes and keep the phase going; everyone else just keeps unloading damage.</li></ol>
<strong>What wipes you</strong> Shield-eyes that aren't shot at nearly the same moment grow back and seal shut, almost always forcing a wipe. The whole encounter lives and dies on tight, simultaneous callouts between rooms.</div><div id="encounter-iatros-inward-tuned">3
<h3>Iatros, Inward-Tuned</h3>
<strong>Objective</strong> Defeat waves of enemies to bank a resource, use it to briefly empower a set of shooters, and reach a climbing plate for a damage phase, all before a shared timer runs out.
<strong>Roles</strong> A couple of players run add-clear and bank resources; a small team shoots targets together on cue; one player handles a platforming section.
<ol><li>Clear the first wave of enemies (Time's Burden Minotaurs) and collect the Chronons they drop, then deposit them through a glowing ring to start the clock.</li><li>Assign runners to keep killing enemies and banking Chronons throughout the fight to extend your time.</li><li>Send a player up a set of platforms while a couple of teammates wait at a nearby group of targets.</li><li>When the platforming player calls for it, the target-shooters fire at the same moment once they've built four stacks of Diastole. Timing matters more than aim here.</li><li>Repeat this across each set of platforms until all are complete, then regroup on the platforming player's position to deal damage.</li><li>Keep runners banking Chronons throughout the damage phase to avoid running out of time.</li></ol>
<strong>What wipes you</strong> Letting the hourglass run out of Chronons wipes the team. This fight is a speed test as much as anything, so don't let add-clear slip while people are focused on the shooting sequence.</div><div id="encounter-agraios-inherent">4
<h3>Agraios, Inherent</h3>
<strong>Objective</strong> Activate a set of portals using a collected resource, use callouts to determine which portals need charging, then use a temporary ability to block the boss's attack and force a damage phase.
<strong>Roles</strong> Three players hold the Absolute, Cyclical, and Constant Temporality buffs; the rest bank Chronons and charge portals based on callouts.
<ol><li>Defeat the enemies that spawn to collect Chronons, then walk them through the portals scattered around the arena to activate them.</li><li>Have three players grab the Absolute, Cyclical, and Constant Temporality buffs in the middle, then check which of several Hobgoblin snipers on the upper platforms matches their buff's name.</li><li>Whoever matches runs underneath that sniper's platform to lock in an alignment.</li><li>The other two buffed players call out which portals are marked, and the rest of the team charges those specific portals by running Chronons through them.</li><li>One unaligned player then runs through all the charged portals to gain a Detain grenade that can block the boss's Variable Elimination sniper shot.</li><li>Use that ability at the right moment to force the boss down for a damage phase, repeating the block-and-damage cycle a few times before it resets.</li></ol>
<strong>What wipes you</strong> Failing to block Variable Elimination in time can wipe exposed players. Missing the alignment or portal-charging steps just means restarting that phase, so don't rush past a callout you didn't fully catch.</div><div id="encounter-keregos-the-worldline">5
<h3>Keregos, The Worldline</h3>
<strong>Objective</strong> Manage buffs and callouts across a lower platform to bank a shared resource, then repeat a similar process on an upper platform to unlock and sustain a long damage phase.
<strong>Roles</strong> Players split by buff type to read hidden information about mines and a central ring below; above, three buffed players activate crystal pillars while others manage adds and additional resources.
<ol><li>On the lower platform, split into buff groups so different players can see the color of scattered mines, whether they're active, and the current color of a central ring.</li><li>Stand together on a marked plate to briefly gain the ability to compare that information, then have whoever can see the ring's color confirm and destroy whichever mine is both active and matching it.</li><li>Collect the Chronon it drops and repeat this multiple times to fill the hourglass, while a couple of players handle the boss's dangerous turrets in the background.</li><li>Once the hourglass is full, move up to the boss's upper platform.</li><li>Up top, the same three buff types each reveal different cubes at four separate pillars — the player who can see all of them interacts with whichever cube the other two both see, and repeating this across all four pillars exposes the boss's real weak points.</li><li>With the boss vulnerable, the team unloads damage while one player keeps banking Chronons through a ring to extend the fight, avoiding hazards on the ground and from above.</li></ol>
<strong>What wipes you</strong> Ignoring the boss's turrets or hazard zones during either phase gets people killed fast, and letting the shared resource run dry cuts your damage window short. This fight demands the most multitasking in the raid, so keep your assigned job simple and stick to it.</div></div>

  // Header sits over the raid's official art.
  if (raid.art){
    const hero = document.getElementById("hero");
    hero.classList.add("has-art");
    const tint = window.rallyFlagArtTint(raid.art); // its colour shows until the art loads
    hero.insertAdjacentHTML("afterbegin", '<div class="hero-art"' + (tint ? ' style="background-color:' + tint + '"' : "") + '><img src="' + window.rallyFlagArtUrl(raid.art) + '" alt="" fetchpriority="high"></div>');
  }
  document.getElementById("raid-difficulty").textContent = raid.difficulties ? raid.difficulties.join(" · ") : "";

  function slugify(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function encounterAnchorId(e, i){
    return "encounter-" + (e.name ? slugify(e.name) : (i + 1));
  }

  let activeDifficulty = "Normal";
  function currentEncounters(){
    return (activeDifficulty === "Epic" && raid.epicEncounters) ? raid.epicEncounters : raid.encounters;
  }

  const encounterSubnavEl = document.getElementById("encounter-subnav");
  function renderSubnav(){
    const encounters = currentEncounters();
    if (encounters.length){
      encounterSubnavEl.style.display = "";
      encounterSubnavEl.innerHTML = encounters.map((e, i) =>
        '<a href="#' + encounterAnchorId(e, i) + '">' + e.name + '</a>'
      ).join("");
    } else {
      encounterSubnavEl.style.display = "none";
    }
  }
  renderSubnav();
  encounterSubnavEl.addEventListener("click", (ev) => {
    const link = ev.target.closest("a");
    if (!link) return;
    const target = document.querySelector(link.getAttribute("href"));
    if (!target) return;
    ev.preventDefault();
    target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    history.replaceState(null, "", link.getAttribute("href"));
  });

  const setsBySlug = {};
  window.ArmorSetsData.SETS.forEach(s => setsBySlug[s.slug] = s);

  const setLinksHtml = raid.armorSlugs.map(slug => {
    const set = setsBySlug[slug];
    const label = set ? set.name : slug;
    return '<a class="set-link" href="armor-set-bonuses.html?highlight=' + slug + '">' + label + ' \u2192</a>';
  }).join("");

  function buildEncountersHtml(encounters){
    return encounters.length
    ? encounters.map((e, i) => {
        if (e.objective || e.steps){
          const hl = window.GameTerms.highlight;
          const stepsHtml = (e.steps || []).map(s => '<li>' + hl(s) + '</li>').join("");
          const mapHtml = e.mapImage
            ? '<div class="encounter-map"><img src="' + e.mapImage.url + '" alt="' + e.name + ' encounter map" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.mapImage.credit +
              (e.mapImage.creditUrl ? ' · <a href="' + e.mapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const secondaryMapHtml = e.secondaryMapImage
            ? '<div class="encounter-map"><img src="' + e.secondaryMapImage.url + '" alt="' + e.name + ' encounter map variant" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.secondaryMapImage.credit +
              (e.secondaryMapImage.creditUrl ? ' · <a href="' + e.secondaryMapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const strategyHtml = e.strategyImage
            ? '<div class="encounter-map"><img src="' + e.strategyImage.url + '" alt="' + e.name + ' strategy diagram" loading="lazy">' +
              (e.strategyImage.label ? '<div class="encounter-map-label">' + e.strategyImage.label + '</div>' : '') +
              '</div>'
            : '';
          const advancedHtml = (e.advancedTactics && e.advancedTactics.length)
            ? '<div class="encounter-advanced">' +
                '<button class="encounter-advanced-toggle" type="button"><span class="caret">\u25b8</span> Advanced tactic (optional)</button>' +
                '<div class="encounter-advanced-body">' +
                  e.advancedTactics.map(t => '<p>' + hl(t) + '</p>').join("") +
                '</div>' +
              '</div>'
            : '';
          const encounterPuzzleHelperHtml = e.puzzleHelper
            ? '<a class="block panel-card puzzle-helper-link encounter-puzzle-helper-link" href="puzzle-helper.html?tool=' + e.puzzleHelper.slug + '">' +
                '<div>' +
                  '<div class="puzzle-helper-link-title">' + e.puzzleHelper.title + '</div>' +
                  '<div class="puzzle-helper-link-sub">' + e.puzzleHelper.blurb + '</div>' +
                '</div>' +
                '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
              '</a>'
            : '';
          return '<div class="block panel-card encounter-card" id="' + encounterAnchorId(e, i) + '">' +
            '<div class="encounter-head"><div class="encounter-num">' + (i + 1) + '</div><h3 class="encounter-title">' + e.name + '</h3></div>' +
            (e.objective ? '<div class="encounter-field"><span class="encounter-field-label">Objective</span>' + hl(e.objective) + '</div>' : '') +
            (e.roles ? '<div class="encounter-field"><span class="encounter-field-label">Roles</span>' + hl(e.roles) + '</div>' : '') +
            mapHtml +
            secondaryMapHtml +
            strategyHtml +
            (stepsHtml ? '<ol class="encounter-steps">' + stepsHtml + '</ol>' : '') +
            (e.wipe ? '<div class="encounter-wipe"><span class="encounter-wipe-label">What wipes you</span>' + hl(e.wipe) + '</div>' : '') +
            (e.master ? '<div class="encounter-master"><span class="encounter-master-label">On Master</span>' + hl(e.master) + '</div>' : '') +
            advancedHtml +
            encounterPuzzleHelperHtml +
          '</div>';
        }
        // Fallback for older, simpler encounter entries
        return '<div class="block panel-card encounter-card encounter-row" id="' + encounterAnchorId(e, i) + '"><div class="encounter-num">' + (i + 1) + '</div>' +
          '<div><div class="encounter-name">' + e.name + '</div><div class="encounter-notes">' + (e.notes || "") + '</div></div></div>';
      }).join("")
    : '<div class="block panel-card"><div class="block-empty">Encounter notes coming soon.</div></div>';
  }

  const difficultyToggleHtml = raid.epicEncounters
    ? '<div class="difficulty-toggle" id="difficulty-toggle">' +
        '<button type="button" class="difficulty-toggle-btn active" data-difficulty="Normal">Normal</button>' +
        '<button type="button" class="difficulty-toggle-btn" data-difficulty="Epic">Epic</button>' +
      '</div>'
    : '';

  const puzzleHelperHtml = raid.puzzleHelper
    ? '<a class="block panel-card puzzle-helper-link" href="puzzle-helper.html?tool=' + raid.puzzleHelper.slug + '">' +
        '<div>' +
          '<div class="puzzle-helper-link-title">' + raid.puzzleHelper.title + '</div>' +
          '<div class="puzzle-helper-link-sub">' + raid.puzzleHelper.blurb + '</div>' +
        '</div>' +
        '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
      '</a>'
    : '';

  const raidMasterNoteHtml = (raid.difficulties && raid.difficulties.includes("Master"))
    ? '<div class="raid-master-note"><span class="raid-master-note-label">Master Difficulty</span>' +
        "Master raises enemies well above the raid's Normal Power level — expect a Power deficit unless you're specifically geared for it — and every hit lands harder across the board. Several encounters also add Champions (Barrier, Overload, or Unstoppable) that don't appear on Normal; check the callout under an affected encounter below for which ones and where." +
      '</div>'
    : '';

  content.innerHTML =
    '<div class="block panel-card">' +
      '<div class="block-label">Overview</div>' +
      (raid.summary ? '<p>' + raid.summary + '</p>' : '<div class="block-empty">Overview coming soon.</div>') +
      raidMasterNoteHtml +
    '</div>' +
    '<div class="block-label-row encounters-head"><h2 class="block-label">Encounters</h2>' + difficultyToggleHtml + '</div>' +
    '<div id="encounters-body">' + buildEncountersHtml(currentEncounters()) + '</div>' +
    puzzleHelperHtml +
    '<div class="block panel-card">' +
      '<div class="block-label">Armor Sets From This Raid</div>' +
      '<div class="set-links">' + setLinksHtml + '</div>' +
    '</div>';

  content.addEventListener("click", (ev) => {
    const advToggle = ev.target.closest(".encounter-advanced-toggle");
    if (advToggle){
      advToggle.closest(".encounter-advanced").classList.toggle("open");
      return;
    }
    const diffBtn = ev.target.closest(".difficulty-toggle-btn");
    if (diffBtn){
      const newDifficulty = diffBtn.dataset.difficulty;
      if (newDifficulty === activeDifficulty) return;
      activeDifficulty = newDifficulty;
      content.querySelectorAll(".difficulty-toggle-btn").forEach(b => b.classList.toggle("active", b.dataset.difficulty === activeDifficulty));
      document.getElementById("encounters-body").innerHTML = buildEncountersHtml(currentEncounters());
      renderSubnav();
    }
  });
})();
</script>
<script src="assets/your-clears.js"></script>
</body>
</html>
