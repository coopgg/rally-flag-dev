<script>/* Boot script: theme, light/dark mode, load guard. Generated from tools/boot-script.js; edit there and run node tools/sync-boot-script.js. */
(function(){
  var d = document.documentElement;
  // Valid saved themes; a first visit gets a random subclass (not Cosmic).
  var SUBCLASS_THEMES = ["solar", "void", "arc", "stasis", "strand", "prismatic"];
  var THEMES = SUBCLASS_THEMES.concat(["cosmic", "aurora", "eclipse"]);
  var theme = null, modePref = null, legacyMode = null;
  try {
    theme = localStorage.getItem("rallyflag_theme");
    if (THEMES.indexOf(theme) < 0){
      theme = SUBCLASS_THEMES[Math.floor(Math.random() * SUBCLASS_THEMES.length)];
      localStorage.setItem("rallyflag_theme", theme);
    }
    modePref = localStorage.getItem("rallyflag_mode_pref");
    legacyMode = localStorage.getItem("rallyflag_mode");
  } catch (e) {}
  if (THEMES.indexOf(theme) < 0) theme = SUBCLASS_THEMES[Math.floor(Math.random() * SUBCLASS_THEMES.length)];
  if (modePref !== "light" && modePref !== "dark"){
    modePref = legacyMode === "light" ? "light"
      : (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  }
  d.setAttribute("data-theme", theme);
  d.setAttribute("data-mode", modePref);

  d.classList.add("rf-boot");
  var reveal = function(){ d.classList.remove("rf-boot"); };
  document.addEventListener("DOMContentLoaded", function(){
    Promise.race([
      document.fonts ? document.fonts.ready : 0,
      new Promise(function(r){ setTimeout(r, 400); })
    ]).then(function(){ requestAnimationFrame(reveal); });
  });
  setTimeout(reveal, 2500);
})();
</script>

<style>
  /* Locker (dev-only preview, stage 1: read-only). Script: assets/locker.js */
  .locker-root{ max-width:1180px; margin:0 auto; padding:0 24px 90px; min-height:100vh; }
  .preview-tag{ display:inline-block; margin-left:8px; padding:2px 8px; border:1px solid var(--accent); border-radius:999px; color:var(--accent-text); font-size:12px; letter-spacing:0.08em; vertical-align:middle; }

  /* Status panels: signed out, loading, error, sample-data banner */
  .locker-panel{ max-width:640px; margin:32px auto 0; padding:26px; text-align:center; }
  .locker-panel p{ color:var(--text-dim); font-size:15px; max-width:52ch; margin:0 auto 16px; }
  .locker-panel p:last-child{ margin-bottom:0; }
  .locker-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:40px;
    font-family:'Oswald', sans-serif; font-weight:600; font-size:14px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--on-accent); background:var(--accent-fill); border:1px solid var(--accent-fill); border-radius:999px;
    padding:9px 20px; cursor:pointer; text-decoration:none;
  }
  .locker-btn.ghost{ color:var(--accent-text); background:transparent; border-color:var(--accent); }
  .locker-actions{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .locker-steps{ list-style:none; padding:0; margin:0 auto; max-width:46ch; text-align:left; color:var(--text-dim); font-size:14px; }
  .locker-steps li{ padding:4px 0 4px 22px; position:relative; }
  .locker-steps li::before{ content:"…"; position:absolute; left:0; color:var(--accent-text); }
  .locker-steps li.done::before{ content:"✓"; }
  .demo-banner{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 16px; margin:24px auto 0; padding:12px 18px; max-width:760px; font-size:14px; color:var(--text-dim); text-align:center; }

  /* Characters + vault: owner filter */
  /* Character + vault toggles: one row of four on wide screens, 2 × 2 on phones */
  .owner-grid{ display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); grid-auto-rows:1fr; gap:12px; margin-top:28px; }
  .owner-card{
    position:relative; display:flex; flex-direction:column; justify-content:flex-end; min-height:84px; padding:12px 14px;
    border-radius:12px; border:1px solid var(--edge); overflow:hidden; cursor:pointer; text-align:left;
    background-color:var(--panel); background-size:cover; background-position:left center; color:#fff;
    font:inherit; transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  /* Emblem art sits under a dark wash so the white text passes contrast in either mode. */
  .owner-card::before{ content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(5,8,16,0.86), rgba(5,8,16,0.55)); }
  .owner-card > *{ position:relative; }
  .owner-card[aria-pressed="true"]{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 0 22px -6px var(--glow); }
  .owner-card .owner-name{ font-family:'Oswald', sans-serif; font-weight:600; font-size:20px; letter-spacing:0.04em; text-transform:uppercase; }
  .owner-card .owner-meta{ font-size:13px; color:rgba(255,255,255,0.85); }
  .owner-card.vault{ background-image:none; background:linear-gradient(135deg, #0d1424, #1b2236); }

  /* Filters */
  .locker-controls{ margin-top:22px; display:flex; flex-direction:column; gap:12px; }
  .search-box input{
    width:100%; background:var(--panel); border:1px solid var(--panel-border); color:var(--text);
    font-family:var(--font-sans); font-size:15px; padding:13px 16px; border-radius:10px; outline:none;
  }
  .search-box input:focus{ border-color:var(--accent); }
  .search-box input::placeholder{ color:var(--text-dimmer); }
  .chip-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .chip{
    font-family:var(--font-sans); font-size:13px; font-weight:500; color:var(--text-dim);
    background:var(--panel); border:1px solid var(--panel-border); padding:7px 14px; border-radius:999px; cursor:pointer;
    transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover{ color:var(--text); }
  .chip[aria-pressed="true"]{ color:var(--on-accent); background:var(--accent-fill); border-color:var(--accent-fill); font-weight:600; }
  .chip-sep{ width:1px; height:22px; background:var(--panel-border); margin:0 4px; }
  .locker-count{ font-size:13px; color:var(--text-dim); margin-left:auto; }

  /* Armor set progress */
  /* Gear | Armor Sets views */
  .view-tabs{ display:flex; gap:4px; margin-top:22px; border-bottom:1px solid var(--panel-border); }
  .view-tab{
    font-family:'Oswald', sans-serif; font-weight:600; font-size:15px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--text-dim); background:none; border:0; border-bottom:2px solid transparent; margin-bottom:-1px;
    padding:10px 14px; cursor:pointer;
  }
  .view-tab:hover{ color:var(--text); }
  .view-tab[aria-selected="true"]{ color:var(--accent-text); border-bottom-color:var(--accent); }
  .view-tab span{ font-family:var(--font-sans); font-weight:500; font-size:13px; letter-spacing:0; color:var(--text-dim); margin-left:4px; }
  .sets-intro{ margin:20px 0 0; font-size:14px; color:var(--text-dim); }
  .set-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); grid-auto-rows:1fr; gap:12px; margin-top:14px; }
  .set-card{ padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
  .set-card-name{ font-family:'Oswald', sans-serif; font-weight:600; font-size:16px; color:var(--text); line-height:1.25; }
  .set-card-class{ font-size:13px; color:var(--text-dim); }
  .set-pips{ display:flex; gap:5px; }
  .set-pip{ flex:1; height:6px; border-radius:3px; background:var(--panel-border); }
  .set-pip.on{ background:var(--accent-fill); box-shadow:0 0 8px -2px var(--glow); }
  .set-card-status{ font-size:13px; color:var(--accent-text); font-weight:600; margin-top:auto; }
  .set-card a{ font-size:13px; color:var(--accent-text); }

  /* Gear by slot */
  .bucket{ margin-top:30px; }
  .bucket h2{ font-family:'Oswald', sans-serif; font-weight:600; font-size:17px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text); margin:0 0 12px; display:flex; align-items:baseline; gap:10px; }
  .bucket h2 span{ font-family:var(--font-sans); font-weight:500; font-size:13px; letter-spacing:0; text-transform:none; color:var(--text-dim); }
  /* --tile: item size. Phones fill the row like DIM: equipped + 4 inventory. */
  .locker-root{ --tile:64px; --tile-gap:8px; --bar:17px; }
  .item-grid{ display:grid; grid-template-columns:repeat(auto-fill, var(--tile)); gap:var(--tile-gap); }
  .item-tile{
    position:relative; width:var(--tile); height:var(--tile); padding:0; border-radius:6px; overflow:hidden; cursor:pointer;
    border:2px solid #4f3a72; background:#1a1f2b; transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .item-tile.tier-6{ border-color:#c9a227; }
  .item-tile:hover, .item-tile:focus-visible{ transform:translateY(-2px); box-shadow:0 6px 18px -6px var(--glow); }
  .item-tile:focus-visible{ outline:2px solid var(--accent-text); outline-offset:2px; }
  .item-tile.equipped{ box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
  .item-tile img.icon, .item-tile img.wm, .item-tile img.ov{ position:absolute; inset:0; width:100%; height:100%; }
  /* Masterworked: Bungie's gold frame (img.ov) plus a gold power bar, as DIM does */
  .item-tile.mw .tile-power{ background:#e2bf4f; color:#1b1500; }
  /* Centred in the watermark's dark band (14% across, as Bungie draws its
     own pips), from under the season icon to just above the power bar */
  .tier-pips{ position:absolute; left:8.6%; top:28%; width:11%; height:calc(72% - var(--bar) - 2px); /* % of the tile's inside */ overflow:visible; fill:#f5d65a; stroke:rgba(0,0,0,0.8); stroke-width:1.2; paint-order:stroke; }
  .tile-power{ position:absolute; left:0; right:0; bottom:0; height:var(--bar); padding:0 4px; font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:700; line-height:var(--bar); text-align:right; color:#fff; background:rgba(0,0,0,0.78); }
  .tile-power img{ width:12px; height:12px; float:left; margin-top:2px; }
  .tile-badge{ position:absolute; top:2px; right:2px; min-width:18px; height:18px; padding:0 3px; border-radius:9px; font-size:12px; font-weight:700; line-height:18px; text-align:center; color:#111; background:#ffd76a; box-shadow:0 0 0 1px rgba(0,0,0,0.5); }
  .locker-empty{ margin-top:30px; text-align:center; color:var(--text-dim); }
  /* One owner at a time: a character's slot is the equipped item, a
     dashed divider, then the inventory; weapons and armor side by side on
     wide screens. */
  .slot-cols{ display:grid; gap:0 40px; }
  @media (min-width:900px){ .slot-cols{ grid-auto-flow:column; grid-auto-columns:minmax(0, 1fr); } }
  .char-slot{ display:flex; align-items:flex-start; gap:14px; }
  .slot-equipped{ flex:none; padding-right:14px; border-right:1px dashed var(--panel-border); }
  .slot-inv{ flex:1; min-width:0; }
  .tile-empty{ display:block; width:var(--tile); height:var(--tile); border:2px dashed var(--panel-border); border-radius:6px; }
  .slot-count.full::after{ content:" · full"; color:#e5534b; }
  [data-mode="light"] .slot-count.full::after{ color:#b42318; }
  .sr-only{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  .group-label{ font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px; }
  .slot-body[hidden]{ display:none !important; } /* a folded slot */
  /* Folding: slot headings are toggles; long vault lists show two rows */
  .bucket h2{ margin:0 0 12px; }
  .bucket.folded h2{ margin-bottom:0; }
  .bucket-toggle{ display:flex; align-items:baseline; gap:10px; padding:0; border:0; background:none; color:inherit; font:inherit; letter-spacing:inherit; text-transform:inherit; cursor:pointer; }
  .bucket-toggle span:not(.chev){ font-family:var(--font-sans); font-weight:500; font-size:13px; letter-spacing:0; text-transform:none; color:var(--text-dim); }
  .bucket-toggle .chev{ width:8px; height:8px; border-right:2px solid var(--accent-text); border-bottom:2px solid var(--accent-text); transform:rotate(45deg) translate(-2px, -2px); transition:transform 0.15s ease; align-self:center; }
  .bucket.folded .bucket-toggle .chev{ transform:rotate(-45deg); }
  .bucket-toggle:hover{ color:var(--accent-text); }
  .owner-group.clipped .item-tile:nth-child(n+13){ display:none; }
  .vault-more, .fold-all{ margin-top:8px; padding:4px 0; border:0; background:none; color:var(--accent-text); font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  .fold-all{ margin-top:0; }
  .group-empty{ color:var(--text-dim); font-size:13px; }

  /* Item details. Same reading order as DIM's popup (header, stats,
     frame, perk columns, mods) so DIM players feel at home, drawn in
     Rally Flag's HUD style: rarity edge + glow, mono section labels,
     segmented stat bars, our recoil compass, theme-coloured selection
     and the Rally Flag diamond on our God Roll perks. */
  :root{ --tier-5:#7b4fb8; --tier-6:#d9b33c; --tier-5-text:#c4a3f2; --tier-6-text:#e8c65c; }
  [data-mode="light"]{ --tier-5-text:#5d3592; --tier-6-text:#715500; }
  dialog.item-dialog{
    width:min(460px, calc(100vw - 24px)); max-height:calc(100vh - 40px); padding:0; border-radius:14px; overflow:hidden;
    border:1px solid var(--edge); background:var(--bg); color:var(--text); box-shadow:0 30px 80px -20px rgba(0,0,0,0.7), 0 0 40px -18px var(--glow);
  }
  dialog.item-dialog[open]{ display:flex; flex-direction:column; }
  dialog.item-dialog::backdrop{ background:rgba(4,6,12,0.7); }
  .dlg-head{
    --tier:var(--tier-5); --tier-text:var(--tier-5-text);
    position:relative; display:flex; gap:14px; align-items:center; padding:14px 14px 14px 18px;
    background:radial-gradient(ellipse 70% 120% at 100% 0%, color-mix(in srgb, var(--tier) 30%, transparent), transparent 70%), var(--panel);
    border-bottom:1px solid color-mix(in srgb, var(--tier) 45%, var(--panel-border));
  }
  .dlg-head.tier-6{ --tier:var(--tier-6); --tier-text:var(--tier-6-text); }
  .dlg-head::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--tier); box-shadow:0 0 14px var(--tier); }
  .dlg-icon{ position:relative; width:56px; height:56px; flex-shrink:0; border-radius:6px; overflow:hidden; box-shadow:0 0 0 1px var(--tier), 0 0 16px -4px var(--tier); }
  .dlg-icon img{ position:absolute; inset:0; width:100%; height:100%; }
  .dlg-title{ flex:1; min-width:0; }
  .dlg-eyebrow{ font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--tier-text); }
  .dlg-name{ font-family:'Oswald', sans-serif; font-weight:600; font-size:23px; line-height:1.1; letter-spacing:0.02em; margin:2px 0 0; }
  .dlg-sub{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; margin-top:4px; font-size:13px; color:var(--text-dim); }
  .dlg-sub img{ width:14px; height:14px; vertical-align:-2px; margin-right:3px; }
  .dlg-sub .flag{ padding:0 7px; border:1px solid var(--panel-border); border-radius:999px; font-size:12px; line-height:18px; }
  .dlg-power{ text-align:right; }
  .dlg-power small{ display:block; font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.08em; color:var(--text-dim); }
  .dlg-power b{ font-family:'JetBrains Mono', monospace; font-size:22px; color:var(--text); }
  .dlg-close{ position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:8px; border:1px solid var(--panel-border); background:var(--bg); color:var(--text-dim); font-size:17px; line-height:1; cursor:pointer; }
  .dlg-head{ padding-right:46px; }
  .dlg-body{ padding:4px 16px 16px; overflow-y:auto; }
  .dlg-block{ padding:12px 0 0; }
  .dlg-label{ font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent-text); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .dlg-label::after{ content:""; flex:1; height:1px; background:var(--panel-border); }
  /* Rally Flag notes: our God Roll, set progress */
  .rf-notes{ display:flex; flex-direction:column; gap:6px; }
  .callout{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; padding:8px 10px 8px 28px; position:relative; border-radius:8px; border:1px solid var(--edge); background:var(--accent-dim); font-size:13.5px; }
  .callout::before{ content:""; position:absolute; left:10px; top:50%; width:9px; height:9px; margin-top:-4.5px; background:var(--accent); clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%); box-shadow:0 0 10px var(--glow); }
  .callout.godroll::before{ background:#ffd76a; }
  .callout a{ color:var(--accent-text); font-weight:600; margin-left:auto; }
  .callout .muted{ color:var(--text-dim); }
  /* Stats: label | value | segmented bar (or the recoil compass) */
  .stat-row{ display:grid; grid-template-columns:112px 34px 1fr; align-items:center; gap:10px; font-size:13px; line-height:21px; }
  .stat-row span{ color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat-row b{ font-family:'JetBrains Mono', monospace; font-weight:600; color:var(--text); text-align:right; }
  .stat-bar{ position:relative; height:8px; background:var(--panel-border); }
  .stat-bar i{ display:block; height:100%; background:var(--accent-fill); box-shadow:0 0 8px -2px var(--glow); }
  .stat-bar::after{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--bg) calc(10% - 2px) 10%); }
  .recoil-compass{ width:48px; height:24px; display:block; }
  .recoil-compass .dial{ fill:color-mix(in srgb, var(--text) 16%, transparent); }
  .recoil-compass .spread{ fill:var(--accent-fill); }
  .recoil-compass line.spread{ stroke:var(--accent-fill); }
  /* Frame / archetype */
  .intrinsic{ display:flex; align-items:center; gap:12px; }
  .intrinsic img{ width:42px; height:42px; border-radius:8px; background:#2a3142; box-shadow:0 0 0 1px var(--edge); }
  .intrinsic b{ display:block; font-size:14.5px; font-weight:600; }
  .intrinsic small{ font-size:13px; color:var(--text-dim); }
  /* Perks: one column per socket; the perk on this copy on top */
  .perk-cols{ display:flex; gap:4px; }
  .perk-col{ display:flex; flex-direction:column; align-items:center; gap:7px; padding:2px 7px; }
  .perk-col + .perk-col{ border-left:1px dashed var(--panel-border); }
  .perk-dot{ position:relative; width:44px; height:44px; padding:0; border-radius:50%; cursor:pointer; border:2px solid transparent; background:#1d2333; }
  .perk-dot img{ width:100%; height:100%; border-radius:50%; display:block; }
  .perk-dot.sel{ border-color:var(--accent); box-shadow:0 0 12px -2px var(--glow); }
  .perk-dot.alt{ opacity:0.62; border-color:var(--panel-border); }
  .perk-dot:hover, .perk-dot[aria-pressed="true"]{ opacity:1; }
  .perk-dot[aria-pressed="true"]{ outline:2px solid var(--accent-text); outline-offset:2px; }
  .perk-dot .ours{ position:absolute; top:-4px; right:-4px; width:15px; height:15px; background:#ffd76a; clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%); filter:drop-shadow(0 0 3px rgba(255,215,106,0.8)); }
  .mod-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .mod-sq{ width:44px; height:44px; padding:0; border-radius:8px; border:1px solid var(--edge); background:#1d2333; cursor:pointer; overflow:hidden; }
  .mod-sq img{ width:100%; height:100%; display:block; }
  .mod-sq[aria-pressed="true"]{ outline:2px solid var(--accent-text); outline-offset:2px; }
  .plug-info{ margin-top:12px; padding:9px 11px; border-radius:8px; border:1px solid var(--panel-border); background:var(--panel); font-size:13.5px; color:var(--text-dim); }
  .plug-info b{ color:var(--text); }

  /* Stage 2: actions in the item popup */
  .dlg-actions{ display:flex; flex-direction:column; gap:8px; padding:10px 16px; border-bottom:1px solid var(--panel-border); background:var(--panel); }
  .act-row{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .act-label{ width:50px; font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); }
  .act-btn{
    display:inline-flex; align-items:center; gap:6px; min-height:32px; padding:4px 11px 4px 5px; border-radius:999px;
    border:1px solid var(--edge); background:var(--bg); color:var(--text); font:inherit; font-size:13px; font-weight:500; cursor:pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .act-btn img{ width:20px; height:20px; border-radius:50%; }
  .act-btn:hover{ border-color:var(--accent); box-shadow:0 0 12px -4px var(--glow); }
  .act-btn.current{ color:var(--text-dim); border-style:dashed; cursor:default; box-shadow:none; }
  .act-btn.lock{ margin-left:auto; padding-left:11px; }
  .act-btn.lock[aria-pressed="true"]{ color:var(--on-accent); background:var(--accent-fill); border-color:var(--accent-fill); }
  body.locker-busy .act-btn, body.locker-busy .pm-all{ border-style:dashed; cursor:progress; } /* no fade: text keeps its contrast */
  /* Status messages */
  .locker-toast{
    position:fixed; left:50%; bottom:20px; z-index:1000; max-width:min(520px, calc(100vw - 32px)); transform:translate(-50%, 20px);
    padding:10px 16px 10px 32px; border-radius:10px; border:1px solid var(--edge); background:var(--bg); color:var(--text);
    font-size:14px; box-shadow:0 14px 40px -12px rgba(0,0,0,0.6), 0 0 22px -10px var(--glow); opacity:0; pointer-events:none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .locker-toast::before{ content:""; position:absolute; left:12px; top:50%; width:9px; height:9px; margin-top:-4.5px; background:var(--accent); clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .locker-toast.show{ opacity:1; transform:translate(-50%, 0); }
  .locker-toast.has-action{ pointer-events:auto; }
  .toast-code{ display:block; margin-top:4px; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-dim); }
  .toast-action{ display:block; margin-top:8px; padding:6px 14px; border-radius:999px; border:1px solid var(--accent-fill); background:var(--accent-fill); color:var(--on-accent); font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  .locker-toast.error{ border-color:#d9534f; }
  .locker-toast.error::before{ background:#e5534b; }
  .locker-toast.busy::before{ animation:toast-pulse 0.9s ease-in-out infinite alternate; }
  @keyframes toast-pulse{ from{ opacity:0.3; } to{ opacity:1; } }
  /* Postmaster */
  /* Postmaster: one slim bar; tiles only when opened */
  .bucket.postmaster{ margin-top:24px; padding:8px 12px; border-radius:12px; border:1px solid var(--edge); background:var(--panel); }
  .pm-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
  .bucket.postmaster h2{ margin:0; font-size:15px; }
  .pm-chip{ display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); }
  .pm-chip.nearly-full{ color:var(--text); font-weight:600; }
  .pm-chip.nearly-full > span:first-child::before{ content:""; display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:50%; background:#e5534b; box-shadow:0 0 8px #e5534b; }
  .bucket.postmaster:has(.nearly-full){ border-color:#d9534f; }
  .pm-all{ padding:3px 10px; border-radius:999px; border:1px solid var(--accent); background:none; color:var(--accent-text); font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.04em; cursor:pointer; }
  .pm-all:hover{ background:var(--accent-dim); }
  .pm-body{ display:flex; flex-wrap:wrap; gap:10px 24px; margin-top:10px; }
  .pm-body[hidden]{ display:none; }
  .pm-group{ flex:1 1 280px; min-width:0; }
  .pm-grid{ grid-template-columns:repeat(auto-fill, 44px) !important; gap:6px !important; }
  .pm-grid .item-tile{ width:44px !important; height:44px !important; border-width:1px; }
  .pm-tile:not(.tier-5):not(.tier-6){ border-color:var(--panel-border); }
  /* Tags */
  .tile-badges{ position:absolute; top:2px; right:2px; display:flex; gap:2px; }
  .tile-badges .tile-badge{ position:static; }
  .tile-badge.fav{ background:#ff8fb1; }
  .tile-badge.junk{ background:#c9ced8; display:flex; align-items:center; justify-content:center; }
  .tile-badge.junk .ico{ width:12px; height:12px; stroke-width:2.4; }
  .ico{ flex-shrink:0; vertical-align:-3px; }
  .chip .ico{ vertical-align:-2px; }
  .act-btn .ico{ width:16px; height:16px; }
  .act-btn.icon-only{ width:36px; padding:0; justify-content:center; }
  /* Farming mode */
  .farm-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin-top:12px; }
  .farm-label{ font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); }
  .farm-btn{ padding:5px 12px; border-radius:999px; border:1px solid var(--panel-border); background:var(--panel); color:var(--text-dim); font:inherit; font-size:13px; cursor:pointer; }
  .farm-btn[aria-pressed="true"]{ color:var(--on-accent); background:var(--accent-fill); border-color:var(--accent-fill); font-weight:600; box-shadow:0 0 14px -4px var(--glow); }
  .farm-row .farm-btn[aria-pressed="true"]::before{ content:""; display:inline-block; width:7px; height:7px; margin-right:6px; border-radius:50%; background:currentColor; animation:toast-pulse 0.9s ease-in-out infinite alternate; }
  .farm-note{ font-size:13px; color:var(--text-dim); }
  #junk-row{ margin-top:8px; }
  .junk-btn{ display:inline-flex; align-items:center; gap:6px; color:var(--text); }
  .junk-btn .ico{ width:14px; height:14px; }
  /* Character columns: equipped on its own row, then the inventory */
  .item-tile.tag-junk img.icon{ filter:grayscale(1) brightness(0.55); }
  .act-btn.tag{ padding-left:11px; }
  .act-btn.tag[aria-pressed="true"]{ color:var(--on-accent); background:var(--accent-fill); border-color:var(--accent-fill); }
  /* Drag and drop */
  .item-tile[draggable="true"]{ cursor:grab; }
  .owner-card.drop-target{ outline:2px dashed var(--accent); outline-offset:3px; }
  .drop-bar{ position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:50; display:flex; align-items:center; gap:8px; padding:8px; border-radius:12px;
    border:1px solid var(--edge); background:var(--bg); box-shadow:0 14px 40px -12px rgba(0,0,0,0.6), 0 0 24px -10px var(--glow); }
  .drop-bar[hidden]{ display:none; }
  .drop-label{ padding:0 6px; font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); }
  .drop-slot{ min-width:96px; padding:14px 16px; border-radius:8px; border:2px dashed var(--panel-border); text-align:center; font-weight:600; font-size:14px; color:var(--text); }
  .drop-slot.drop-target{ border-color:var(--accent); background:var(--accent-dim); }
  @media (max-width:640px){
    .locker-root{ padding:0 16px 80px; }
    .owner-grid{ grid-template-columns:repeat(2, 1fr); gap:8px; }
    .owner-card{ min-height:70px; padding:10px 12px; }
    .owner-card .owner-name{ font-size:17px; }
    /* 5 across: 32px page gutters, 17px for the equipped divider, 4 gaps */
    .locker-root{ --tile-gap:6px; --bar:19px; --tile:clamp(56px, calc((100vw - 32px - 17px - 4 * 6px) / 5), 84px); }
    .char-slot{ gap:8px; }
    .slot-equipped{ padding-right:8px; }
    .tile-power{ font-size:13px; }
    .locker-count{ margin-left:0; width:auto; flex:1; }
    .owner-group.clipped .item-tile:nth-child(n+11){ display:none; }
    .act-label{ width:100%; }
    .act-btn.lock{ margin-left:0; }
    /* Bottom sheet on phones, like DIM */
    dialog.item-dialog{ width:100%; max-width:100%; max-height:88vh; margin:auto 0 0; border-radius:14px 14px 0 0; border-bottom:0; }
    .stat-row{ grid-template-columns:100px 32px 1fr; }
  }
</style>
</head>
