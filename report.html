<script>/* Boot script: theme, light/dark mode, load guard. Generated from tools/boot-script.js; edit there and run node tools/sync-boot-script.js. */
(function(){
  var d = document.documentElement;
  // Valid saved themes; a first visit gets a random subclass (not Cosmic).
  var SUBCLASS_THEMES = ["solar", "void", "arc", "stasis", "strand", "prismatic"];
  var THEMES = SUBCLASS_THEMES.concat(["cosmic", "aurora", "eclipse"]);
  var theme = null, modePref = null, legacyMode = null;
  try {
    theme = localStorage.getItem("rallyflag_theme");
    if (THEMES.indexOf(theme) < 0){
      theme = SUBCLASS_THEMES[Math.floor(Math.random() * SUBCLASS_THEMES.length)];
      localStorage.setItem("rallyflag_theme", theme);
    }
    modePref = localStorage.getItem("rallyflag_mode_pref");
    legacyMode = localStorage.getItem("rallyflag_mode");
  } catch (e) {}
  if (THEMES.indexOf(theme) < 0) theme = SUBCLASS_THEMES[Math.floor(Math.random() * SUBCLASS_THEMES.length)];
  if (modePref !== "light" && modePref !== "dark"){
    modePref = legacyMode === "light" ? "light"
      : (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  }
  d.setAttribute("data-theme", theme);
  d.setAttribute("data-mode", modePref);

  d.classList.add("rf-boot");
  var reveal = function(){ d.classList.remove("rf-boot"); };
  document.addEventListener("DOMContentLoaded", function(){
    Promise.race([
      document.fonts ? document.fonts.ready : 0,
      new Promise(function(r){ setTimeout(r, 400); })
    ]).then(function(){ requestAnimationFrame(reveal); });
  });
  setTimeout(reveal, 2500);
})();
</script>

<style>
  /* Raid & Dungeon Report. Script: assets/report.js. The cards are the
     Raids/Dungeons pages' activity cards (same art, name, layout). */
  .rr-wrap{ max-width:1000px; margin:28px auto 0; padding:0 24px 90px; min-height:60vh; }
  .rr-form{ display:flex; gap:10px; }
  .rr-form input{ flex:1; min-width:0; background:var(--panel); border:1px solid var(--panel-border); color:var(--text); font-family:var(--font-sans); font-size:15px; padding:13px 16px; border-radius:10px; outline:none; transition:border-color 0.2s ease; }
  .rr-form input:focus{ border-color:var(--accent); }
  .rr-form input::placeholder{ color:var(--text-dimmer); }
  .rr-btn{ display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:6px 18px; border-radius:10px; border:1px solid var(--accent-fill); background:var(--accent-fill); color:var(--on-accent); font:inherit; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .rr-btn.ghost{ background:transparent; color:var(--accent-text); border-color:var(--edge); }
  .rr-btn[hidden]{ display:none; }
  .rr-suggest, .rr-recent{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; list-style:none; margin:10px 0 0; padding:0; }
  .rr-suggest[hidden]{ display:none; }
  .rr-recent-label{ font-size:12.5px; color:var(--text-dim); margin-right:2px; }
  .rr-chip{ min-height:32px; padding:4px 12px; border-radius:999px; border:1px solid var(--edge); background:transparent; color:var(--text-dim); font:inherit; font-size:13px; font-weight:500; cursor:pointer; }
  .rr-chip:hover, .rr-chip:focus-visible{ color:var(--text); border-color:var(--accent); }
  .rr-status{ margin:22px 0 0; padding:12px 16px; border:1px solid var(--panel-border); border-radius:10px; background:var(--panel); color:var(--text-dim); font-size:14px; }
  .rr-status.error{ border-color:var(--accent-text); color:var(--text); }

  /* The player: their emblem as the banner. */
  .rr-player{ position:relative; display:flex; flex-wrap:wrap; align-items:center; gap:14px 28px; margin-top:24px; padding:22px; overflow:clip; isolation:isolate; }
  /* The emblem at its own size (Bungie's are 474×96) in the top-left corner,
     fading out to the right, so it never stretches or sits under the numbers. */
  /* The emblem as the banner's left edge: its icon square (left 96px) shown
     whole and sharp next to the name, the rest fading out. */
  .rr-emblem{ position:absolute; top:0; left:0; z-index:-1; width:474px; max-width:100%; height:96px; object-fit:cover; object-position:left center; opacity:0.5;
    -webkit-mask-image:linear-gradient(90deg, #000 20%, transparent 60%); mask-image:linear-gradient(90deg, #000 20%, transparent 60%); }
  .rr-player:has(.rr-emblem) .rr-who{ padding-left:96px; min-height:52px; }
  @media (max-width:640px){ .rr-player:has(.rr-emblem) .rr-who{ padding-left:84px; } .rr-emblem{ height:84px; width:415px; } }
  .rr-who{ min-width:0; flex:1 1 220px; }
  .rr-who h2{ margin:0; font-family:'Oswald', sans-serif; font-weight:600; font-size:28px; line-height:1.15; color:var(--text); overflow-wrap:anywhere; }
  .rr-links{ margin:4px 0 0; font-size:13px; color:var(--text-dim); }
  .rr-links a{ color:var(--accent-text); }
  .rr-chars{ margin:4px 0 0; font-size:13.5px; color:var(--text-dim); }
  .rr-totals{ display:flex; flex-wrap:wrap; gap:10px 28px; margin:0; }
  .rr-totals dt, .rr-meta dt{ font-size:12px; color:var(--text-dim); }
  .rr-totals dd{ margin:2px 0 0; font-family:'Oswald', sans-serif; font-weight:600; font-size:24px; color:var(--text); font-variant-numeric:tabular-nums; }
  .rr-copy{ min-height:36px; font-size:13px; padding:4px 14px; background:transparent; color:var(--accent-text); border-color:var(--edge); }

  .rr-h{ margin:36px 0 14px; font-family:'Oswald', sans-serif; font-weight:600; font-size:20px; letter-spacing:0.04em; text-transform:uppercase; color:var(--text); }
  /* The Raids/Dungeons pages' card grid and cards. */
  /* Three wide cards a row (two on tablets, one on phones, as raid.report). */
  .activity-grid{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); grid-auto-rows:1fr; gap:16px; }
  @media (max-width:900px){ .activity-grid{ grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  .activity-card{ display:flex; flex-direction:column; text-decoration:none; padding:22px 22px 20px; overflow:hidden; transition: border-color 0.2s ease, background 0.2s ease; }
  .activity-card:hover, .activity-card:focus-visible{ border-color:var(--accent); background:var(--accent-dim); }
  .activity-card .art-thumb{ margin:0; }
  /* The art, then a bar of badges under it (right-aligned, as raid.report),
     kept at one row's height even when empty so every card lines up. */
  .rr-art{ position:relative; margin:-22px -22px 12px; }
  .activity-name{ font-family:'Oswald', sans-serif; font-weight:600; font-size:18px; color:var(--text); margin-bottom:6px; }
  .activity-arrow{ margin-top:auto; padding-top:10px; font-size:12px; color:var(--accent-bright); font-family:'JetBrains Mono', monospace; }
  .rr-clears{ font-size:14px; color:var(--text-dim); }
  .rr-clears b{ font-family:'Oswald', sans-serif; font-weight:600; font-size:30px; line-height:1; color:var(--accent-text); font-variant-numeric:tabular-nums; margin-right:2px; }
  .rr-meta{ display:flex; gap:18px; margin:10px 0 0; }
  .rr-meta dd{ margin:1px 0 0; font-size:14px; font-weight:600; color:var(--text); font-variant-numeric:tabular-nums; }
  .rr-line{ margin:8px 0 0; font-size:12.5px; color:var(--text-dim); line-height:1.45; }
  /* Two lines kept for every card (some dungeons list five versions), so cards line up. */
  .rr-card .rr-line{ min-height:calc(2 * 1.45em); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .rr-badges{ display:flex; flex-wrap:wrap; justify-content:flex-end; align-content:flex-start; gap:4px; min-height:34px; padding:6px 10px;
    border-bottom:1px solid var(--edge); }
  .rr-badges:empty{ border-bottom-color:transparent; }
  .rr-badge{ padding:2px 8px; border-radius:4px; background:var(--accent-fill); color:var(--on-accent); font-size:12px; font-weight:600; line-height:18px; white-space:nowrap; }
  .rr-badge.gold{ background:#8a6a00; color:#fff; box-shadow:inset 0 0 0 1px #e6c34a; }
  .rr-sherpa{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; margin:4px 0 0; font-size:13.5px; color:var(--text-dim); }
  .rr-sherpa:empty{ display:none; }
  .rr-sherpa p{ margin:0; flex:1 1 320px; max-width:75ch; }
  .rr-sherpa .rr-btn{ min-height:36px; font-size:13px; padding:4px 14px; }
  .rr-progress{ margin:12px 0 0; font-size:13px; color:var(--text-dim); min-height:1.4em; }
  .rr-card.none .art-thumb img{ filter:grayscale(0.85); opacity:0.6; }
  .rr-card.none .rr-clears b{ color:var(--text-dim); }
  .rr-retired{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px 22px; font-size:14px; color:var(--text-dim); }
  .rr-retired b{ color:var(--text); font-weight:600; }
  .rr-note{ margin:30px 0 0; max-width:75ch; font-size:13px; color:var(--text-dim); }
  @media (max-width:640px){
    .rr-wrap{ padding:0 16px 70px; }
    .rr-form{ flex-wrap:wrap; }
    .rr-form input{ flex:1 0 100%; }
    .rr-btn{ flex:1; }
    .activity-grid{ grid-template-columns:minmax(0, 1fr); gap:12px; }
    .activity-card{ padding:14px 14px 14px; }
    .rr-art{ margin:-14px -14px 10px; }
    .rr-badges{ padding:5px 7px; gap:3px; min-height:31px; }
    .rr-badge{ font-size:12px; padding:1px 6px; }
    .activity-name{ font-size:16px; }
  }
</style>
</head>
