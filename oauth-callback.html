<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing in… - Rally Flag</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .callback-wrap{
    min-height:60vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:24px; gap:10px;
  }
  .callback-status{ font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--text-dim); }
  .callback-error{ color:#ff8080; max-width:480px; }
  .callback-link{ color:var(--accent-bright); text-decoration:none; margin-top:16px; }
  .callback-summary{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-dim);
    text-align:left; background:var(--panel); border:1px solid var(--panel-border);
    border-radius:8px; padding:16px 18px; margin-top:6px; max-width:420px; line-height:1.7;
  }
  .callback-summary .ok{ color:#7fd9a0; }
  .callback-summary .bad{ color:#ff8080; }
</style>
</head>
<body data-nav-group="">

<div id="site-nav"></div>

<div class="callback-wrap">
  <div class="callback-status" id="callback-status">Signing you in with Bungie.net…</div>
</div>

<script src="assets/api-keys.js"></script>
<script src="assets/oauth.js"></script>
<script src="assets/nav.js"></script>
<script>
(function(){
  const statusEl = document.getElementById("callback-status");
  const wrap = document.querySelector(".callback-wrap");

  // Shows exactly what the token exchange produced instead of silently
  // bouncing straight back — a mismatched field name from Bungie's
  // response would otherwise look identical to "still signed out" with
  // zero indication of why.
  RallyFlagAuth.completeCallback()
    .then((result) => {
      statusEl.textContent = result.isSignedIn ? "Signed in as " + (result.displayName || "Bungie.net user") : "Token exchange completed, but sign-in state didn't stick — see details below.";
      const cls = (ok) => ok ? "ok" : "bad";
      wrap.insertAdjacentHTML("beforeend",
        '<div class="callback-summary">' +
          'response fields: ' + result.responseKeys.join(", ") + '<br>' +
          'access_token: <span class="' + cls(result.hasAccessToken) + '">' + (result.hasAccessToken ? "present" : "missing") + '</span><br>' +
          'refresh_token: <span class="' + cls(result.hasRefreshToken) + '">' + (result.hasRefreshToken ? "present" : "missing") + '</span><br>' +
          'expires_in: ' + result.accessExpiresInSec + 's · refresh_expires_in: ' + result.refreshExpiresInSec + 's<br>' +
          'isSignedIn(): <span class="' + cls(result.isSignedIn) + '">' + result.isSignedIn + '</span>' +
        '</div>' +
        '<a class="callback-link" href="' + result.returnTo + '">Continue →</a>'
      );
    })
    .catch((err) => {
      statusEl.className = "callback-status callback-error";
      statusEl.textContent = "Sign-in failed: " + err.message;
      wrap.insertAdjacentHTML("beforeend", '<a class="callback-link" href="index.html">Back to Rally Flag</a>');
    });
})();
</script>

</body>
</html>
