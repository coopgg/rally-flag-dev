<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>/* Apply the saved theme + mode before first paint; nav.js does the rest. Keep in sync with getStoredTheme/getStoredModePref/resolveMode there. */(function(){var d=document.documentElement,T=["solar","void","arc","stasis","strand","prismatic"],t=null,p=null,o=null;try{t=localStorage.getItem("rallyflag_theme");if(T.indexOf(t)<0){t=T[Math.floor(Math.random()*T.length)];localStorage.setItem("rallyflag_theme",t);}p=localStorage.getItem("rallyflag_mode_pref");o=localStorage.getItem("rallyflag_mode");}catch(e){}if(T.indexOf(t)<0)t=T[Math.floor(Math.random()*T.length)];if(p!=="light"&&p!=="dark")p=o==="light"?"light":(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");d.setAttribute("data-theme",t);d.setAttribute("data-mode",p);d.classList.add("rf-boot");var u=function(){d.classList.remove("rf-boot")};document.addEventListener("DOMContentLoaded",function(){Promise.race([document.fonts?document.fonts.ready:0,new Promise(function(r){setTimeout(r,400)})]).then(function(){requestAnimationFrame(u)})});setTimeout(u,2500);})();</script>
<title>Signing in… - Rally Flag</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .callback-wrap{
    min-height:60vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:24px; gap:10px;
  }
  .callback-status{ font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--text-dim); }
  .callback-error{ color:#ff8080; max-width:480px; }
  .callback-detail{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-dimmer); max-width:480px; }
  .callback-actions{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px 20px; margin-top:16px; }
  .callback-retry{
    font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:700;
    color:var(--on-accent); background:var(--accent-fill); border:1px solid var(--accent-fill);
    padding:10px 22px; border-radius:999px; cursor:pointer;
  }
  .callback-link{ display:inline-block; padding:4px 0; color:var(--accent-bright); text-decoration:none; }
</style>
</head>
<body data-nav-group="">

<div id="site-nav"></div>

<main id="main-content" tabindex="-1">

<div class="callback-wrap">
  <div class="callback-status" id="callback-status">Signing you in with Bungie.net…</div>
</div>

</main>

<script src="assets/api-keys.js"></script>
<script src="assets/oauth.js"></script>
<script src="assets/nav.js"></script>
<script>
(function(){
  const statusEl = document.getElementById("callback-status");
  const wrap = document.querySelector(".callback-wrap");

  function showError(message, detail, returnTo, canRetry, retryLabel){
    statusEl.className = "callback-status callback-error";
    statusEl.textContent = message;
    if (detail) wrap.insertAdjacentHTML("beforeend", '<div class="callback-detail"></div>');
    if (detail) wrap.querySelector(".callback-detail").textContent = detail;
    const actions = document.createElement("div");
    actions.className = "callback-actions";
    if (canRetry){
      const retry = document.createElement("button");
      retry.type = "button"; retry.className = "callback-retry"; retry.textContent = retryLabel || "Try again";
      retry.addEventListener("click", () => RallyFlagAuth.signIn(returnTo));
      actions.appendChild(retry);
    }
    const back = document.createElement("a");
    back.className = "callback-link"; back.href = returnTo; back.textContent = "Back to Rally Flag \u2192";
    actions.appendChild(back);
    wrap.appendChild(actions);
  }

  RallyFlagAuth.completeCallback()
    .then((result) => {
      if (result.isSignedIn){
        // replace(), not href — the callback URL (with its one-time
        // ?code=&state=) shouldn't linger in history to be revisited.
        window.location.replace(result.returnTo);
        return;
      }
      showError("Sign-in completed, but the session didn't stick.", null, result.returnTo, true);
    })
    .catch((err) => {
      console.warn("Bungie sign-in failed:", err.kind, err.message);
      const returnTo = err.returnTo || RallyFlagAuth.getLastReturnTo();

      if (err.kind === "cancelled"){
        showError("Sign-in was cancelled.", null, returnTo, true);
        return;
      }
      // A reload / Back onto an already-finished callback: the code and
      // state were used up by the successful first visit. Nothing failed.
      if ((err.kind === "state" || err.kind === "code") && RallyFlagAuth.isSignedIn()){
        window.location.replace(returnTo);
        return;
      }
      // Anything else is usually transient (sign-in finished in another
      // tab, a network blip, a reused code). Start a fresh sign-in once —
      // the bungie.net session normally exists by now, so it completes
      // with no login form, exactly like clicking Sign in again.
      // This browser never started a sign-in: Bungie handed the visitor
      // back to a different browser or app than the one they began in —
      // e.g. an iPhone home-screen app, whose storage Safari can't see.
      if (err.kind === "state" && err.startedElsewhere){
        showError("This sign-in was started in another app or browser.",
          "Bungie sent you back here instead, and sign-ins can't move between them. Tap Sign in to finish signing in here.", returnTo, true, "Sign in");
        return;
      }
      if (RallyFlagAuth.claimAutoRetry()){
        statusEl.textContent = "Finishing sign-in\u2026";
        RallyFlagAuth.signIn(returnTo);
        return;
      }
      showError("We couldn't finish signing you in with Bungie.net.", "Details: " + err.message, returnTo, true);
    });
})();
</script>

</body>
</html>
