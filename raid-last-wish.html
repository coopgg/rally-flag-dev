<div id="encounter-subnav"><a href="#encounter-kalli-the-corrupted">Kalli, the Corrupted</a> <a href="#encounter-shuro-chi-the-corrupted">Shuro Chi, the Corrupted</a> <a href="#encounter-morgeth-the-spirekeeper">Morgeth, the Spirekeeper</a> <a href="#encounter-the-vault">The Vault</a> <a href="#encounter-riven-of-a-thousand-voices">Riven of a Thousand Voices</a> <a href="#encounter-riven-s-heart">Riven's Heart</a></div></div> <section id="content">Overview
<p>Last Wish was Destiny 2's first true modern raid, and it still has a reputation as one of the most mentally demanding raids in the series, not because the combat is brutal, but because nearly every encounter is a puzzle that needs constant callouts. If your team doesn't talk, this raid grinds to a halt fast.</p>
<h2>Encounters</h2>
<div id="encounters-body"><div id="encounter-kalli-the-corrupted">1
<h3>Kalli, the Corrupted</h3>
<strong>Objective</strong> Match six symbols around the room to matching floor plates, defend each plate long enough to spawn a Knight, then damage Kalli in short bursts while hiding from her wipe attack.
<strong>Roles</strong> One player per symbol, each responsible for finding and clearing their one matching plate.
<ol><li>Note the six symbols hanging around the central arena and assign one player to each symbol.</li><li>Find the matching symbol on a plate elsewhere in the room and stand on the safe section of that plate.</li><li>Survive three explosions from the plate, then kill the Knight that spawns to clear it.</li><li>Once all six plates are cleared, group up in the center and damage Kalli.</li><li>When she prepares her wipe attack, immediately take cover in one of the safe rooms that unlock below her. You'll do this a few times per damage phase.</li><li>Repeat the whole cycle with a new set of symbols until Kalli is dead.</li></ol>
<strong>What wipes you</strong> Standing on the wrong section of a plate when it explodes kills you instantly, and failing to reach a safe room before Kalli's wipe attack fires kills the whole team. Stepping onto a plate that doesn't actually match a symbol currently in the center also spawns an Ogre instead of clearing anything, so double check you've got the right plate before committing to it.</div><div id="encounter-shuro-chi-the-corrupted">2
<h3>Shuro Chi, the Corrupted</h3>
<strong>Objective</strong> Break Shuro Chi's shield with a laser weapon, damage her, and interrupt her wipe attack — twice per level across three levels — then solve a picture puzzle each time before the four-minute timer runs out.
<strong>Roles</strong> Three players handle the laser weapon together; others rotate through picking up the item dropped by Eye of Riven, a special Taken Captain, to interrupt her wipe attack (the same player can't reuse it right away) and solving the puzzle room.
<ol><li>Push forward and clear enemies until you reach Shuro Chi, then defeat Eye of Riven, a special Taken Captain that drops the item needed to interrupt her wipe attack.</li><li>Pick up the laser-type weapon, get into position, and form a triangle of laser fire with your team to strip her shield.</li><li>Damage her until a chunk of health is removed, then have the item-holder use their ability the moment she starts her wipe attack to interrupt it.</li><li>Repeat the shield-break-and-damage cycle a second time on the same level — since the interrupt item can't be reused right away, hand it off to a different player this round.</li><li>Enter the puzzle room, split up to man the floor buttons, and recreate each picture in sequence to reset the timer.</li><li>Climb up to the next level and repeat the entire process: three levels total, each needing two damage windows and one puzzle.</li></ol>
<strong>What wipes you</strong> The four-minute timer wipes the team if it runs out before the puzzle is solved, and failing to interrupt her wipe attack in time does the same. Speed matters as much as accuracy here.</div><div id="encounter-morgeth-the-spirekeeper">3
<h3>Morgeth, the Spirekeeper</h3>
<strong>Objective</strong> Collect a set of Taken Strength orbs before the boss reaches full power, then damage his exposed back while managing who's allowed to carry what.
<strong>Roles</strong> Split into two groups covering each side of the arena; each group has its own dedicated player responsible for rescuing anyone who gets locked down.
<ol><li>Collect Taken Strength orbs that spawn around the arena before Morgeth absorbs them. Each player can safely hold two at once — a third kills you instantly, there's no freeze chance at that point.</li><li>At two stacks, a player can instead get hit with Umbral Enervation and frozen in place. A player with zero stacks of their own needs to kill Eye of Riven, a special Taken Captain, grab the item it drops, and use it to cleanse them — cleansing transfers the trapped player's two stacks onto you, so going in already holding any is how you kill yourself instead. The freed player can then start collecting again from zero.</li><li>Once every orb is collected, group up and unload damage on Morgeth's exposed back.</li><li>Watch for homing projectiles during the damage phase and shoot them down before they connect.</li><li>When Morgeth's power meter gets close to full, the same item must be used on him directly to interrupt the wipe and keep the damage phase going.</li></ol>
<strong>What wipes you</strong> Picking up a third Taken Strength stack instantly kills you, cleansing a trapped teammate while already holding stacks of your own can do the same, and letting Morgeth's power hit maximum wipes the whole team. Clear callouts about who's carrying what and who's free to cleanse are what keep this fight from unraveling.</div><div id="encounter-the-vault">4
<h3>The Vault</h3>
<strong>Objective</strong> Identify matching symbols across three rooms and cleanse the correct locks with Penumbra or Antumbra energy, all within a tight timer.
<strong>Roles</strong> Three players each hold down one room and read out their symbols; whoever kills the right enemy carries the cleansing energy to the correct lock.
<ol><li>Stand on the three locks at once to reveal symbols, then call out your center symbol and figure out which other room has a matching duplicate.</li><li>Kill Eye of Riven, the special Taken Captain that spawns, to claim the item it drops, which grants either Penumbra or Antumbra — this tells you whether the matching lock needs to be cleansed on the left-duplicate or right-duplicate side.</li><li>Carry that Penumbra or Antumbra energy through the connecting tunnels to the correct lock and cleanse it.</li><li>Repeat until all three locks are cleared, which opens a beam of light and restarts the whole process.</li><li>Do this a total of three times to fully open the vault door.</li></ol>
<strong>What wipes you</strong> Using the wrong energy type — Penumbra or Antumbra — on a lock kills you and anyone nearby, and letting an enemy Knight reach and strike an active lock wipes the team. This is a math-and-communication encounter more than a combat one.</div><div id="encounter-riven-of-a-thousand-voices">5
<h3>Riven of a Thousand Voices</h3>
<strong>Objective</strong> Split into two rooms to cleanse symbols and call out Riven's glowing eyes, repeat that on a second floor, then finish with a long multi-stage damage sequence.
<strong>Roles</strong> Two teams of three cover separate rooms early on; later, the whole team works together calling out and remembering assigned eyes.
<ol><li>Split into two groups of three and head into separate rooms below the starting platform.</li><li>In whichever room Riven appears, damage her until she staggers and two of her eyes start glowing, then call those out to the other room immediately.</li><li>In whichever room Eye of Riven appears instead, kill it, grab the item it drops, and use callouts from a teammate to cleanse the correct symbol.</li><li>When Riven enters a room with her mouth open, damage the glowing target inside it, then destroy the correct eyes the instant her mouth closes.</li><li>Move up a level and repeat the same process a second time.</li><li>On the top floor, work together as one team, damaging Riven and remembering an assigned eye each of the three times she appears, then destroy your assigned eye during the final damage window.</li><li>Ride down together shooting her exposed weak points as you descend, and repeat the whole cycle until her health is nearly gone.</li><li>Once she's almost dead, work through a jumping section under a stacking Creeping Darkness debuff to reach a light at the top, then return for her final stand and finish the damage before dashing into her mouth to destroy her heart.</li></ol>
<strong>What wipes you</strong> Destroying the wrong eyes (or missing the short window to destroy the right ones) wipes the team almost every time this fight goes wrong, so treat the callouts as more important than your own damage numbers.</div><div id="encounter-riven-s-heart">6
<h3>Riven's Heart</h3>
<strong>Objective</strong> Carry Riven's heart back through the raid to the altar near the Vault, passing it off between players as the timer runs out.
<strong>Roles</strong> One player carries the heart at a time; everyone else stays close to avoid a stacking debuff, and clears the path ahead.
<ol><li>Whoever is chosen picks up the heart and starts moving. Everyone else needs to stay within its glow or they'll build up a stacking debuff that eventually kills them.</li><li>When the carrier's timer runs low, they'll vanish into another realm, where collecting a set of light beams together can reset their clock once.</li><li>As soon as one carrier disappears, the next player is automatically chosen to pick up the heart and keep moving.</li><li>Clear a path back through the raid toward the Vault section, since the heart carrier can only walk and single-jump.</li><li>Continue the relay of carriers until the heart reaches the altar, which ends the raid automatically.</li></ol>
<strong>What wipes you</strong> Letting the Creeping Darkness debuff reach its max stack kills whoever's affected, and losing too many carriers to enemies mid-transport can stall the whole relay. Keep the path clear ahead of whoever's currently carrying it.</div></div><a href="puzzle-helper.html?tool=wall-of-wishes">Wall of Wishes Reference

<a href="armor-set-bonuses.html?highlight=great-hunt">Great Hunt →</a></section>
</noscript>
</main>

<footer>
  <div>Unofficial fan project. Not affiliated with or endorsed by Bungie.</div>
</footer>

<script src="assets/game-terms.js"></script>
<script src="assets/art-tints.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/raids-data.js"></script>
<script src="assets/sets-data.js"></script>
<script>
(function(){
  // Generated per-raid pages (raid-<slug>.html, tools/build-guide-pages.js)
  // set GUIDE_SLUG. On this template page, an old ?slug= link forwards to
  // the raid's own page, whose static tags give proper link previews.
  const slug = window.GUIDE_SLUG || new URLSearchParams(window.location.search).get("slug");
  const raid = window.RaidsData.RAIDS.find(r => r.slug === slug);
  if (raid && !window.GUIDE_SLUG){
    location.replace(window.rallyFlagGuideHref("raid", raid.slug) + location.hash);
    return;
  }
  const content = document.getElementById("content");

  if (!raid){
    document.getElementById("raid-title").textContent = "Raid not found";
    content.innerHTML = '<div class="not-found panel-card block">Head back to <a href="raids.html">the raid list</a> and pick one from there.</div>';
    return;
  }

  document.title = raid.name + " Raid Guide - Rally Flag";
  document.getElementById("raid-title").textContent = raid.name;
  // Header sits over the raid's official art.
  if (raid.art){
    const hero = document.getElementById("hero");
    hero.classList.add("has-art");
    const tint = window.rallyFlagArtTint(raid.art); // its colour shows until the art loads
    hero.insertAdjacentHTML("afterbegin", '<div class="hero-art"' + (tint ? ' style="background-color:' + tint + '"' : "") + '><img src="' + window.rallyFlagArtUrl(raid.art) + '" alt="" fetchpriority="high"></div>');
  }
  document.getElementById("raid-difficulty").textContent = raid.difficulties ? raid.difficulties.join(" · ") : "";

  function slugify(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function encounterAnchorId(e, i){
    return "encounter-" + (e.name ? slugify(e.name) : (i + 1));
  }

  let activeDifficulty = "Normal";
  function currentEncounters(){
    return (activeDifficulty === "Epic" && raid.epicEncounters) ? raid.epicEncounters : raid.encounters;
  }

  const encounterSubnavEl = document.getElementById("encounter-subnav");
  function renderSubnav(){
    const encounters = currentEncounters();
    if (encounters.length){
      encounterSubnavEl.style.display = "";
      encounterSubnavEl.innerHTML = encounters.map((e, i) =>
        '<a href="#' + encounterAnchorId(e, i) + '">' + e.name + '</a>'
      ).join("");
    } else {
      encounterSubnavEl.style.display = "none";
    }
  }
  renderSubnav();
  encounterSubnavEl.addEventListener("click", (ev) => {
    const link = ev.target.closest("a");
    if (!link) return;
    const target = document.querySelector(link.getAttribute("href"));
    if (!target) return;
    ev.preventDefault();
    target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    history.replaceState(null, "", link.getAttribute("href"));
  });

  const setsBySlug = {};
  window.ArmorSetsData.SETS.forEach(s => setsBySlug[s.slug] = s);

  const setLinksHtml = raid.armorSlugs.map(slug => {
    const set = setsBySlug[slug];
    const label = set ? set.name : slug;
    return '<a class="set-link" href="armor-set-bonuses.html?highlight=' + slug + '">' + label + ' \u2192</a>';
  }).join("");

  function buildEncountersHtml(encounters){
    return encounters.length
    ? encounters.map((e, i) => {
        if (e.objective || e.steps){
          const hl = window.GameTerms.highlight;
          const stepsHtml = (e.steps || []).map(s => '<li>' + hl(s) + '</li>').join("");
          const mapHtml = e.mapImage
            ? '<div class="encounter-map"><img src="' + e.mapImage.url + '" alt="' + e.name + ' encounter map" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.mapImage.credit +
              (e.mapImage.creditUrl ? ' · <a href="' + e.mapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const secondaryMapHtml = e.secondaryMapImage
            ? '<div class="encounter-map"><img src="' + e.secondaryMapImage.url + '" alt="' + e.name + ' encounter map variant" loading="lazy">' +
              '<div class="encounter-map-credit">' + e.secondaryMapImage.credit +
              (e.secondaryMapImage.creditUrl ? ' · <a href="' + e.secondaryMapImage.creditUrl + '" target="_blank" rel="noopener">original post</a>' : '') +
              '</div></div>'
            : '';
          const strategyHtml = e.strategyImage
            ? '<div class="encounter-map"><img src="' + e.strategyImage.url + '" alt="' + e.name + ' strategy diagram" loading="lazy">' +
              (e.strategyImage.label ? '<div class="encounter-map-label">' + e.strategyImage.label + '</div>' : '') +
              '</div>'
            : '';
          const advancedHtml = (e.advancedTactics && e.advancedTactics.length)
            ? '<div class="encounter-advanced">' +
                '<button class="encounter-advanced-toggle" type="button"><span class="caret">\u25b8</span> Advanced tactic (optional)</button>' +
                '<div class="encounter-advanced-body">' +
                  e.advancedTactics.map(t => '<p>' + hl(t) + '</p>').join("") +
                '</div>' +
              '</div>'
            : '';
          const encounterPuzzleHelperHtml = e.puzzleHelper
            ? '<a class="block panel-card puzzle-helper-link encounter-puzzle-helper-link" href="puzzle-helper.html?tool=' + e.puzzleHelper.slug + '">' +
                '<div>' +
                  '<div class="puzzle-helper-link-title">' + e.puzzleHelper.title + '</div>' +
                  '<div class="puzzle-helper-link-sub">' + e.puzzleHelper.blurb + '</div>' +
                '</div>' +
                '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
              '</a>'
            : '';
          return '<div class="block panel-card encounter-card" id="' + encounterAnchorId(e, i) + '">' +
            '<div class="encounter-head"><div class="encounter-num">' + (i + 1) + '</div><h3 class="encounter-title">' + e.name + '</h3></div>' +
            (e.objective ? '<div class="encounter-field"><span class="encounter-field-label">Objective</span>' + hl(e.objective) + '</div>' : '') +
            (e.roles ? '<div class="encounter-field"><span class="encounter-field-label">Roles</span>' + hl(e.roles) + '</div>' : '') +
            mapHtml +
            secondaryMapHtml +
            strategyHtml +
            (stepsHtml ? '<ol class="encounter-steps">' + stepsHtml + '</ol>' : '') +
            (e.wipe ? '<div class="encounter-wipe"><span class="encounter-wipe-label">What wipes you</span>' + hl(e.wipe) + '</div>' : '') +
            (e.master ? '<div class="encounter-master"><span class="encounter-master-label">On Master</span>' + hl(e.master) + '</div>' : '') +
            advancedHtml +
            encounterPuzzleHelperHtml +
          '</div>';
        }
        // Fallback for older, simpler encounter entries
        return '<div class="block panel-card encounter-card encounter-row" id="' + encounterAnchorId(e, i) + '"><div class="encounter-num">' + (i + 1) + '</div>' +
          '<div><div class="encounter-name">' + e.name + '</div><div class="encounter-notes">' + (e.notes || "") + '</div></div></div>';
      }).join("")
    : '<div class="block panel-card"><div class="block-empty">Encounter notes coming soon.</div></div>';
  }

  const difficultyToggleHtml = raid.epicEncounters
    ? '<div class="difficulty-toggle" id="difficulty-toggle">' +
        '<button type="button" class="difficulty-toggle-btn active" data-difficulty="Normal">Normal</button>' +
        '<button type="button" class="difficulty-toggle-btn" data-difficulty="Epic">Epic</button>' +
      '</div>'
    : '';

  const puzzleHelperHtml = raid.puzzleHelper
    ? '<a class="block panel-card puzzle-helper-link" href="puzzle-helper.html?tool=' + raid.puzzleHelper.slug + '">' +
        '<div>' +
          '<div class="puzzle-helper-link-title">' + raid.puzzleHelper.title + '</div>' +
          '<div class="puzzle-helper-link-sub">' + raid.puzzleHelper.blurb + '</div>' +
        '</div>' +
        '<div class="puzzle-helper-link-arrow">Open tool &rarr;</div>' +
      '</a>'
    : '';

  const raidMasterNoteHtml = (raid.difficulties && raid.difficulties.includes("Master"))
    ? '<div class="raid-master-note"><span class="raid-master-note-label">Master Difficulty</span>' +
        "Master raises enemies well above the raid's Normal Power level — expect a Power deficit unless you're specifically geared for it — and every hit lands harder across the board. Several encounters also add Champions (Barrier, Overload, or Unstoppable) that don't appear on Normal; check the callout under an affected encounter below for which ones and where." +
      '</div>'
    : '';

  content.innerHTML =
    '<div class="block panel-card">' +
      '<div class="block-label">Overview</div>' +
      (raid.summary ? '<p>' + raid.summary + '</p>' : '<div class="block-empty">Overview coming soon.</div>') +
      raidMasterNoteHtml +
    '</div>' +
    '<div class="block-label-row encounters-head"><h2 class="block-label">Encounters</h2>' + difficultyToggleHtml + '</div>' +
    '<div id="encounters-body">' + buildEncountersHtml(currentEncounters()) + '</div>' +
    puzzleHelperHtml +
    '<div class="block panel-card">' +
      '<div class="block-label">Armor Sets From This Raid</div>' +
      '<div class="set-links">' + setLinksHtml + '</div>' +
    '</div>';

  content.addEventListener("click", (ev) => {
    const advToggle = ev.target.closest(".encounter-advanced-toggle");
    if (advToggle){
      advToggle.closest(".encounter-advanced").classList.toggle("open");
      return;
    }
    const diffBtn = ev.target.closest(".difficulty-toggle-btn");
    if (diffBtn){
      const newDifficulty = diffBtn.dataset.difficulty;
      if (newDifficulty === activeDifficulty) return;
      activeDifficulty = newDifficulty;
      content.querySelectorAll(".difficulty-toggle-btn").forEach(b => b.classList.toggle("active", b.dataset.difficulty === activeDifficulty));
      document.getElementById("encounters-body").innerHTML = buildEncountersHtml(currentEncounters());
      renderSubnav();
    }
  });
})();
</script>
<script src="assets/your-clears.js"></script>
</body>
</html>
